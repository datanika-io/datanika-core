# Authentik IdP for SSO E2E tests (QA Q3).
#
# Spins up a disposable Authentik instance on localhost:9000 with a
# pre-configured admin user. The bootstrap script (scripts/bootstrap-authentik.sh)
# creates OIDC + SAML applications via the Authentik API after first boot.
#
# Usage:
#   docker compose -f e2e/docker-compose.test.yml up -d
#   bash e2e/scripts/bootstrap-authentik.sh   # creates IdP apps
#   DATANIKA_E2E_SSO_AUTHENTIK=1 npx playwright test sso-
#   docker compose -f e2e/docker-compose.test.yml down -v
#
# The compose file is self-contained — no dependency on the main
# docker-compose.yml. Ports deliberately avoid conflict with the main
# stack (9000 vs 3000/8000).
#
# ⚠️ Two things below are about WHERE this runs, not about Authentik (core#714).
# In CI this is started on pointer.gr — the box that also serves PRODUCTION and two
# unrelated co-tenants — so it is not a throwaway laptop stack:
#
#   1. `127.0.0.1:9000:9000`, never `9000:9000`. Every other Datanika port on that box
#      binds loopback (only 22/80/443 are public); a bare `9000:9000` would publish an
#      Authentik carrying the hardcoded admin credentials below to the internet. The CI
#      topology does not need more: `ssh -L 9000:localhost:9000` resolves `localhost`
#      on the REMOTE side, so loopback is sufficient. Verified on pointer.gr 2026-08-31.
#   2. `mem_limit` on every service. Authentik is transient here but it shares 8 GB with
#      production; an unbounded IdP OOMing that box is a prod outage, not a failed test.
#      Measured peak on pointer.gr 2026-08-31: server 105 MiB, worker 199 MiB, db 59 MiB,
#      redis 4 MiB — 367 MiB total, so these limits are ~3x headroom, not a squeeze.

services:
  authentik-db:
    image: postgres:16-alpine
    mem_limit: 256m
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik-test-pw
    volumes:
      - authentik-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 5s
      timeout: 3s
      retries: 10

  authentik-redis:
    image: redis:7-alpine
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.12
    command: server
    mem_limit: 1g
    environment:
      AUTHENTIK_SECRET_KEY: e2e-test-secret-key-not-for-production
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-test-pw
      # Bootstrap admin credentials — used by bootstrap-authentik.sh
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@datanika.test
      AUTHENTIK_BOOTSTRAP_PASSWORD: e2e-admin-password
      AUTHENTIK_BOOTSTRAP_TOKEN: e2e-bootstrap-token
    ports:
      # Loopback only — see the note at the top of this file. This is started on the
      # shared production box in CI; `ssh -L` reaches it, the internet must not.
      - "127.0.0.1:9000:9000"
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12
    command: worker
    mem_limit: 1g
    environment:
      AUTHENTIK_SECRET_KEY: e2e-test-secret-key-not-for-production
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-test-pw
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

volumes:
  authentik-pg:
