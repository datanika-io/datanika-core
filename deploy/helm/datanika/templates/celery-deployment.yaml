apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datanika.fullname" . }}-celery
  labels:
    {{- include "datanika.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery
spec:
  replicas: {{ .Values.celery.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "datanika.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery
  template:
    metadata:
      labels:
        {{- include "datanika.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery
    spec:
      serviceAccountName: {{ include "datanika.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: celery
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            {{- toYaml .Values.celery.command | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "datanika.fullname" . }}-env
          volumeMounts:
            - name: dbt-projects
              mountPath: /app/dbt_projects
          resources:
            {{- toYaml .Values.celery.resources | nindent 12 }}
      volumes:
        - name: dbt-projects
          persistentVolumeClaim:
            claimName: {{ include "datanika.fullname" . }}-dbt-projects
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
