# FreeTDS client settings for the pymssql driver (core#1441).
#
# pymssql carries its own FreeTDS inside the wheel. Importing the datanika package points
# FREETDSCONF at this file (datanika/pymssql_freetds.py), so every SQL Server and Synapse
# connection that goes through pymssql reads it: Test Connection, the upload source and
# catalog reads.
#
# FreeTDS reads a comment only from a line that starts with '#' or ';'. Do not put one after a
# value on the same line.
#
# encryption = require: FreeTDS's setting for an encrypted session. That the session IS
# encrypted is asserted from the server's own sys.dm_exec_connections, never from this line:
# tests/test_services/test_pymssql_sessions_are_encrypted.py.
#
# No "ca file": the server certificate is not verified, as for the SQL Server and Synapse
# destinations (core#1379). That is a documented limitation. Verifying would refuse every
# self-signed server, which is SQL Server's default, so it is a product decision.
[global]
	encryption = require
