name: Nightly Connector Smoke

# Lightweight live-API probe against every paid connector sandbox with
# provisioned credentials. See tests/test_connector_smoke/ for the checks
# and PLAN_QA.md §P1 Connector Smoke Matrix for the rationale.
#
# Fails loud (Telegram) when a vendor API change, credential rotation,
# or account expiry would silently break Datanika's connector code.

on:
  schedule:
    # 03:00 UTC daily — off-peak in EU, US, and APAC. Vendor APIs are
    # least likely to be under maintenance windows at this time.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-connector-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # QA_CONNECTOR_CREDENTIALS + QA_BIGQUERY_SA_JSON secrets are scoped
    # to the `production` environment. Without this line the job runs
    # without those secrets and the credential-gate fails loud.
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Locked tree, not a fresh resolution (core#470) — a connector smoke
          # that runs different library versions than prod proves nothing about
          # prod, which is the whole point of this job.
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps
          # Connector-specific libs not in core deps.
          # kafka-python must be >=2.1 — 2.0.x imports kafka.vendor.six.moves,
          # which is gone in Python 3.12, so the probe would die at import and
          # the test's `except ImportError: pytest.skip` would turn a broken
          # Kafka smoke into a silent green. Pin the floor, don't rely on the skip.
          uv pip install --system \
            "google-cloud-bigquery>=3.0" \
            "google-analytics-data>=0.18" \
            "kafka-python>=2.1"

      - name: Materialize connector credentials
        env:
          # Aggregate base64'd env file — set in GitHub secrets from
          # secrets/qa-connectors.env on the dev host. Rotate bundle
          # whenever any individual cred rotates.
          QA_CONNECTOR_CREDENTIALS: ${{ secrets.QA_CONNECTOR_CREDENTIALS }}
          QA_BIGQUERY_SA_JSON: ${{ secrets.QA_BIGQUERY_SA_JSON }}
        run: |
          if [ -z "$QA_CONNECTOR_CREDENTIALS" ]; then
            echo "::error::QA_CONNECTOR_CREDENTIALS secret is not set — nothing to test"
            exit 1
          fi
          mkdir -p secrets
          # Decode env file and export every KEY=VALUE pair into $GITHUB_ENV
          printf '%s' "$QA_CONNECTOR_CREDENTIALS" | base64 -d > /tmp/creds.env
          while IFS= read -r line; do
            # Skip comments + blanks
            case "$line" in ''|\#*) continue ;; esac
            # Strip surrounding double-quotes from value — $GITHUB_ENV
            # parser treats quotes as literal chars (unlike bash/python-dotenv).
            # Without this, httpx rejects URLs like ""https://..."" (core#270).
            #
            # ⚠️ The character class MUST carry digits (core#827). It was `[A-Z_]+`,
            # which does not match a name like `GA4_PROPERTY_ID` or `S3_BUCKET`, so
            # those lines fell through unchanged and reached $GITHUB_ENV with their
            # quotes still attached — i.e. core#270's bug, re-created for every
            # variable whose name contains a digit. Invisible from both ends: the
            # file has the value and the secret is non-empty; only the consumer sees
            # a value wrapped in literal quote characters.
            line=$(echo "$line" | sed -E 's/^([A-Z_][A-Z0-9_]*)="(.*)"$/\1=\2/')
            echo "$line" >> "$GITHUB_ENV"
          done < /tmp/creds.env
          rm /tmp/creds.env

          # BigQuery service-account JSON is a separate secret (multi-line
          # JSON doesn't fit cleanly in the aggregate env file).
          if [ -n "$QA_BIGQUERY_SA_JSON" ]; then
            printf '%s' "$QA_BIGQUERY_SA_JSON" > secrets/qa-bigquery-sa.json
            chmod 600 secrets/qa-bigquery-sa.json
          fi

      - name: Materialize Wave-1 connector credentials
        env:
          # Second aggregate base64'd env file — the SaaS Wave-1 trio
          # (Pipedrive / Freshdesk / Asana). Kept separate from
          # QA_CONNECTOR_CREDENTIALS so the two cred sets can rotate
          # independently. Built from secrets/{pipedrive,freshdesk,asana}.env.
          QA_WAVE1_CREDENTIALS: ${{ secrets.QA_WAVE1_CREDENTIALS }}
        run: |
          if [ -z "$QA_WAVE1_CREDENTIALS" ]; then
            echo "::error::QA_WAVE1_CREDENTIALS secret is not set — Wave-1 SaaS probes cannot run"
            exit 1
          fi
          printf '%s' "$QA_WAVE1_CREDENTIALS" | base64 -d > /tmp/wave1.env
          while IFS= read -r line; do
            case "$line" in ''|\#*) continue ;; esac
            # Digits in the class — see the note on the same sed above (core#827).
            line=$(echo "$line" | sed -E 's/^([A-Z_][A-Z0-9_]*)="(.*)"$/\1=\2/')
            echo "$line" >> "$GITHUB_ENV"
          done < /tmp/wave1.env
          rm /tmp/wave1.env

      - name: Run connector smoke tests
        id: smoke
        env:
          DATANIKA_CONNECTOR_SMOKE: "1"
        # A skipped probe is worse than a failing one: it reports green while
        # testing nothing. Missing creds and un-importable client libs now FAIL
        # rather than skip (tests/test_connector_smoke/conftest.py), so a healthy
        # run has ZERO skips — which makes "any skip at all" a usable alarm.
        #
        # This catches the one hole strict mode cannot: if DATANIKA_CONNECTOR_SMOKE
        # above were dropped or misspelled, the gate would skip all probes at
        # collection time and pytest would still exit 0 — a perfectly green
        # nightly that tested nothing.
        #
        # 🚨 `set -o pipefail` is the whole point of this block (core#827), and its
        # absence is what made this job report `success` while running
        # `12 failed, 9 passed` for EIGHT consecutive nights, with the Telegram step
        # `skipped` every time. A pipeline's status is its LAST command's — `tee`,
        # which always succeeds — and GitHub's default `run:` shell is `bash -e {0}`
        # WITHOUT `-o pipefail`. So pytest's exit code was discarded and the only
        # thing that could still fail the step was the skip grep below.
        #
        # The two halves composed into the hole: the conftest was deliberately
        # changed to turn missing creds into FAILURES rather than skips (so that
        # "any skip" became a usable alarm), which moved every real failure into
        # precisely the blind spot the pipe had created. Both changes were right on
        # their own. Same defect and same fix as landing#339.
        #
        # `${PIPESTATUS[0]}` rather than plain `-e`: under `set -e` the step would
        # abort on the pytest line and the skip guard would never run, so a run that
        # both failed AND skipped would report only the failure. Both signals are
        # worth having, and the skip guard is the more specific diagnosis.
        run: |
          set -o pipefail
          rc=0
          pytest tests/test_connector_smoke/ -v --tb=short -rs | tee /tmp/smoke.log || rc=$?

          if grep -qE '[0-9]+ skipped' /tmp/smoke.log; then
            echo "::error::Smoke probes were SKIPPED — a skipped probe reports green while testing nothing. Check that DATANIKA_CONNECTOR_SMOKE=1 is still set on this step and that every credential is present in QA_CONNECTOR_CREDENTIALS."
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::Connector smoke probes FAILED (pytest exit $rc). Open the log above and find the first FAILED test — this step no longer launders pytest's exit code through the pipe to tee (core#827)."
            exit "$rc"
          fi

      - name: Telegram alert on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TEXT=$(printf '\xf0\x9f\x94\xa5 *Nightly connector smoke failed*\n\nOne or more paid-connector sandboxes failed auth + metadata probe.\n\n*Triage*: open the run link, look for the first FAILED test. Likely causes (in order of frequency):\n- Credential rotated / expired (Stripe, HubSpot PATs rotate silently)\n- Sandbox/trial expired (Databricks 14-day trial)\n- Vendor API shape changed (rare but catches it early)\n\n*Run*: %s\n\nSee PLAN_HUMAN_LOCKERS.md §"QA test credentials" for how to reprovision.' "$RUN_URL")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=Markdown"

  # Oracle runs in its own job with an ephemeral XE service container, isolated
  # from the SaaS probes above so an Oracle image/boot hiccup can't mask a real
  # SaaS-credential expiry (the point of the nightly). Oracle has no offline
  # live-DB unit test, so this is the only place the real oracledb thin driver
  # is exercised end-to-end (core#312, connectors Wave-1).
  oracle-smoke:
    runs-on: ubuntu-latest
    # Only for the Telegram token; the Oracle creds below are for an ephemeral
    # throwaway container, not secrets (mirrors the postgres test:test pattern
    # in ci.yml's migration-roundtrip job).
    environment: production
    timeout-minutes: 20
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: DatanikaSmoke1
          APP_USER: datanika_smoke
          APP_USER_PASSWORD: DatanikaSmoke1
        # gvenzl ships healthcheck.sh on PATH; GH Actions waits for the service
        # to be healthy before any step runs. Generous retries for cold boot.
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # oracledb + sqlalchemy are core deps; ".[dev]" pulls pytest. No
        # BigQuery/Kafka extras needed for the Oracle probe.
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps

      - name: Oracle XE connection env
        run: |
          {
            echo "ORACLE_HOST=localhost"
            echo "ORACLE_PORT=1521"
            echo "ORACLE_SERVICE=XEPDB1"
            echo "ORACLE_USER=datanika_smoke"
            echo "ORACLE_PASSWORD=DatanikaSmoke1"
          } >> "$GITHUB_ENV"

      - name: Run Oracle connector smoke + E2E tests
        env:
          DATANIKA_CONNECTOR_SMOKE: "1"
        # Both Wave-1 files' oracle-named tests: the auth/metadata smoke and the
        # extract→load→assert E2E (core#311). `-k oracle` deselects the SaaS tests,
        # which need creds this isolated container-only job doesn't have.
        run: >-
          pytest
          tests/test_connector_smoke/test_wave1_connectors_smoke.py
          tests/test_connector_smoke/test_wave1_connectors_extract_load.py
          -v --tb=short -k oracle

      - name: Telegram alert on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TEXT=$(printf '\xf0\x9f\x94\xa5 *Nightly Oracle connector smoke failed*\n\nThe Oracle XE probe failed. Unlike the SaaS probes this is self-contained (ephemeral XE container), so a failure points at OUR code or the image, not a vendor.\n\n*Triage*: open the run link. Likely causes:\n- oracledb thin-driver break / version bump\n- gvenzl/oracle-xe image or service-name (XEPDB1) drift\n- connection_service._build_sa_url Oracle regression\n\n*Run*: %s' "$RUN_URL")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=Markdown"
