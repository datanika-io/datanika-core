[project]
name = "datanika"
version = "0.1.0"
description = "Multi-tenant data pipeline management platform with dlt + dbt"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    # Data pipeline — pinned to tested versions; bump deliberately
    "dlt[postgres,snowflake,bigquery,mssql,clickhouse,duckdb,databricks,synapse]>=1.21,<2",
    "dbt-core>=1.7.19,<1.8",
    "dbt-postgres>=1.7,<1.8",
    "dbt-snowflake>=1.7,<1.8",
    "dbt-bigquery>=1.7,<1.8",
    "dbt-redshift>=1.7,<1.8",
    "dbt-mysql>=1.7,<1.8",
    "dbt-sqlserver>=1.7,<1.8",
    "dbt-clickhouse>=1.7,<1.8",
    "dbt-duckdb>=1.7,<1.8",
    # dbt-databricks requires sqlalchemy<2.0, incompatible with our stack
    # dbt-synapse requires sqlalchemy<2.0, incompatible with our stack
    # Both platforms work as dlt destinations — dbt transforms deferred until adapter compat

    # SaaS source dependencies (optional — needed only for dlt verified sources,
    # REST API fallback works without these)
    # "stripe>=5.0",
    # "simple-salesforce>=1.12",
    # "pyairtable>=2.0",
    # "facebook-business>=19.0",
    # "google-analytics-data>=0.18",
    # "google-ads>=24.0",
    # "confluent-kafka>=2.3",

    # Google Sheets
    "gspread>=6.0",
    "google-auth>=2.0",

    # SQL drivers
    "pymysql>=1.1",
    "pymssql>=2.2",
    "pymongo>=4.0",
    "clickhouse-connect>=0.7",
    "duckdb>=1.0",
    "snowflake-sqlalchemy>=1.7",
    "sqlalchemy-bigquery>=1.11",

    # Web framework
    "reflex>=0.7",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # Auth
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",

    # Task queue & scheduling
    "celery[redis]>=5.4",
    "redis>=5.0",
    "apscheduler>=3.10",

    # Config & utilities
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "cryptography>=44.0",

    # Monitoring
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "httpx>=0.28",
    "mcp>=1.0.0",
    # Round-trip migration test auto-provisions Postgres via Docker.
    # Skipped gracefully if Docker is unavailable (see tests/test_migrations/test_roundtrip.py).
    "testcontainers[postgres]>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
