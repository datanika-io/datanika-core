# GitHub Actions CD for the pointer.gr prod box — build-from-source + SSH transfer.
# Ready-to-commit artifact (NOT yet on GitHub). Destination once activated:
#   datanika-core/.github/workflows/deploy-pointer.yml
#
# Why a new workflow (not the existing `deploy` job): the old job does
# `git pull origin master` + `docker compose pull` (GHCR) — BOTH impossible on
# the new box (no GitHub auth, GHCR image pruned). This builds from source on
# the runner-transferred tree instead. The box never authenticates to GitHub;
# GHA -> box SSH is the only trust anchor.
#
# Prereqs (set up 2026-07-17 or pending — see PLAN_INFRASTRUCTURE.md I3c):
#   - GHA secrets on datanika-core: POINTER_HOST (185.25.22.188), POINTER_SSH_KEY
#     (private half of a deploy key whose public half is in the box authorized_keys),
#     CLOUD_REPO_TOKEN (already exists — cross-repo cloud checkout).
#   - Box .env.docker is preserved (gitignored -> never in the checkout/tarball).
#
# Trigger is workflow_dispatch ONLY at first: the first run upgrades prod from the
# restored #269 tree to whatever master HEAD is (currently ~#294) — a real prod
# upgrade to validate once. Enable the push trigger only after that.

name: Deploy to pointer.gr (prod)

on:
  workflow_dispatch: {}
  push:
    branches: [master]

concurrency:
  group: deploy-pointer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          path: datanika
      - name: Checkout cloud
        uses: actions/checkout@v6
        with:
          repository: datanika-io/datanika-cloud
          token: ${{ secrets.CLOUD_REPO_TOKEN }}
          # Pinned, not inherited. With no `ref:` this took cloud's DEFAULT branch —
          # which IS `master`, so the behaviour is unchanged and prod has always been
          # built from the right pair. It was correct by repository setting, though,
          # not by anything stated here: flipping cloud's default branch would have
          # silently started deploying cloud `dev` to production, with nothing in this
          # file to contradict it. cloud#110 is the same omission one severity lower.
          #
          # `master` unconditionally, including on workflow_dispatch: this job deploys
          # production, and production is the master/master pair. A dispatch from a core
          # feature branch still gets cloud `master` — same as today, now on purpose.
          ref: master
          path: datanika-cloud
      - name: Build source tarball
        run: |
          tar czf /tmp/src.tgz --exclude-vcs --exclude='*/.venv' --exclude='datanika/.web' \
            --exclude='*/node_modules' --exclude='*/__pycache__' \
            --exclude='datanika/.env' --exclude='datanika/.env.docker' \
            datanika datanika-cloud
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.POINTER_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.POINTER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # Keepalive: the build step's ~5-8 min silent lxml/xmlsec source-compile
          # otherwise drops the SSH session (client_loop: send disconnect: Broken pipe).
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 120\n  TCPKeepAlive yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Transfer source (box .env.docker preserved)
        run: cat /tmp/src.tgz | ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" 'cd /opt/datanika && tar xzf -'

      # Bound docker's disk growth BEFORE building, not after. core#666.
      #
      # Timing is the whole design. Pruning after the swap verifies but before the old
      # colour stops would hit an image that is still serving; pruning after it stops
      # would hit the rollback. At the start of the *next* deploy, the previous deploy
      # has been proven good and the colour being retired is two generations back.
      #
      # ⚠️ The reflex fix here — `docker image prune` — was measured on 2026-08-30 and
      # reclaims **0 bytes**. It deletes image records whose layers the BUILDKIT CACHE
      # still holds a reference to, so `df` does not move; the 53 GB "reclaimable" in
      # `docker system df` is the same bytes counted twice. The capped
      # `docker builder prune` in the script is the part that touches disk.
      #
      # Runs after Transfer source so the script is the version from this commit, and
      # it is non-fatal on a prune failure but FATAL if the prune removed an image a
      # container still references — i.e. the blue/green rollback, or a co-tenant's.
      - name: Bound docker disk growth (capped builder prune)
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'bash /opt/datanika/datanika/scripts/prune-docker-cache.sh 20GB 5' \
            | tee /tmp/prune.log
          {
            echo "### Docker prune (core#666)"
            echo '```'
            cat /tmp/prune.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build image + datastores + the sidecars nothing else recreates
        # `postgres-exporter`, `cadvisor` and `node-exporter` join this list in core#616.
        #
        # None of the three appeared in ANY deploy step before -- not here, not in the
        # blue/green swap, not in the monitoring `--force-recreate`. Their running config
        # was frozen at whatever it was the last time somebody ran a full
        # `docker compose up` by hand, which for all three was 6 weeks earlier. A compose
        # change to them landed in the transferred tree and never reached the container.
        #
        # That is not a hypothetical: core#616's fix is a `command:` on postgres-exporter,
        # and shipping it alone would have left `pg-slow-queries` firing on nothing while
        # every artefact -- the commit, the deploy, the rule text read back from Grafana --
        # said it was fixed. **Config CD does not apply is config that is not deployed.**
        # `test_deploy_covers_every_compose_service` now fails when a service is added to
        # docker-compose.yml and to no deploy step.
        #
        # Plain `up -d`, deliberately NOT `--force-recreate`: compose recreates only on a
        # config-hash change, so this is a no-op on every deploy that does not touch these
        # services' own definitions. The monitoring trio below needs `--force-recreate`
        # for a different reason -- their single-FILE bind mounts pin the inode -- and
        # forcing these three would recreate cadvisor on every deploy, putting a gap in
        # the container metrics the alert rules read.
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'cd /opt/datanika/datanika && set -a && . ./.env.docker && set +a && docker compose build app celery app_b && docker compose up -d postgres redis postgres-exporter cadvisor node-exporter'

      # The app is deployed by SWAPPING colours, not by recreating one container.
      #
      # The old step ran `up -d app`, which stops the running container and starts the new
      # one — a measured ~60s window where every request 502s (#425). deploy-bluegreen.sh
      # instead starts the INACTIVE colour, waits for its healthcheck, repoints Apache with
      # a graceful reload, verifies through Cloudflare, and only then stops the old colour.
      # Measured on prod: 549 probed requests across two swaps, zero non-200s.
      #
      # It also fixes a subtler bug: with Apache pointed at green, `up -d app` would have
      # rebuilt BLUE, passed its health gate, reported success, and changed nothing that
      # serves. The script derives the target colour from Apache's active-ports include,
      # so it always deploys the one that is not live.
      #
      # On any pre-swap failure it rolls back to the live colour and exits non-zero, so a
      # failed deploy leaves production exactly as it was.
      #
      # ⚠️ Both colours run `alembic upgrade head`, so the previously-deployed code briefly
      # runs against the new schema. Migrations must be expand/contract — #449.
      - name: Sync Apache vhosts from the repo
        # Production routing used to exist only on the box and in an untracked plans/ folder.
        # When the previous host was terminated (2026-07-14) the server, data and backups went
        # together; the vhost survived only because someone happened to have a local copy.
        #
        # No scp: "Transfer source" has already put the whole repo at /opt/datanika/datanika,
        # so the vhosts are on the box before this runs. That removes the runner-side path as a
        # failure mode (the first version used deploy/apache/... while the checkout lands in
        # datanika/, so scp found nothing) and guarantees the vhost matches the tree the image
        # is built from.
        #
        # Never touches webdav.conf -- that vhost belongs to a co-tenant on this shared box --
        # and never restarts Apache, only graceful.
        #
        # The body used to be an inline heredoc. It moved to scripts/sync-vhosts.sh for
        # core#607: its recovery ran only in the `configtest`-failed branch, so a guard
        # aborting on the SECOND vhost left the FIRST -- production -- replaced and
        # unrestored, with Apache still serving from memory so nothing looked wrong. Same
        # class as core#603. A heredoc inside a workflow also cannot be executed by a test,
        # and "we read it and it looked right" is how #603 survived five weeks; the script
        # is now covered by tests/test_deploy/test_vhost_sync.py.
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'cd /opt/datanika/datanika && bash scripts/sync-vhosts.sh'

      - name: Deploy the app via blue/green swap
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'cd /opt/datanika/datanika && bash scripts/deploy-bluegreen.sh --env prod'

      # Celery is NOT blue/green: it serves no HTTP traffic, so a brief restart costs
      # nothing (tasks stay queued in Redis) and running two workers on one broker would
      # double-consume. Recreate it after the swap so it picks up the same new image.
      #
      # `beat` (core#653) joins it here for exactly the same reason, and this line is the
      # whole of its exactly-one guarantee: it is recreated, never stood up beside itself.
      # Two beats would double-fire every scheduled entry. It is also what keeps
      # tests/test_deploy/test_deploy_service_coverage.py green — a compose service named
      # by no deploy step runs on whatever config it started with, indefinitely and
      # silently, which is what core#616 was.
      #
      # `celery-exporter` (core#704) joins the same line rather than the datastore line
      # above, and the ORDER within it matters more than it looks: the exporter reads the
      # worker's event stream, so recreating the worker without the exporter would be
      # harmless, but recreating the exporter without the worker after a `-E` change would
      # leave it listening to a worker that publishes nothing — the exact state that made
      # `celery-task-failures` a rule watching an empty metric for the life of the
      # project. Naming both here keeps them a unit. Plain `up -d` is a config-hash
      # recreate: a no-op unless the service's own definition changed.
      - name: Recreate celery worker, beat and the celery exporter
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'cd /opt/datanika/datanika && set -a && . ./.env.docker && set +a && docker compose up -d celery beat celery-exporter'

      # Assert the colour that is actually SERVING is healthy — not a hardcoded container
      # name, which is what made the old check meaningless once colours alternate.
      - name: Verify the serving colour is healthy
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" 'bash -s' <<'VERIFY'
          set -e
          BE=$(sed -nE 's/^Define DATANIKA_BE ([0-9]+).*/\1/p' /etc/apache2/conf-enabled/datanika-prod-active.conf)
          case "$BE" in
            8000) LIVE=datanika-app ;;
            8010) LIVE=datanika-app-b ;;
            *) echo "cannot determine serving colour (be=$BE)"; exit 1 ;;
          esac
          echo "serving colour: $LIVE (be=$BE)"
          H=$(docker inspect --format '{{.State.Health.Status}}' "$LIVE" 2>/dev/null || echo missing)
          [ "$H" = healthy ] || { echo "$LIVE is $H"; docker logs --tail 40 "$LIVE"; exit 1; }
          echo "$LIVE healthy"
          VERIFY

      # Monitoring config (prometheus.yml, grafana provisioning) is BIND-MOUNTED, so the
      # transfer updates it on disk but nothing re-reads it: the container spec is
      # unchanged, so `compose up -d` won't recreate, and Grafana only reads provisioning
      # at startup. Before this step, a deployed alerting change silently did nothing
      # while CI and CD both reported success (#426).
      #
      # --force-recreate is NOT belt-and-braces, it is load-bearing. Six mounts here are
      # single FILES (prometheus.yml, blackbox.yml, four Grafana dashboards), and a
      # single-file bind mount pins the INODE. `tar xzf` replaces the file rather than
      # editing it, so the container keeps reading the old inode forever — and
      # `POST /-/reload` then re-reads that stale file and reports success.
      #
      # Observed 2026-07-22: host prometheus.yml inode=1317518 (1898 bytes, with the
      # app_b scrape job) while the container held inode=1317530 (1222 bytes, 15h old,
      # without it). `prometheus_config_last_reload_successful` was 1 the whole time.
      # Grafana's provisioning escaped only because it is a DIRECTORY mount.
      # Recreating rebinds the current inode.
      - name: Reload monitoring config
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'cd /opt/datanika/datanika && set -a && . ./.env.docker && set +a && \
             docker compose up -d --force-recreate prometheus grafana blackbox && \
             for i in $(seq 1 20); do curl -fsS -X POST http://127.0.0.1:9090/-/reload >/dev/null 2>&1 && { echo "prometheus reloaded"; break; }; sleep 3; \
               [ "$i" = 20 ] && { echo "prometheus /-/reload never succeeded"; exit 1; }; done && \
             docker restart datanika-grafana >/dev/null && echo "grafana restarted"'

      # Grafana logs provisioning errors and then quietly keeps the PREVIOUS rules, so a
      # successful deploy is not evidence the rules are in effect. Assert that the number
      # of rules live in Grafana matches the number defined in the repo.
      - name: Verify alert rules are in effect
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" 'bash -s' <<'VERIFY'
          set -e
          for i in $(seq 1 24); do
            docker exec datanika-grafana sh -c \
              'curl -sf -u "admin:$GF_SECURITY_ADMIN_PASSWORD" http://127.0.0.1:3000/api/v1/provisioning/alert-rules' \
              > /tmp/live-rules.json 2>/dev/null && break
            sleep 5
          done
          curl -sf http://127.0.0.1:9090/api/v1/status/config -o /tmp/live-promcfg.json || true
          # Targets, for the job=celery health assertion further down (core#704). Give the
          # freshly-recreated exporter a scrape interval or two to be discovered before
          # reading — a target polled the instant after a reload legitimately reads
          # "unknown", and failing a good deploy on that is its own kind of noise.
          sleep 20
          curl -sf http://127.0.0.1:9090/api/v1/targets -o /tmp/live-targets.json || true
          # --- rule health: can Grafana actually EVALUATE what we shipped? ---
          # Comparing expressions proves the right text reached Grafana. It does NOT
          # prove the rule works. Every probe rule sat at "invalid format of evaluation
          # results ... only reduced data can be alerted on" -- a threshold applied to an
          # unreduced series -- so none of them ever evaluated their condition, and they
          # paged only via execErrState. Expression comparison stayed green throughout.
          docker exec datanika-grafana sh -c \
            'curl -sf -u "admin:$GF_SECURITY_ADMIN_PASSWORD" \
             http://127.0.0.1:3000/api/prometheus/grafana/api/v1/rules' \
            > /tmp/live-health.json 2>/dev/null || true
          python3 - <<'HEALTH'
          import json, sys
          try:
              d = json.load(open('/tmp/live-health.json'))
          except Exception as e:
              print('could not read rule health from Grafana:', e); sys.exit(1)
          bad = []
          for g in d.get('data', {}).get('groups', []):
              for r in g.get('rules', []):
                  # lastError is per-evaluation and authoritative.
                  #
                  # Do NOT fall back to alert-instance annotations. Grafana persists alert
                  # instances across a restart, so an instance sitting in Normal (NoData)
                  # still carries the Error annotation from BEFORE a fix was deployed.
                  # Reading that as current state fails a perfectly good deploy -- exactly
                  # what happened on 2026-07-22, when lastError was empty, health was ok,
                  # and the rules were evaluating on schedule.
                  err = (r.get('lastError') or '').strip()
                  if err:
                      bad.append(r.get('name', '?') + ': ' + err[:110])
                  elif r.get('health') not in ('ok', 'nodata', '', None):
                      bad.append(r.get('name', '?') + ': health=' + str(r.get('health')))
                  elif not (r.get('lastEvaluation') or '').strip():
                      # A rule that never ran carries no lastError either, so silence on
                      # its own is not evidence of health.
                      bad.append(r.get('name', '?') + ': never evaluated')
          if bad:
              print('ALERT RULES CANNOT EVALUATE:')
              for b in bad: print('  -', b)
              sys.exit(1)
          print('rule health: all rules evaluate cleanly')
          HEALTH
          
          python3 - <<'PY'
          import json, re, sys, yaml

          REPO = "/opt/datanika/datanika/monitoring"
          failed = False

          # --- alert rules: COUNT is not enough -------------------------------------
          # A count check passes for any change that edits expressions without adding or
          # removing rules — which is exactly what #480 did, so this step went green
          # while Grafana still held the old expressions. Compare the expressions too.
          src = open(f"{REPO}/grafana/provisioning/alerting/alerts.yml", encoding="utf-8").read()
          defined = {}
          for g in yaml.safe_load(src)["groups"]:
              for r in g["rules"]:
                  defined[r["title"]] = (r["data"][0]["model"].get("expr") or "").strip()
          try:
              live_rules = json.load(open("/tmp/live-rules.json"))
          except Exception as e:
              print("could not read live rules from Grafana:", e); sys.exit(1)
          live = {r["title"]: (r["data"][0]["model"].get("expr") or "").strip() for r in live_rules}

          print(f"alert rules: defined={len(defined)} live={len(live)}")
          if len(defined) != len(live):
              print("MISMATCH - rule count differs"); failed = True
          drift = [t for t, e in defined.items() if live.get(t, "<missing>") != e]
          if drift:
              failed = True
              print(f"MISMATCH - {len(drift)} rule(s) whose LIVE expression differs from the repo:")
              for t in drift[:8]:
                  print(f"  {t}\n    repo: {e_ := defined[t]}\n    live: {live.get(t, '<missing>')}")
          else:
              print("all rule expressions match the repo")

          # --- prometheus scrape config --------------------------------------------
          # Single-FILE bind mounts pin the inode, so a tar deploy can leave the container
          # reading a file that no longer exists while /-/reload reports success. Compare
          # the LOADED config against the repo rather than trusting the reload (#479).
          want = {j["job_name"] for j in yaml.safe_load(open(f"{REPO}/prometheus.yml", encoding="utf-8"))["scrape_configs"]}
          try:
              got = {j["job_name"] for j in yaml.safe_load(json.load(open("/tmp/live-promcfg.json"))["data"]["yaml"])["scrape_configs"]}
          except Exception as e:
              print("could not read live prometheus config:", e); sys.exit(1)
          if want != got:
              failed = True
              print(f"MISMATCH - prometheus scrape jobs differ.\n  repo-only: {sorted(want - got)}\n  live-only: {sorted(got - want)}")
              print("  (classic cause: single-file bind mount pinned to a replaced inode — recreate the container)")
          else:
              print(f"prometheus scrape jobs match the repo ({len(got)} jobs)")

          # --- the celery target must be UP, not merely CONFIGURED (core#704) ----------
          # The check above compares job NAMES. A `celery` job that is configured and
          # permanently down passes it — and a permanently-down target is
          # indistinguishable from a quiet one in every rule that reads it, which is the
          # whole of core#704. So assert the scrape actually succeeds.
          #
          # Deliberately narrow to this one job. A blanket "all targets up" assertion
          # would be WRONG here: under blue/green exactly one of datanika-app /
          # datanika-app-b is expected to be down at any moment, by design.
          try:
              act = json.load(open("/tmp/live-targets.json"))["data"]["activeTargets"]
          except Exception as e:
              print("could not read live prometheus targets:", e); sys.exit(1)
          cel = [t for t in act if t["labels"].get("job") == "celery"]
          if not cel:
              failed = True
              print("MISMATCH - prometheus has no ACTIVE target for job=celery")
          elif any(t.get("health") != "up" for t in cel):
              failed = True
              for t in cel:
                  print(f"celery target {t['labels'].get('instance')} health="
                        f"{t.get('health')} lastError={t.get('lastError')!r}")
              print("  (the exporter is not being scraped; every Celery rule is blind)")
          else:
              print(f"celery scrape target is up ({cel[0]['labels'].get('instance')})")

          sys.exit(1 if failed else 0)
          PY
          VERIFY
      - name: Smoke through Cloudflare
        run: curl -fsS -o /dev/null -w "app.datanika.io/login -> %{http_code}\n" https://app.datanika.io/login

  # Post-deploy smoke gates (moved from ci.yml 2026-07-17 when prod deploy left it).
  # URL gate (smoke) + pytest shape assertions (smoke-prod), run after the deploy.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Smoke gate — app.datanika.io
        run: bash .github/smoke-check.sh https://app.datanika.io .github/smoke-urls-core.txt

  smoke-prod:
    needs: [deploy, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps
      - name: Run smoke probes against prod
        env:
          DATANIKA_SMOKE_CORE_URL: https://app.datanika.io
          DATANIKA_SMOKE_LANDING_URL: https://datanika.io
        run: pytest scripts/smoke/ -v --tb=short
      - name: Telegram alert on failure
        if: failure()
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          SHORT_SHA=${COMMIT_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          TEXT=$(printf '\xf0\x9f\x94\xa5 *PROD smoke failed* (shape regression)\n\n*Commit:* `%s`\n*Message:* %s\n*Run:* %s' \
            "$SHORT_SHA" "$FIRST_LINE" "$RUN_URL")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=Markdown"
