[project]
name = "datanika"
version = "0.1.0"
description = "Multi-tenant data pipeline management platform with dlt + dbt"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    # Data pipeline — pinned to tested versions; bump deliberately
    "dlt[postgres,snowflake,bigquery,mssql,clickhouse,duckdb,databricks,synapse]>=1.21,<2",
    "dbt-core>=1.7.19,<1.8",
    "dbt-postgres>=1.7,<1.8",
    "dbt-snowflake>=1.7,<1.8",
    "dbt-bigquery>=1.7,<1.8",
    "dbt-redshift>=1.7,<1.8",
    "dbt-mysql>=1.7,<1.8",
    "dbt-sqlserver>=1.7,<1.8",
    "dbt-clickhouse>=1.7,<1.8",
    "dbt-duckdb>=1.7,<1.8",
    # dbt-databricks requires sqlalchemy<2.0, incompatible with our stack
    # dbt-synapse requires sqlalchemy<2.0, incompatible with our stack
    # Both platforms work as dlt destinations — dbt transforms deferred until adapter compat
    # SaaS source dependencies (optional — needed only for dlt verified sources,
    # REST API fallback works without these)
    # "stripe>=5.0",
    # "simple-salesforce>=1.12",
    # "pyairtable>=2.0",
    # "facebook-business>=19.0",
    # "google-analytics-data>=0.18",
    # "google-ads>=24.0",
    # "confluent-kafka>=2.3",
    # Google Sheets
    "gspread>=6.0,<7",
    "google-auth>=2.0,<3",
    # SQL drivers
    "pymysql>=1.1,<2",
    "pymssql>=2.2,<3",
    "pymongo>=4.0,<5",
    "clickhouse-connect>=0.11,<0.12",
    "duckdb>=1.0,<2",
    # The SQLAlchemy dialect for DuckDB. dlt writes through its own driver, so
    # loads worked without this — but catalog introspection goes through
    # SQLAlchemy and raised NoSuchModuleError, leaving Models/Catalog
    # permanently empty for every DuckDB user (core#494). Every other
    # destination here already pairs a driver with its dialect; duckdb was the
    # one that did not.
    "duckdb-engine>=0.17,<0.18",
    "snowflake-sqlalchemy>=1.7,<2",
    "sqlalchemy-bigquery>=1.11,<2",
    "oracledb>=4.0,<5",
    # Web framework
    "reflex>=0.8.26,<0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.14,<2",
    # Auth
    "passlib[bcrypt]>=1.7,<2",
    "python-jose[cryptography]>=3.3,<4",
    # Task queue & scheduling
    "celery[redis]>=5.4,<6",
    "redis>=6.0,<7",
    "apscheduler>=3.10,<4",
    # Config & utilities
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "cryptography>=45.0,<46",
    # Monitoring
    "prometheus-client>=0.21,<0.26",
    "python3-saml>=1.16,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<0.16",
    "httpx>=0.28,<0.29",
    "mcp>=1.0.0,<2",
    # Used by tests/test_mcp/test_registry_manifests.py to parse smithery.yaml.
    # Previously relied on as an undeclared transitive dep, which let those
    # manifest-drift guards skip themselves if it ever went missing (core#407 sweep).
    "pyyaml>=6.0,<7",
    # Round-trip migration test auto-provisions Postgres via Docker.
    # Skipped gracefully if Docker is unavailable (see tests/test_migrations/test_roundtrip.py).
    "testcontainers[postgres]>=4.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
