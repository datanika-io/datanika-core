## Datanika Helm chart — default values.
##
## This is a minimal stub. See README.md for the feature matrix vs.
## production docker-compose deployment on Hetzner.

image:
  repository: ghcr.io/datanika-io/datanika
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

## Ingress — optional HTTP entry. Maps / → app frontend (Reflex :3000) and
## /api/ → app backend (:8000). Mirrors the production Nginx reverse proxy.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: datanika.local
  tls: []
  ##  - hosts:
  ##      - datanika.local
  ##    secretName: datanika-tls

## Datanika application env. In production this comes from .env.docker on the
## host; in Kubernetes we put the same keys into a Secret and mount via envFrom.
## Users MUST override the password/secret fields before install.
env:
  POSTGRES_USER: datanika
  POSTGRES_DB: datanika
  DATANIKA_EDITION: "oss"
  ## Pinned absolute, and it must be identical for the app and the worker.
  ## config.py defaults this to `./uploaded_files`, which resolves against the
  ## working directory — so a shared volume alone is not enough if the two tiers
  ## ever start from different directories (core#529).
  FILE_UPLOADS_DIR: /app/uploaded_files
  ## `uv run` re-syncs the venv from uv.lock before running. The image installs
  ## `datanika-cloud` and `datanika-mcp` with `uv pip install` AFTER
  ## `uv sync --frozen`, so neither is in the lock and a sync is free to remove
  ## them — at pod start, after every build-time check has passed (core#785).
  ## The app, celery and beat commands below all begin `uv run`, so all three
  ## need this; it reaches them through the env Secret via envFrom.
  UV_NO_SYNC: "1"
  ## Optional extras — anything else the app reads from .env.docker. Keys listed
  ## here become literal Secret entries. Values left empty will be emitted as
  ## empty strings; users should populate them before running in a real env.
  extra: {}

## Secrets — rendered into the env Secret. Passwords must be overridden.
secrets:
  POSTGRES_PASSWORD: "CHANGE-ME"
  REDIS_PASSWORD: "CHANGE-ME"
  SECRET_KEY: "CHANGE-ME"

## Application (Reflex frontend :3000 + backend :8000).
app:
  replicaCount: 1
  command:
    - sh
    - -c
    - "uv run alembic upgrade head && uv run reflex run --env prod --backend-host 0.0.0.0"
  service:
    type: ClusterIP
    frontendPort: 3000
    backendPort: 8000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  probes:
    readiness:
      httpGet:
        path: /healthz
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 5
    liveness:
      httpGet:
        path: /healthz
        port: 8000
      initialDelaySeconds: 60
      periodSeconds: 30
      failureThreshold: 3
  dbtProjectsSize: 5Gi
  ## Uploaded-file archives, shared with the celery worker. Sized for the 20 MB
  ## per-file cap in FileUploadService plus retention.
  uploadedFilesSize: 5Gi

## Celery worker.
celery:
  replicaCount: 1
  command:
    - uv
    - run
    - celery
    - -A
    - datanika.tasks.celery_app:celery_app
    - worker
    - -l
    - info
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

## Celery Beat — the periodic-task scheduler (core#653).
##
## ⚠️ There is deliberately NO `replicaCount` here. Beat is a singleton: two of them
## double-fire every scheduled entry, so the Deployment hardcodes `replicas: 1` with
## `strategy: Recreate`. `enabled: false` is the only supported way to not run it, and
## turning it off means the maintenance sweeps below never run at all.
##
## What stops running if you disable it: cleanup_dbt_targets, cleanup_orphaned_dlt_dirs,
## cleanup_orphaned_archives, purge_old_runs, PasswordResetService.purge_expired.
beat:
  enabled: true
  command:
    - uv
    - run
    - celery
    - -A
    - datanika.tasks.celery_app:celery_app
    - beat
    - -l
    - info
    # Must match the beat-state volumeMount path in beat-deployment.yaml.
    - --schedule
    - /app/beat_state/celerybeat-schedule
  persistence:
    ## 16 KB of shelve. The size is irrelevant; the persistence is not — see beat-pvc.yaml.
    size: 1Gi
  ## Beat only computes due times and publishes to the broker. Measured at 250 MiB RSS on
  ## the production image (2026-08-30, a lone beat container on the pointer.gr box), so the
  ## request is set above that and the limit leaves headroom for the import graph.
  resources:
    requests:
      cpu: 50m
      memory: 320Mi
    limits:
      cpu: 500m
      memory: 512Mi

## PostgreSQL (stub — for real clusters, set enabled=false and provide
## externalDatabase.host). Uses a StatefulSet + PVC for data durability.
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  port: 5432
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

## External Postgres override — ignored unless postgres.enabled=false.
externalDatabase:
  host: ""
  port: 5432
  user: ""
  database: ""

## Redis (Celery broker + cache). Runs with an emptyDir volume — on pod
## restart the broker queue is lost, which is fine for Datanika's task model
## (Celery tasks are idempotent and re-enqueued by the app on failure).
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

## External Redis override — ignored unless redis.enabled=false.
externalRedis:
  host: ""
  port: 6379

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
