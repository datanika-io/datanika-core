apiVersion: 1

groups:
  - orgId: 1
    name: Infrastructure Alerts
    folder: Datanika
    interval: 30s
    rules:
      # --- Container Health ---
      - uid: container-down
        title: Container Down
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Excludes the app pair on purpose — see "App Container Down" below.
              # Under blue/green exactly ONE of datanika-app / datanika-app-b is running,
              # so a per-container staleness check pages for the colour we deliberately
              # retired. Confirmed live during the first prod swap: this rule fired for
              # `datanika-app` while prod served correctly from `datanika-app-b`.
              #
              # core#604: `> 60` is a filtering expression, so `reduce: last` never sees
              # a recovery and `for:` cannot debounce it — same defect as app-unhealthy,
              # found by auditing all 30 rules rather than waiting for it to page. A
              # single cadvisor stall (this box is a shared 4-vCPU host) would have
              # pushed staleness past 60s for one sample and paged critical. The
              # duration now lives in the query. Max staleness ever observed in 30d is
              # 26s against a 60s threshold, so this has never fired — the fix is
              # pre-emptive, not a response to an incident.
              #
              # core#653: `beat` joins this list, and that is the *reason* it is its own
              # container rather than `celery worker -B`. A beat thread dying inside a
              # live worker leaves the container Up and healthy — indistinguishable from
              # the bug core#653 reports, where the hourly maintenance task simply never
              # arrives and nothing says so. As a container it has a `container_last_seen`
              # series, so its death is the same observable event as any other tier's.
              #
              # ⚠️ The anchoring that makes this safe is worth stating, because core#615
              # got it wrong in the other direction: Prometheus anchors regexes at both
              # ends, so `datanika-(celery|beat|postgres|redis)` matches `datanika-beat`
              # and does NOT match `datanika-staging-beat`. Staging is redeployed on every
              # push to dev; a `datanika-.*` here would page critical on every merge.
              expr: 'count_over_time(((time() - max by (name) (container_last_seen{name=~"datanika-(celery|beat|postgres|redis)"})) > 60)[2m:15s])'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container {{ $labels.name }} was unseen by cadvisor for over 60 seconds on more than 3 of the last 8 samples (a 2-minute window at the 15s scrape interval) — i.e. sustained, not a single stalled scrape."

      # --- App container (blue/green aware) ---
      # The app runs as one of a PAIR: datanika-app (blue) or datanika-app-b (green).
      # Exactly one is up at a time, and a swap deliberately stops the other, so a
      # per-container check is wrong by construction — it pages for the retired colour.
      #
      # `max()` over the pair collapses them: the value is the most recent sighting of
      # EITHER colour, so this fires only when *neither* is alive, which is the actual
      # outage. During the first prod swap the old per-container rule fired for
      # `datanika-app` while prod served perfectly from `datanika-app-b`.
      - uid: app-container-down
        title: App Container Down
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # core#604: duration in the query, not in `for:` — see Container Down above
              # for the mechanism. Filtering expression + `reduce: last` means `for:`
              # debounces nothing.
              expr: 'count_over_time(((time() - max(container_last_seen{name=~"datanika-app(-b)?"})) > 60)[2m:15s])'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "No app container is running (neither blue nor green)"
          description: "Neither datanika-app nor datanika-app-b was seen by cadvisor for over 60 seconds, on more than 3 of the last 8 samples (a 2-minute window at the 15s scrape interval). During a blue/green swap exactly one is expected to be down; this fires only when both are."

      # --- High CPU ---
      - uid: high-cpu
        title: High CPU Usage
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage: {{ $value }}%"
          description: "CPU usage has been above 85% for 5 minutes."

      # --- High Memory ---
      - uid: high-memory
        title: High Memory Usage
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage: {{ $value }}%"
          description: "Memory usage has been above 90% for 5 minutes."

      # --- Disk Space ---
      - uid: disk-space-critical
        title: Disk Space Critical
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '(1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage above 80%: {{ $value }}%"
          description: "Root filesystem is running low on space."

      # --- Backup Stale ---
      # Fires when the nightly off-site pg_dump has not succeeded in over 26h
      # (metric written by scripts/backup-offsite.sh via node-exporter textfile).
      - uid: backup-stale
        title: Backup Stale
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'time() - datanika_backup_last_success_timestamp_seconds > 93600'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Off-site backup is stale (last success over 26h ago)"
          description: "The nightly pg_dump off-site backup to Aweb has not succeeded in more than 26 hours. Check /var/log/datanika-backup.log on the pointer.gr box."

      # --- Restore Drill Stale (core#725 follow-on) ---
      # A backup that has never been restored is a hypothesis. The monthly drill
      # (`0 5 1 * *` box-local, `/opt/datanika/scripts/restore-drill.sh`) is what tests
      # it, and until 2026-08-31 its only success signal was a `.txt` file in a directory
      # node-exporter does not read -- so NO ALERT FOR IT COULD EXIST, and the stamp sat
      # 30 days stale with nothing to remark on it.
      #
      # core#725 fixed the instrument: the drill now writes
      # `/opt/datanika/node_textfile/datanika_restore_drill.prom`, which node-exporter's
      # textfile collector serves. ⚠️ That made the metric SCRAPEABLE, which is not the
      # same as WATCHED -- this rule is the second half, and without it the fix would
      # have left a number nobody reads. Verified present in prod Prometheus 2026-08-31:
      # `datanika_restore_drill_last_success_timestamp_seconds` = 1788138422.
      #
      # 35 days = 3,024,000s, not 30: the cron is monthly on the 1st, so consecutive runs
      # are up to 31 days apart and a 30d threshold would fire on every long month.
      #
      # Debounce is in the QUERY, not in `for` (core#604). Both directions were measured
      # against prod on 2026-08-31: at the real threshold the expression returns 0 series
      # (healthy is NoData, which is why `noDataState: OK` is correct here); the identical
      # expression with the threshold dropped to 60s returns 8 -- every sample in the
      # window -- so `gt [3]` demanding 4 of 8 is arithmetic on a value that was actually
      # observed rather than assumed.
      #
      # ⚠️ If the metric DISAPPEARS -- textfile mount broken, node-exporter recreated
      # without it, drill never run again after a rebuild -- this expression yields no
      # series and reads exactly like health. That hole is covered by
      # `watchdog-restore-drill` in the Monitoring Liveness group, not by this rule.
      - uid: restore-drill-stale
        title: Restore Drill Stale
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'count_over_time(((time() - datanika_restore_drill_last_success_timestamp_seconds) > 3024000)[2m:15s])'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "The monthly restore drill has not passed in over 35 days"
          description: "datanika_restore_drill_last_success_timestamp_seconds is more than 35 days old on more than 3 of the last 8 samples (a 2-minute window at the 15s scrape interval). The monthly drill restores the off-site pg_dump into a throwaway database and asserts live row counts. Run /opt/datanika/scripts/restore-drill.sh on the pointer.gr box and read its output -- a stale stamp means the drill has not run OR has been failing, and those need different fixes."

      # --- Container Restart Loop ---
      # core#615 -- this rule was structurally unable to fire for its entire life.
      #
      # 1. `increase()` ON A TIMESTAMP GAUGE IS ALWAYS 0. `container_start_time_seconds`
      #    carries a per-container `id` label. A restart does not move that series, it
      #    ENDS one and BEGINS another under a new id, and `increase()` is per-series
      #    over a constant. Backtested against 30d of prod Prometheus, a window that
      #    contains real restarts (blackbox/grafana/prometheus were force-recreated on
      #    every deploy): the old expression yields **0 series**. With `noDataState: OK`
      #    it read healthy the whole time while measuring nothing.
      #
      # 2. THE MESSAGE DID NOT MATCH THE MATHS. Even had it worked, `increase()` on this
      #    gauge measures how many SECONDS the start timestamp advanced, not how many
      #    restarts happened -- one restart of a container up an hour advances it ~3600,
      #    so `> 3` meant "one restart", not "more than 3". Same annotation-vs-reality
      #    class as core#604.
      #
      # The fix counts distinct container instances per name instead of differencing a
      # timestamp: N series for one name inside the window means N-1 restarts.
      #
      # ⚠️ THE CANDIDATE IN THE ISSUE WAS NOT SAFE TO SHIP AS WRITTEN -- it kept
      # `name=~"datanika-.*"`, and PromQL anchors the regex at both ends, so `.*` also
      # matches `datanika-staging-*`. Staging is redeployed on EVERY push to `dev`, with
      # five departments merging. Backtested over the same 30d:
      #
      #     staging INCLUDED -> 82 five-minute buckets over threshold
      #                         (datanika-staging-app 41, datanika-staging-celery 41)
      #     staging EXCLUDED -> 0
      #
      # So the proposed fix would have converted a rule that cannot fire into one that
      # pages `critical` on ordinary staging deploys. Excluded by a NEGATIVE filter
      # rather than an allow-list of prod names, deliberately: core#622 was exactly an
      # allow-list that silently stopped matching when a container name changed.
      #
      # Threshold validated against the same 30d, prod names only:
      #     > 3 (>=4 instances/h) -> 0 buckets
      #     > 2 (>=3 instances/h) -> 0 buckets
      #     > 1 (>=2 instances/h) -> 132 buckets  <- the deploy signature: blackbox,
      #         grafana, prometheus (force-recreated) and celery (recreated), 1 restart
      #         each per deploy
      # Prod has never reached 3 instances in an hour, so `> 3` keeps two full steps of
      # headroom over normal deploy behaviour. Three prod deploys inside 60 minutes would
      # put celery at 4 and page -- rare, and arguably worth a look when it happens.
      #
      # I first shipped this WITHOUT the outer `[2m:15s]` debounce, reasoning that a
      # `[1h]` range already puts the duration in the query. QA's alerting lint (core#632,
      # `TestBlipArithmetic`) rejected it, and the lint is right: the inner range bounds
      # how long a series is *counted*, not how many samples must agree that the count is
      # 4. One cadvisor scrape reporting a phantom series would page `critical` on the
      # spot. Recording the wrong reasoning because it is the tempting one — "the window
      # is long, therefore it is debounced" conflates the range with the sample count.
      - uid: container-restart-loop
        title: Container Restart Loop
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'count_over_time((count by (name) (count_over_time(container_start_time_seconds{name=~"datanika-.*", name!~"datanika-staging-.*"}[1h])) > 3)[2m:15s])'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is restart-looping"
          # "at least 3", not "more than 3": >3 instances means >=4 instances in the
          # hour, which is >=3 restarts. The old wording overstated by one and is the
          # defect core#615 flagged in its own right.
          description: "Container {{ $labels.name }} has restarted at least 3 times in the last hour (4 or more distinct container instances seen), sustained across 4 of the last 8 samples in a 2m window. Staging containers are excluded — they are recreated on every push to dev."

      # --- Container High Memory ---
      # core#622 -- this rule had TWO independent defects and fired a false warning
      # on the 2026-08-29 promotion deploy. Both are fixed here; either alone is worse
      # than useless (regex-only fires on both colours on the wrong metric; metric-only
      # stays blind for as long as green serves).
      #
      # 1. BLUE/GREEN BLIND. `datanika-(app|celery)` does not match `datanika-app-b`,
      #    and PromQL anchors the regex, so the green colour was never in the series
      #    set at all. Prod served from green for five straight weeks. Measured on the
      #    box 2026-08-30:
      #      count_over_time(...{name=~"datanika-(app|celery)"}[30d:1h])
      #        datanika-celery 707+13 | datanika-app 13+1 | datanika-app-b ABSENT
      #      count_over_time(...{name=~"datanika-(app(-b)?|celery)"}[30d:1h])
      #        datanika-app-b 707   <-- 707 hourly buckets the rule could not see
      #    app-container-down and container-down already carry `(-b)?`; this rule was
      #    missed. A rule that cannot fire looks exactly like a healthy system.
      #
      # 2. WRONG METRIC. container_memory_usage_bytes counts reclaimable page cache;
      #    container_memory_working_set_bytes (what `docker stats` reports) does not.
      #    At the moment it fired, 2026-08-29 20:33:50Z:
      #      usage       1,509,556,224  ->  0.64% OVER the old 1.5GB threshold
      #      working set 1,318,297,600  ->  12%   UNDER it
      #    with 3.5GB available on the host. There was no memory pressure at all.
      #
      # THRESHOLD is taken from 30 days of recorded working set, not chosen by feel:
      #      datanika-app     max 1,500,459,008  (1.500 GB)
      #      datanika-app-b   max 1,315,770,368  (1.316 GB)
      #      datanika-celery  max   640,794,624  (0.641 GB)
      #    2GB sits ~33% above that ceiling. core#622 suggested 1.6GB, which is only
      #    6.6% above it -- still inside normal range, so it would flap again. Flapping
      #    is the fault being fixed, not an acceptable cost of fixing it.
      #
      # There is NO cgroup memory limit on these containers, so there is no OOM cliff
      # to sit beneath -- the backstop is host memory (8.46GB total, 3.7GB available).
      # Verified 2026-08-30 four ways: `docker inspect` Memory=0, the container own
      # memory.max=max, the host-side docker-<id>.scope memory.max=max, and cadvisor
      # container_spec_memory_limit_bytes=0. The `1.875GiB` shown in the Limit column
      # of `docker stats` is NOT a cgroup ceiling -- do not tune against it.
      #
      # `for: 5m` must stay >= query window (60s) + group interval (30s) or the blip
      # lint in tests/test_deploy/test_alerting_config.py fails. It also covers the
      # blue/green swap, where both colours are briefly resident at ~1.3GB each: each
      # is individually under 2GB, so a swap cannot trip this rule. Keep the threshold
      # per-container -- a sum across colours would destroy that property.
      - uid: container-high-memory
        title: Container High Memory
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'container_memory_working_set_bytes{name=~"datanika-(app(-b)?|celery)"} > 2e+9'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} working set over 2GB"
          description: "Container {{ $labels.name }} has held a working set above 2GB for more than 5 minutes. Working set excludes reclaimable page cache, so this is resident pressure rather than cache. The 30-day observed ceiling is 1.50GB on the app and 0.64GB on celery, and these containers carry no cgroup memory limit -- the real backstop is host memory. Check `docker stats` and node_memory_MemAvailable_bytes before restarting anything. Background: core#622."

  - orgId: 1
    name: Application Alerts
    folder: Datanika
    interval: 30s
    rules:
      # --- App Health Endpoint ---
      - uid: app-unhealthy
        title: App Unhealthy
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Blue/green: two scrape jobs, exactly ONE of which is expected to be up.
              # `up{job="datanika-app"} == 0` fired continuously whenever GREEN served,
              # because the compose name `app` did not resolve — re-notifying hourly
              # while the site was fine (#479). max() collapses the pair, so this fires
              # only when NEITHER colour is scrapeable, which is the real outage.
              #
              # core#604: the duration lives in the QUERY, not in `for:`. `== 0` is a
              # filtering expression, so a healthy scrape is not a member of the series
              # at all and `reduce: last` never sees a recovery — it returns the last
              # FAILING sample for as long as that sample sits in the 60s window. One
              # failed scrape therefore satisfies any `for:` shorter than window +
              # group_interval. Observed, not theorised: a single failed sample at
              # 2026-08-29T16:31:05Z took this rule Pending → **Alerting (critical)** at
              # 16:31:40 and back to Normal at 16:32:10, while datanika-app-b had been
              # up 5 weeks with restarts=0.
              expr: 'count_over_time((max(up{job=~"datanika-app(-b)?"}) == 0)[2m:15s])'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Datanika app metrics endpoint is down (neither blue nor green scrapeable)"
          description: "Prometheus failed to scrape BOTH datanika-app and datanika-app-b on more than 3 of the last 8 samples (a 2-minute window at the 15s scrape interval). Under blue/green exactly one colour is expected to be unscrapeable, so this fires only when neither is. Internal scrape only — for external reachability see App External Health Down (core#604)."

      # --- Celery Task Failures ---
      # core#704 -- this rule had never been able to fire, for the same structural reason
      # as core#615 and core#616, and it is the third instance of that class.
      #
      # `celery_tasks_total` is a Counter declared in `services/metrics.py:41`. Its
      # `.labels(...).inc()` calls live in Celery signal handlers (`:139-166`), which run
      # in the WORKER process. `/metrics` is a Starlette route (`:191`) served by the APP
      # process. So the app's registry holds the metric FAMILY with no children, and
      # `generate_latest` emits a `# TYPE celery_tasks_total counter` line and zero
      # samples. Measured on the serving prod container 2026-08-31 -- the TYPE line is
      # there and there is not a single sample line under it -- and confirmed one layer
      # up by querying prod Prometheus, where `celery_tasks_total` returns 0 series.
      #
      # A rule matching no series produces NoData, and `noDataState: OK` renders that as
      # healthy. So "no Celery failure alert has ever fired" carried no information at
      # all.
      #
      # Repointed at the celery-exporter's event-derived counter. Names verified by
      # running the exporter against the real staging worker on 2026-08-31 rather than
      # read off its README: `celery_task_failed_total{name, hostname, queue_name,
      # exception}`. `sum()` collapses `hostname`, which is the worker's container ID and
      # therefore changes on every deploy.
      - uid: celery-task-failures
        title: High Celery Task Failure Rate
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'sum(rate(celery_task_failed_total[15m])) > 0.1'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Celery task failure rate"
          description: "More than 0.1 task failures per second over the last 15 minutes."

      # --- Celery Queue Depth ---
      # ⚠️ Unlike its neighbour above, this rule DID work: `celery_queue_length` is set
      # inside the `/metrics` handler itself (`services/metrics.py:172-186`), in the app
      # process, from a live Redis `LLEN` at scrape time -- so it has children where
      # `celery_tasks_total` has none. Two Celery rules sitting side by side, one dead and
      # one live, and nothing about how they read distinguished them.
      #
      # Scoped to `job="celery"` (core#704) because the exporter ALSO publishes a metric
      # of exactly this name, `celery_queue_length{queue_name="celery"}`, against the
      # app's `celery_queue_length{queue="celery"}`. Unscoped, this rule would now match
      # both and raise two instances for one condition. The exporter's copy is chosen
      # deliberately over the app's: the app's is blue/green, so scoping to it would need
      # `job=~"datanika-app(-b)?"` and would re-open the core#622 colour trap.
      - uid: celery-queue-depth
        title: Celery Queue Backlog
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'celery_queue_length{job="celery"} > 50'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue backlog: {{ $value }} tasks"
          description: "Celery queue has had more than 50 pending tasks for 10 minutes."

      # --- Scheduled maintenance stopped arriving (core#704, closes core#653 AC3) ---
      # `beat` went live 2026-08-30 as the ONLY invocation path for
      # `datanika.run_maintenance`. Its death as a CONTAINER is covered -- `container-down`
      # carries `beat` in its selector. Its death as a PRODUCER was not: a beat that is
      # alive but wedged, or a worker that never picks the task up, is indistinguishable
      # from a healthy hour in which the sweeps had nothing to do. That is core#653's own
      # failure shape one level up, and core#653 went unnoticed for the entire life of the
      # project.
      #
      # ⚠️ THREE THINGS ABOUT THIS EXPRESSION ARE LOAD-BEARING; none is stylistic.
      #
      # 1. `< bool 1` and NOT `< 1`. A bare `X < 1` is a FILTER: it returns X's own value
      #    where the condition holds. `increase` of a task that has stopped firing is 0,
      #    so the rule would hand `reduce: last` the number 0, and `threshold gt [0]`
      #    would then be FALSE -- a rule that fires only while the system is healthy is
      #    exactly core#504, and this file's own lint would not have caught it, because
      #    `TestThresholdSatisfiability` only recognises the `== N` form. `bool` makes the
      #    comparison return 1/0 instead of filtering, so `gt [0]` means what it reads as.
      #
      # 2. `sum()` collapses `hostname`, which is the worker's container ID. Every deploy
      #    recreates the worker, so a per-hostname rule would compare a frozen old series
      #    against a newborn one. Aggregated, the old series' contribution ages out of the
      #    3h window at about the rate the new one accumulates, so an ordinary deploy does
      #    not move this rule at all.
      #
      # 3. The `_created` guard is what stops it paging after an EXPORTER restart. The
      #    exporter's counters live in memory. On restart, the child for this task is
      #    recreated at the value of the first event that follows, and a flat series has
      #    an `increase` of 0 -- so without the guard the rule would fire for up to an
      #    hour after any exporter recreate, which is how a rule earns a permanent mute.
      #    `celery_task_succeeded_created` is the exporter's own record of when it began
      #    observing this task; `min()` takes the oldest child, and until that is older
      #    than the window the guard yields no series and the rule is silent. It errs
      #    toward silence during churn ON PURPOSE, and the two watchdogs in the Monitoring
      #    Liveness group are what cover the silence: `absent(up{job="celery"})` fires if
      #    the exporter is not scraped at all, `absent(celery_worker_up)` if no worker is
      #    reporting. Neither has a guard.
      #
      # Window is 3h against an hourly schedule -- two consecutive misses, not one. A
      # missed maintenance sweep is housekeeping, not user-facing, hence `warning`.
      - uid: celery-maintenance-not-firing
        title: Scheduled maintenance has stopped running
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '(sum(increase(celery_task_succeeded_total{name="datanika.run_maintenance"}[3h])) < bool 1) and on() ((time() - min(celery_task_succeeded_created{name="datanika.run_maintenance"})) > 10800)'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "datanika.run_maintenance has not succeeded in the last 3h"
          description: "Celery Beat schedules datanika.run_maintenance hourly and it has not completed successfully in the last 3 hours, so at least two firings have been missed. Beat may be alive but wedged -- its container being Up is not evidence it is still producing. Check `docker logs datanika-beat` for 'Sending due task hourly-maintenance' and `docker logs datanika-celery` for the matching receipt. Duration is in the query, so `for` is 0s (core#604)."

