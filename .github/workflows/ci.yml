name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Ruff check
        run: ruff check datanika tests --exclude "datanika/migrations"

      - name: Ruff format check
        run: ruff format --check datanika tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run tests
        run: pytest tests/ --tb=short -q

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Reflex compile check
        run: reflex export --no-zip --frontend-only 2>&1 | tee /tmp/reflex-compile.log; test ${PIPESTATUS[0]} -eq 0
        env:
          DATABASE_URL_SYNC: "sqlite:///test.db"
          DATABASE_URL: "sqlite+aiosqlite:///test.db"

  deploy:
    needs: [lint, test, compile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e

            cd /opt/datanika/datanika
            git pull origin master

            cd /opt/datanika/datanika-cloud
            git pull origin master

            cd /opt/datanika/datanika

            # Source env vars for docker-compose interpolation
            set -a && source .env.docker && set +a

            # Build and restart with zero-downtime (one at a time)
            docker compose build app celery

            # Restart app first, wait for health, then celery
            docker compose up -d --no-deps app
            echo "Waiting for app to be healthy..."
            timeout 120 bash -c 'until docker inspect --format="{{.State.Health.Status}}" datanika-app 2>/dev/null | grep -q healthy; do sleep 3; done' || {
              echo "App failed health check — rolling back"
              docker compose up -d --no-deps app
              exit 1
            }

            docker compose up -d --no-deps celery
            echo "Deploy complete"

            # Cleanup old images
            docker image prune -f
