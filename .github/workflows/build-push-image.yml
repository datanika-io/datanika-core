name: Build & push image

# Builds the combined core+cloud Docker image on GHA and pushes to
# ghcr.io/datanika-io/datanika-core. Downstream deploys pull this image
# instead of building on the app host (saves ~2 GB RAM + ~30s CPU spike on
# every deploy, which landed on live users under Granian).
#
# 🚨 THE HOST NAMED HERE WAS STALE BY SEVEN WEEKS. It said "Hetzner", and that
# box was TERMINATED 2026-07-14; production moved to pointer.gr (185.25.22.188)
# on 2026-07-17. A stale host name in a deploy-adjacent file is the first thing
# an incident responder reads, which is why it is corrected rather than left.
#
# Phase 1: builds + pushes only. The deploy still builds on the box itself
# (deploy-pointer.yml, tar over SSH).
# Phase 2 (never started): flip the deploy to `docker compose pull`. ⚠️ That is
# blocked, not merely unstarted — ci.yml records that GHCR is inaccessible FROM
# the box, and core#1014 is why the package cannot simply be made public.
#
# Tagging:
#   push to dev    → :dev and :dev-<short-sha>
#   push to master → :latest and :<short-sha>
#   push v* tag    → :v0.x.y and :<short-sha>   (pinnable release image)
#
# The v* tag build was added so self-hosters could pin a release instead of tracking
# :latest — see docs/specs/SPEC_RELEASE_VERSIONING.md (the old plans/infra/ path in
# this comment has not existed since the 2026-08-31 consolidation). `v*` is disjoint
# from release-mcp.yml's `mcp-v*` trigger (globs anchor at the start), so tagging the
# platform never publishes the MCP sub-package.
#
# 🚨 core#1014 — NOBODY OUTSIDE THE ORG CAN PULL WHAT THIS PUSHES, and that is correct
# for now. The package is private, and it must stay private while this build grafts the
# closed-source datanika-cloud tree into the image. Making it public is not a settings
# fix, it is a publication.
#
# ⚠️ THIS JOB BUILDS THE **CLOUD** EDITION, and it does so by passing no build arg at
# all. Since 2026-09-04 the Dockerfile takes `DATANIKA_IMAGE_EDITION`, defaulting to
# `cloud` precisely so this workflow and the box's compose build are unchanged. If that
# default ever flips, this job silently starts publishing an image with no billing
# plugin — every container healthy, nothing metered, which is core#772's shape.
# Guarded by tests/test_deploy/test_core_only_image.py.
#
# 🟡 THE CORE-ONLY IMAGE EXISTS AND IS NOT PUBLISHED HERE, deliberately. `ci.yml`'s
# `core-only-image` job builds and probes it on every PR; nothing pushes it. GHCR
# visibility is per PACKAGE and not per tag, so publishing it means a SECOND package
# and a one-way public/private decision — not a tag added to this list. The order that
# keeps that door shut is build → verify → decide, and only the third step is left.
# Do not add a core-only tag to `Compute tags` below to "get it started".

on:
  push:
    branches: [dev, master]
    tags: ["v*"]
  workflow_dispatch:
  # No paths filter: deploy jobs wait on the build-push check completing
  # on the exact commit SHA, so every push to dev/master MUST produce
  # an image (even if only docker-compose.yml or ci.yml changed).
  # The gha cache keeps unchanged-source rebuilds to ~30-60s.

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout core (this repo)
        uses: actions/checkout@v6
        with:
          path: core

      - name: Checkout cloud (private)
        uses: actions/checkout@v6
        with:
          repository: datanika-io/datanika-cloud
          token: ${{ secrets.CLOUD_REPO_TOKEN }}
          # Branch builds track the same-named cloud branch. A v* release tag does
          # NOT exist in the cloud repo, so release images build against cloud master
          # (which is what master-built prod images already use).
          ref: ${{ github.ref_type == 'tag' && 'master' || github.ref_name }}
          path: cloud

      # Dockerfile assumes monorepo layout with datanika/ + datanika-cloud/
      # at the root. Reshape checkout paths to match.
      - name: Reshape build context
        run: |
          mkdir -p build-context
          mv core build-context/datanika
          mv cloud build-context/datanika-cloud

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          REPO="ghcr.io/datanika-io/datanika-core"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Release tag -> pinnable version image, e.g. :v0.1.0
            # (:latest already points at this same SHA from the master build)
            TAGS="${REPO}:${GITHUB_REF_NAME},${REPO}:${SHORT_SHA}"
          elif [ "${GITHUB_REF_NAME}" = "master" ]; then
            TAGS="${REPO}:latest,${REPO}:${SHORT_SHA}"
          else
            TAGS="${REPO}:dev,${REPO}:dev-${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Computed tags: ${TAGS}"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/datanika/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
