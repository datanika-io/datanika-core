global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Blue/green: the app runs as one of a PAIR and the compose service name of the live
  # one alternates. Scraping only "app" meant that whenever GREEN was serving, this
  # target failed DNS resolution ("lookup app on 127.0.0.11:53: server misbehaving") and
  # App Unhealthy fired continuously, re-notifying hourly, while the site was perfectly
  # fine — observed overnight 23:40-06:20 UTC (#479).
  #
  # Both are scraped; exactly one is expected to be down at any moment, so the alert
  # collapses them with max() rather than checking either individually.
  - job_name: "datanika-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]

  - job_name: "datanika-app-b"
    metrics_path: /metrics
    static_configs:
      - targets: ["app_b:8000"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # core#704 — until 2026-08-31 Prometheus scraped seven targets and none of them was
  # Celery, so every task metric the code collected was discarded. `celery_tasks_total`
  # is incremented by signal handlers that run in the WORKER process while `/metrics` is
  # a Starlette route in the APP process; querying `celery_tasks_total` against this
  # Prometheus returned 0 series, which is why `celery-task-failures` had never been able
  # to fire.
  #
  # The exporter reads the worker's event stream off the Redis broker, so it covers every
  # task rather than the ones we thought to instrument, and needs no application change.
  # It depends on the worker running with `-E` — see the comment on the `celery` service
  # in docker-compose.yml for why that is not optional.
  - job_name: "celery"
    static_configs:
      - targets: ["celery-exporter:9808"]

  # Blackbox probes — HTTP health checks for external endpoints.
  # Targets are probed via the blackbox exporter's http_2xx module.
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://datanika.io/sitemap-index.xml
          - https://datanika.io/
          - https://app.datanika.io/healthz
          - https://app.datanika.io/
          - https://plausible.datanika.io/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
