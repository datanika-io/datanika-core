apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram
    group_by:
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: telegram
        matchers:
          - severity = critical
        group_wait: 10s
        # core#598: without this the route inherits the root group_interval (5m), so a
        # RESOLVED notice can never arrive sooner than 5 minutes after the FIRING one —
        # every gap looks like a 5-minute outage regardless of the real duration.
        group_interval: 1m
        repeat_interval: 1h
      - receiver: telegram
        matchers:
          - severity = warning
        repeat_interval: 4h
