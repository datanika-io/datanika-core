name: Nightly Connector Smoke

# Lightweight live-API probe against every paid connector sandbox with
# provisioned credentials. See tests/test_connector_smoke/ for the checks
# and PLAN_QA.md §P1 Connector Smoke Matrix for the rationale.
#
# Fails loud (Telegram) when a vendor API change, credential rotation,
# or account expiry would silently break Datanika's connector code.

on:
  schedule:
    # 03:00 UTC daily — off-peak in EU, US, and APAC. Vendor APIs are
    # least likely to be under maintenance windows at this time.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-connector-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # QA_CONNECTOR_CREDENTIALS + QA_BIGQUERY_SA_JSON secrets are scoped
    # to the `production` environment. Without this line the job runs
    # without those secrets and the credential-gate fails loud.
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Locked tree, not a fresh resolution (core#470) — a connector smoke
          # that runs different library versions than prod proves nothing about
          # prod, which is the whole point of this job.
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps
          # Connector-specific libs not in core deps.
          # kafka-python must be >=2.1 — 2.0.x imports kafka.vendor.six.moves,
          # which is gone in Python 3.12, so the probe would die at import and
          # the test's `except ImportError: pytest.skip` would turn a broken
          # Kafka smoke into a silent green. Pin the floor, don't rely on the skip.
          uv pip install --system \
            "google-cloud-bigquery>=3.0" \
            "google-analytics-data>=0.18" \
            "kafka-python>=2.1"

      # 🚨 core#983 — the credential BUNDLE is gone, and with it every
      # `$GITHUB_ENV` write in this job that carried a secret.
      #
      # What was here: two steps that base64-decoded an aggregate env file and
      # appended each `KEY=VALUE` to `$GITHUB_ENV`. GitHub masks strings it has
      # been *given* — it knew the blob and redacted exactly that — so every
      # value decoded out of it was a string the runner had never seen and was
      # printed in the `##[group]Run …` header of every later step. This repo is
      # PUBLIC; 53 downloadable Actions logs carried live vendor PATs in
      # cleartext, oldest 2026-06-05 (core#943).
      #
      # core#943 patched that with an `::add-mask::` loop, and the patch works
      # (measured in production 2026-09-03: 0 unmasked tokens after, 1 before).
      # But it is a patch around a design that defeats masking by construction:
      # the loop has to decide, at runtime, which manufactured strings deserve
      # protection. Registering each credential individually removes the
      # decision — **GitHub masks it natively and our code has no opportunity
      # to get it wrong.** The `::add-mask::` loop is deleted in the same commit
      # that introduces native masking, so there is never a window with neither.
      #
      # ⚠️ Secret vs variable is decided by TODAY'S EXPOSURE, not by whether the
      # value looks like a credential (core#983). A naive credentials-vs-config
      # split would have made currently-masked values newly visible in a public
      # log — `DATABRICKS_HOST`, `SHOPIFY_SHOP_DOMAIN` and `FRESHDESK_DOMAIN`
      # are account identifiers that cloud#153 lists as exposed precisely
      # because they name the accounts the credentials open. **The rule is: no
      # exposure regression in either direction.** Masked today ⇒ secret.
      # Visible today ⇒ variable, which also keeps the short constants readable
      # rather than redacting an 8-character string across the whole log.
      #
      # ⚠️ The two `*_CREDENTIALS_FILE` variables are PATHS, not credentials —
      # both are `secrets/qa-bigquery-sa.json`, a literal already present in
      # this file's source on a public repo. Variables, at zero exposure cost.
      #
      # ⚠️ Naming each key means adding a credential requires editing this file.
      # That is the point: it puts the credential surface in a reviewable diff.
      # `tests/test_deploy/test_nightly_smoke_env_parity.py` makes the omission
      # fail at PR time instead of twenty-four hours later in a red nightly.
      #
      # There is deliberately NO separate credential-gate step. The suite's own
      # `_require_env` already fails loudly and names every empty variable
      # (`tests/test_connector_smoke/conftest.py`); a second hand-maintained
      # list of the same names in a `run:` block is a second source of truth,
      # and it would rot.

      - name: Write the BigQuery / GA4 service-account key to a file
        env:
          # The one credential that never leaked, because it goes to a FILE and
          # has never passed through `$GITHUB_ENV` (cloud#153 confirms it).
          # Multi-line JSON, so it stays its own secret rather than joining the
          # `env:` block below.
          QA_BIGQUERY_SA_JSON: ${{ secrets.QA_BIGQUERY_SA_JSON }}
        run: |
          # ⚠️ This used to be `if [ -n "$QA_BIGQUERY_SA_JSON" ]` — i.e. an
          # absent secret wrote no file and the step still exited 0. Assert the
          # positive artifact instead: the file exists and is non-empty JSON.
          if [ -z "$QA_BIGQUERY_SA_JSON" ]; then
            echo "::error::QA_BIGQUERY_SA_JSON is empty — the BigQuery and GA4 probes cannot authenticate. Check the secret is set on the 'production' environment."
            exit 1
          fi
          mkdir -p secrets
          printf '%s' "$QA_BIGQUERY_SA_JSON" > secrets/qa-bigquery-sa.json
          chmod 600 secrets/qa-bigquery-sa.json
          [ -s secrets/qa-bigquery-sa.json ] || { echo "::error::secrets/qa-bigquery-sa.json is empty after write"; exit 1; }
          # Shape, not content — never print the key. `type` is the only field
          # asserted, so a truncated or base64-wrapped secret fails here rather
          # than inside a vendor client three steps later.
          python -c "import json,sys; d=json.load(open('secrets/qa-bigquery-sa.json')); sys.exit(0 if d.get('type')=='service_account' else 1)" \
            || { echo "::error::secrets/qa-bigquery-sa.json is not a service_account key"; exit 1; }

      - name: Run connector smoke tests
        id: smoke
        env:
          DATANIKA_CONNECTOR_SMOKE: "1"

          # ── Credentials — masked natively by GitHub, one secret per value ──
          # Every name below is masked in today's logs and stays masked.
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          FRESHDESK_API_KEY: ${{ secrets.FRESHDESK_API_KEY }}
          FRESHDESK_DOMAIN: ${{ secrets.FRESHDESK_DOMAIN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          PIPEDRIVE_API_TOKEN: ${{ secrets.PIPEDRIVE_API_TOKEN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

          # ── Configuration — visible in today's logs, deliberately kept so ──
          # Masking these would redact ordinary strings project-wide for no
          # benefit: `GA4_PROPERTY_ID` is 9 characters and a shop domain
          # fragment appears in half the assertion messages.
          BIGQUERY_CREDENTIALS_FILE: ${{ vars.BIGQUERY_CREDENTIALS_FILE }}
          BIGQUERY_PROJECT_ID: ${{ vars.BIGQUERY_PROJECT_ID }}
          GA4_CREDENTIALS_FILE: ${{ vars.GA4_CREDENTIALS_FILE }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          KAFKA_SASL_USERNAME: ${{ vars.KAFKA_SASL_USERNAME }}
          KAFKA_TOPIC: ${{ vars.KAFKA_TOPIC }}
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
        # A skipped probe is worse than a failing one: it reports green while
        # testing nothing. Missing creds and un-importable client libs now FAIL
        # rather than skip (tests/test_connector_smoke/conftest.py), so a healthy
        # run has ZERO skips — which makes "any skip at all" a usable alarm.
        #
        # This catches the one hole strict mode cannot: if DATANIKA_CONNECTOR_SMOKE
        # above were dropped or misspelled, the gate would skip all probes at
        # collection time and pytest would still exit 0 — a perfectly green
        # nightly that tested nothing.
        #
        # 🚨 `set -o pipefail` is the whole point of this block (core#827), and its
        # absence is what made this job report `success` while running
        # `12 failed, 9 passed` for EIGHT consecutive nights, with the Telegram step
        # `skipped` every time. A pipeline's status is its LAST command's — `tee`,
        # which always succeeds — and GitHub's default `run:` shell is `bash -e {0}`
        # WITHOUT `-o pipefail`. So pytest's exit code was discarded and the only
        # thing that could still fail the step was the skip grep below.
        #
        # The two halves composed into the hole: the conftest was deliberately
        # changed to turn missing creds into FAILURES rather than skips (so that
        # "any skip" became a usable alarm), which moved every real failure into
        # precisely the blind spot the pipe had created. Both changes were right on
        # their own. Same defect and same fix as landing#339.
        #
        # `${PIPESTATUS[0]}` rather than plain `-e`: under `set -e` the step would
        # abort on the pytest line and the skip guard would never run, so a run that
        # both failed AND skipped would report only the failure. Both signals are
        # worth having, and the skip guard is the more specific diagnosis.
        run: |
          set -o pipefail

          # 🚨 core#944 Class C — the Oracle probes do not belong in THIS job.
          # `oracle-smoke` below runs them against a live Oracle XE service
          # container and passes. This job has no Oracle credentials, so running
          # them here produced two failures reading `Missing env vars: ORACLE_*`
          # every night — a test-selection defect wearing a connector's clothes.
          # `-k "not oracle"` is the exact complement of `oracle-smoke`'s `-k oracle`.
          #
          # ⚠️ A DESELECT PRODUCES NO `skipped` LINE, so the skip alarm below is
          # structurally blind to it. A `-k` expression that matched more than
          # intended — a rename, a typo, a fifth Oracle-named test — would shrink
          # this job silently while every signal stayed green. That is the exact
          # shape of the bug this job keeps being bitten by, so the count is
          # asserted. `tests/test_deploy/test_nightly_smoke_tiers.py` independently
          # derives this number from the test sources, so the two cannot drift.
          EXPECT_DESELECTED=2

          rc=0
          pytest tests/test_connector_smoke/ -v --tb=short -rs -k "not oracle" | tee /tmp/smoke.log || rc=$?

          # ⚠️ Do NOT parse pytest's English summary line for the tier counts.
          # Measured on pytest 9.0.2: a strict XPASS is reported as `failed` and
          # the summary contains NO `xpassed` token at all, so a grep for it has
          # one possible answer. `tests/test_connector_smoke/conftest.py` reads the
          # reporter directly and emits this line from the pin itself — one source
          # of truth, and a POSITIVE artifact whose absence is itself a failure.
          TIER=$(grep -m1 '^\[tier\] pinned=' /tmp/smoke.log || true)
          if [ -z "$TIER" ]; then
            echo "::error::The [tier] summary line is ABSENT from the pytest output. It is emitted by pytest_terminal_summary in tests/test_connector_smoke/conftest.py whenever DATANIKA_CONNECTOR_SMOKE=1, so its absence means the gate was off, the conftest was not loaded, or the hook stopped firing — none of which is a clean run. Nothing below this point can be trusted without it."
            exit 1
          fi
          field() { printf '%s' "$TIER" | sed -n "s/.*[^a-z_]$1=\([0-9][0-9]*\).*/\1/p"; }
          n_pinned=$(field pinned); n_xfailed=$(field xfailed)
          n_stale=$(field stale_pins); n_unexpected=$(field unexpected_failure)
          n_notrun=$(field not_run); n_gpassed=$(field gating_passed)
          n_gfailed=$(field gating_failed); n_desel=$(field deselected)
          n_skipped=$(field skipped)

          # Print the tier split. "15 passed" reads like full coverage until you
          # look at what is NOT in that number.
          {
            echo "### Nightly connector smoke — tier split"
            echo ""
            echo "| tier | count | fails the job? |"
            echo "|---|---|---|"
            echo "| gating — live accounts | ${n_gpassed} passed / ${n_gfailed} failed | **yes** |"
            echo "| awaiting provisioning — cloud#160 | ${n_xfailed} of ${n_pinned} pinned | no |"
            echo "| stale pin — the account is BACK | ${n_stale} | **yes** |"
            echo "| unexpected failure behind a pin | ${n_unexpected} | **yes** |"
            echo "| pin covers nothing | ${n_notrun} | **yes** |"
            echo "| covered by the \`oracle-smoke\` job | ${n_desel} deselected | n/a |"
            echo "| skipped — must be 0 | ${n_skipped} | **yes** |"
            echo ""
            echo "\`$TIER\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$TIER"

          if [ "${n_desel:-x}" != "$EXPECT_DESELECTED" ]; then
            echo "::error::Expected exactly $EXPECT_DESELECTED probe(s) deselected by -k 'not oracle', got '${n_desel:-<unparsed>}'. A deselect emits no 'skipped' line, so nothing else in this job can see it — this assertion is the only thing standing between a mis-scoped -k expression and a silently shrunken nightly. If an Oracle probe was legitimately added or removed, update EXPECT_DESELECTED here; tests/test_deploy/test_nightly_smoke_tiers.py derives the same number from the test sources and will fail until both agree."
            exit 1
          fi

          # 🚨 The skip check reads the reporter's own count first, and its grep
          # is ANCHORED TO THE SUMMARY LINE. The unanchored `[0-9]+ skipped` this
          # used to be also matched the tier line's own `deselected=2 skipped=0`
          # — a digit, a space, then the word — so the very first run carrying a
          # tier line failed with "probes were SKIPPED" while the reporter said
          # skipped=0. Measured on run 33741831511. Both halves were individually
          # reasonable: a new diagnostic line collided with an old detector's
          # loose pattern, and the detector's verdict looked like a real outage.
          # tests/test_deploy/test_nightly_smoke_tiers.py runs the real grep
          # against a real tier line, in both directions.
          if [ "${n_skipped:-1}" != "0" ] || grep -qE '^=+.* [0-9]+ skipped' /tmp/smoke.log; then
            echo "::error::Smoke probes were SKIPPED (reporter says skipped=${n_skipped:-?}) — a skipped probe reports green while testing nothing. Check that DATANIKA_CONNECTOR_SMOKE=1 is still set on this step and that every credential named in this step's env: block resolves — since core#983 there is no credential bundle; each value is its own secret or variable, and an unregistered one renders as the empty string, which conftest reports as a missing env var."
            exit 1
          fi

          if [ "${n_stale:-1}" != "0" ] || [ "${n_notrun:-1}" != "0" ]; then
            echo "::error::The awaiting-provisioning pin no longer describes reality: stale_pins=${n_stale} not_run=${n_notrun}. A stale pin means a vendor account we recorded as dead is alive again — delete its entry from AWAITING_PROVISIONING in tests/test_connector_smoke/conftest.py and close the matching item on cloud#160. A pin covering nothing means it names a probe that did not run. Do NOT silence either: a pin that can only ever be satisfied is muting, not tiering. See the [tier] detail lines above for the names."
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::Connector smoke probes FAILED (pytest exit $rc). Open the log above and find the first FAILED test — this step no longer launders pytest's exit code through the pipe to tee (core#827). A failure here is a LIVE connector breaking; probes on known-dead accounts are xfailed and cannot reach this line."
            exit "$rc"
          fi

      - name: Telegram alert on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          TEXT=$(printf '\xf0\x9f\x94\xa5 <b>Nightly connector smoke failed</b>\n\nOne or more paid-connector sandboxes failed auth + metadata probe.\n\n<b>Triage</b>: open the run link, look for the first FAILED test. Likely causes (in order of frequency):\n- Credential rotated / expired (Stripe, HubSpot PATs rotate silently)\n- Sandbox/trial expired (Databricks 14-day trial)\n- Vendor API shape changed (rare but catches it early)\n\n<b>Run</b>: %s\n\nReprovisioning is tracked as human-locked issues in the PRIVATE cloud repo:\ngh issue list --repo datanika-io/datanika-cloud --label human-locked' "$(esc "$RUN_URL")")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML"

  # Oracle runs in its own job with an ephemeral XE service container, isolated
  # from the SaaS probes above so an Oracle image/boot hiccup can't mask a real
  # SaaS-credential expiry (the point of the nightly). Oracle has no offline
  # live-DB unit test, so this is the only place the real oracledb thin driver
  # is exercised end-to-end (core#312, connectors Wave-1).
  oracle-smoke:
    runs-on: ubuntu-latest
    # Only for the Telegram token; the Oracle creds below are for an ephemeral
    # throwaway container, not secrets (mirrors the postgres test:test pattern
    # in ci.yml's migration-roundtrip job).
    environment: production
    timeout-minutes: 20
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: DatanikaSmoke1
          APP_USER: datanika_smoke
          APP_USER_PASSWORD: DatanikaSmoke1
        # gvenzl ships healthcheck.sh on PATH; GH Actions waits for the service
        # to be healthy before any step runs. Generous retries for cold boot.
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # oracledb + sqlalchemy are core deps; ".[dev]" pulls pytest. No
        # BigQuery/Kafka extras needed for the Oracle probe.
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps

      - name: Oracle XE connection env
        run: |
          {
            echo "ORACLE_HOST=localhost"
            echo "ORACLE_PORT=1521"
            echo "ORACLE_SERVICE=XEPDB1"
            echo "ORACLE_USER=datanika_smoke"
            echo "ORACLE_PASSWORD=DatanikaSmoke1"
          } >> "$GITHUB_ENV"

      - name: Run Oracle connector smoke + E2E tests
        env:
          DATANIKA_CONNECTOR_SMOKE: "1"
        # Both Wave-1 files' oracle-named tests: the auth/metadata smoke and the
        # extract→load→assert E2E (core#311). `-k oracle` deselects the SaaS tests,
        # which need creds this isolated container-only job doesn't have.
        run: >-
          pytest
          tests/test_connector_smoke/test_wave1_connectors_smoke.py
          tests/test_connector_smoke/test_wave1_connectors_extract_load.py
          -v --tb=short -k oracle

      - name: Telegram alert on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          TEXT=$(printf '\xf0\x9f\x94\xa5 <b>Nightly Oracle connector smoke failed</b>\n\nThe Oracle XE probe failed. Unlike the SaaS probes this is self-contained (ephemeral XE container), so a failure points at OUR code or the image, not a vendor.\n\n<b>Triage</b>: open the run link. Likely causes:\n- oracledb thin-driver break / version bump\n- gvenzl/oracle-xe image or service-name (XEPDB1) drift\n- connection_service._build_sa_url Oracle regression\n\n<b>Run</b>: %s' "$(esc "$RUN_URL")")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML"
