# Local-only reverse proxy — one origin for the local stack (core#1197).
#
# WHY THIS EXISTS
# ---------------
# The E2E specs use RELATIVE paths (`/api/v1/...`) against a single `baseURL`. On staging
# and prod, Apache supplies that single origin: `/api/`, `/_event`, `/mcp`, `/healthz` and
# friends go to the backend, everything else to the Reflex frontend.
#
# A local `docker compose` stack has no proxy at all — `:3000` is the frontend and `:8000`
# is the backend, and nothing merges them. Measured on 2026-09-10:
#
#     localhost:3000/api/v1/connections -> 200 text/html          (the Reflex SPA)
#     localhost:8000/api/v1/connections -> 401 application/json   (the real API)
#
# 🚨 Note the 200. Without this proxy, every API-authenticated spec queries the SPA and gets
# a success status with HTML. The gating suite failed 33/62 that way — but it failed only
# because those assertions happen to test a leak condition HTML cannot satisfy. An
# assertion shaped `expect(status).not.toBe(200)`, or "the body does not contain org B's
# name", would have PASSED against the SPA. A proxy-less local stack is therefore a
# vacuous-pass hazard aimed squarely at the tenant-isolation suite — the specs whose entire
# job is proving org A cannot read org B.
#
# THE CONTRACT
# ------------
# This file must mirror the backend route table of
# `deploy/server/apache-app.datanika.io.conf`. If it drifts, "local is production-shaped"
# stops being true and local greens stop meaning anything.
# `tests/test_deploy/test_local_proxy_mirrors_vhost.py` compares the two and fails on drift.
#
# NOT FOR DEPLOYMENT. Nothing under `deploy/local/` is installed by
# `scripts/install-server-scripts.sh` or named by any deploy step.

upstream datanika_backend  { server app:8000; }
upstream datanika_frontend { server app:3000; }

server {
    listen 80;
    server_name localhost;

    # Uploads and dataset previews are not small.
    client_max_body_size 512m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Reflex websocket -> backend ---------------------------------------------------
    # Apache needs mod_proxy_wstunnel + a RewriteRule here because 2.4.52's
    # `upgrade=websocket` is broken on that box; nginx needs only the Upgrade headers.
    # Engine.IO falls back to XHR polling on the same path, so this location must carry
    # both the upgrade headers AND ordinary proxying.
    location /_event {
        proxy_pass http://datanika_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # --- Remote MCP -> backend ---------------------------------------------------------
    # Streamable HTTP holds a long-lived SSE stream: it needs a long read timeout and no
    # buffering, which is the nginx equivalent of the vhost's `timeout=3600` + `no-gzip`.
    location /mcp {
        proxy_pass http://datanika_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        gzip off;
    }

    # --- Backend API and health --------------------------------------------------------
    location /api/     { proxy_pass http://datanika_backend; }
    location /_upload  { proxy_pass http://datanika_backend; }
    location /ping     { proxy_pass http://datanika_backend; }
    location /healthz  { proxy_pass http://datanika_backend; }
    location /readyz   { proxy_pass http://datanika_backend; }

    # --- Remote-MCP OAuth 2.1 authorization server -> backend --------------------------
    # ⚠️ `/oauth/consent` is deliberately ABSENT: it is a Reflex FRONTEND page
    # (`app.add_page route="/oauth/consent"`) and must keep resolving to :3000. Adding it
    # here would break the consent screen in exactly the way the vhost comment warns about.
    location /.well-known/oauth-protected-resource   { proxy_pass http://datanika_backend; }
    location /.well-known/oauth-authorization-server { proxy_pass http://datanika_backend; }
    location /oauth/authorize { proxy_pass http://datanika_backend; }
    location /oauth/token     { proxy_pass http://datanika_backend; }
    location /oauth/register  { proxy_pass http://datanika_backend; }

    # --- Everything else -> the Reflex frontend ----------------------------------------
    location / {
        proxy_pass http://datanika_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
