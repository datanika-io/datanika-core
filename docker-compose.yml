services:
  postgres:
    image: postgres:16-alpine
    container_name: datanika-postgres
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datanika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-datanika}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg_backups:/backups
      - ./scripts:/scripts:ro
      - ./scripts/pg-init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "log_line_prefix=%t [%p] %q%u@%d "
      - "-c"
      - "log_statement=none"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: datanika-postgres-exporter
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-datanika}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datanika}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datanika-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: datanika/Dockerfile
    image: datanika-io/app:latest
    container_name: datanika-app
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.docker
    environment:
      GRANIAN_WORKERS: "4"
      REFLEX_MOUNT_FRONTEND_COMPILED_APP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dbt_projects:/app/dbt_projects
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run reflex run --env prod --backend-host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery:
    build:
      context: ..
      dockerfile: datanika/Dockerfile
    image: datanika-io/celery:latest
    container_name: datanika-celery
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dbt_projects:/app/dbt_projects
    command: uv run celery -A datanika.tasks.celery_app:celery_app worker -l info
    restart: unless-stopped

  # --- Monitoring ---

  prometheus:
    image: prom/prometheus:latest
    container_name: datanika-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  # Blackbox Exporter — probes external HTTP(S) endpoints and exposes metrics.
  # Used for sitemap health checks and the SEO probe. Prometheus scrapes this
  # via the scrape configs in monitoring/prometheus.yml.
  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: datanika-blackbox
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: datanika-grafana
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.docker
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.docker}
      GF_UNIFIED_ALERTING_ENABLED: "true"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../datanika-cloud/monitoring/revenue-dashboard.json:/var/lib/grafana/dashboards/cloud/revenue.json:ro
      - ../datanika-cloud/monitoring/volume-dashboard.json:/var/lib/grafana/dashboards/cloud/volume.json:ro
      - ./monitoring/db-performance-dashboard.json:/var/lib/grafana/dashboards/infra/db-performance.json:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/infra/server-overview.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: datanika-node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: datanika-cadvisor
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  dbt_projects:
  pg_backups:
  prometheus_data:
  grafana_data:
