# Two env filenames, both optional, and the reason is core#736.
#
# Compose resolves this file through two INDEPENDENT channels:
#   * `${VAR}` interpolation, fed by the shell environment or the project `.env` file —
#     never by `env_file:`;
#   * `env_file:`, which populates the CONTAINER's environment and is invisible to
#     interpolation.
#
# Production satisfies both by sourcing the box's `.env.docker` into the shell before
# calling compose (`set -a && . ./.env.docker && set +a`, deploy-pointer.yml). That file is
# deliberately never shipped — the deploy preserves the box's copy — so a fresh clone has
# no `.env.docker` at all, and the published quickstart's `cp .env.example .env` produced
# `env file …/.env.docker not found`, which is fatal to the whole `up`.
#
# ⚠️ Copying the example to `.env.docker` instead does NOT fix it. That was the obvious
# one-word remedy and it still fails, on `required variable GRAFANA_ADMIN_PASSWORD is
# missing a value` — because that is the interpolation channel, which `env_file:` does not
# feed. It renders cleanly only in a shell that has already sourced the file.
#
# Listing both names with `required: false` lets whichever one exists win: `.env` for a
# self-hoster (and Compose reads it for interpolation automatically, closing the second
# channel for free), `.env.docker` on the box, listed last so it takes precedence there.
# `required: false` needs Compose >= 2.24; the prod box runs 2.32.4, CI runners newer.
# Guarded by tests/test_deploy/test_selfhost_quickstart.py.
services:
  postgres:
    image: postgres:16-alpine
    container_name: datanika-postgres
    env_file:
      # Both optional; whichever exists wins. See the note at the top of this file (#736).
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datanika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-datanika}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg_backups:/backups
      - ./scripts:/scripts:ro
      - ./scripts/pg-init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "log_line_prefix=%t [%p] %q%u@%d "
      - "-c"
      - "log_statement=none"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-exporter:
    # --- `monitoring` profile (core#736) ---------------------------------------------
    # A plain `docker compose up -d` used to start ELEVEN services, six of them this
    # production observability stack, on a box whose owner asked for a data pipeline.
    # It also made GRAFANA_ADMIN_PASSWORD mandatory for someone who never wanted Grafana,
    # because Compose interpolates the whole file before starting anything.
    #
    # ⚠️ This does NOT change the deploy. Naming a profiled service explicitly on the
    # command line auto-enables its profile, so deploy-pointer.yml's
    # `up -d postgres redis postgres-exporter cadvisor node-exporter` and
    # `up -d --force-recreate prometheus grafana blackbox` still start all six.
    # Verified with `--dry-run` against those exact lines before shipping, not assumed.
    # Prod's own invocation is unchanged; `--profile monitoring` is for anyone bringing
    # the stack up by hand.
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:latest
    container_name: datanika-postgres-exporter
    ports:
      - "127.0.0.1:9187:9187"
    # core#616: the `stat_statements` collector is OFF by default in this image, so
    # `pg_stat_statements_seconds_total` -- which the `pg-slow-queries` alert rule has
    # always alerted on, under its correct name -- was never exported. The extension
    # itself is installed in the prod DB (`select extname from pg_extension`), so this
    # flag is the whole gap. Verified against the prod DB with a throwaway container of
    # this same image (0.20.1): 100 series appear immediately.
    #
    # ⚠️ This flag only reaches production because `deploy-pointer.yml` now lists
    # postgres-exporter in its `up -d` line. It was in none of the deploy's service
    # lists before, so it had run 6 weeks with no way to pick up a config change.
    command: ["--collector.stat_statements"]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-datanika}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datanika}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datanika-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    # In CI/CD, the image is pulled from GHCR (built by build-push-image.yml).
    # For local dev, `docker compose build` still works — it builds from source
    # and tags with the same image name so subsequent `up` finds it.
    image: ghcr.io/datanika-io/datanika-core:${DATANIKA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: datanika/Dockerfile
    container_name: datanika-app
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8000:8000"
    env_file:
      # Both optional; whichever exists wins. See the note at the top of this file (#736).
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      GRANIAN_WORKERS: "4"
      # 🚨 core#785. `uv run` RE-SYNCS the venv from uv.lock before running the
      # command, and the Dockerfile grafts `datanika-cloud` and `datanika-mcp` in
      # with `uv pip install` AFTER `uv sync --frozen` — neither consults the lock.
      # So the shipped venv holds packages the lockfile does not know about, and
      # making the venv match the lock is precisely what a sync is for. They
      # survive today only because uv currently chooses not to prune them.
      #
      # If uv ever does, the cloud plugin and the /mcp surface disappear at
      # CONTAINER START, with every signal green: the box's build already
      # succeeded; the build-time import assertion (#612) validated the IMAGE and
      # ran earlier; and cloud degrades silently by design, because
      # `DATANIKA_EDITION` gates it rather than failing loudly.
      #
      # The image is built and asserted at build time. Re-deriving it at boot buys
      # nothing and risks everything. Guarded by tests/test_deploy/test_uv_no_sync.py,
      # which finds the services by what their command RUNS, never by name.
      UV_NO_SYNC: "1"
      # Reflex reads REFLEX_REDIS_URL, NOT REDIS_URL (its config prefix is "REFLEX_").
      # Without it, `StateManager.create()` falls to StateManagerDisk and
      # `TokenManager.create()` to LocalTokenManager, both of which are PER PROCESS -
      # so each of the 4 workers above keeps its own session store and a reconnect
      # that lands on another one is served a stale state. Measured on prod
      # 2026-08-30: 48% of reconnects (11 stale / 23), 0/23 on a single socket.
      # AuthState.access_token lives in that state, so a stale read is a logout (#646).
      REFLEX_REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.docker - Reflex needs it as REFLEX_REDIS_URL (#646)}
      REFLEX_MOUNT_FRONTEND_COMPILED_APP: "true"
      # Pinned absolute: the default `./uploaded_files` (config.py) resolves against the
      # working directory, so app and celery could silently diverge. See #471.
      FILE_UPLOADS_DIR: /app/uploaded_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dbt_projects:/app/dbt_projects
      # Uploads lived inside the image: every rebuild destroyed the archives while their
      # UploadedFile rows survived, leaving dangling archive_paths (#471).
      - uploaded_files:/app/uploaded_files
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run reflex run --env prod --backend-host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # --- Blue/green partner for zero-downtime deploys (A3, #425) ---
  # Identical to `app` but on alternate host ports and a different container name.
  # Behind a compose PROFILE, so an ordinary `up -d` never starts it: the second
  # container exists only for the duration of a swap, leaving steady-state memory
  # unchanged (~1.2 GiB per app instance on an 8 GB box that also runs staging +
  # monitoring). scripts/deploy-bluegreen.sh brings it up, waits for its healthcheck,
  # repoints Apache via the Define include, then stops the other colour.
  #
  # ⚠️ Both colours run `alembic upgrade head` at startup, so during a swap the OLD
  # code briefly runs against the NEW schema. Migrations must therefore be
  # expand/contract — see plans/infra/SPEC_EXPAND_CONTRACT_MIGRATIONS.md (#449).
  app_b:
    profiles: ["bluegreen"]
    image: ghcr.io/datanika-io/datanika-core:${DATANIKA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: datanika/Dockerfile
    container_name: datanika-app-b
    ports:
      - "127.0.0.1:3010:3000"
      - "127.0.0.1:8010:8000"
    env_file:
      # Both optional; whichever exists wins. See the note at the top of this file (#736).
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      GRANIAN_WORKERS: "4"
      # core#785 — the full account is on `app` above. Short version: `uv run`
      # re-syncs from uv.lock, the grafted cloud/mcp packages are not IN the lock,
      # and their survival is uv's current choice rather than our guarantee.
      # app_b needs it as much as app: it is the colour production serves half the
      # time, and a blue/green swap onto a colour with no cloud plugin is exactly
      # the failure that would read as a clean deploy.
      UV_NO_SYNC: "1"
      # Reflex reads REFLEX_REDIS_URL, NOT REDIS_URL (its config prefix is "REFLEX_").
      # Without it, `StateManager.create()` falls to StateManagerDisk and
      # `TokenManager.create()` to LocalTokenManager, both of which are PER PROCESS -
      # so each of the 4 workers above keeps its own session store and a reconnect
      # that lands on another one is served a stale state. Measured on prod
      # 2026-08-30: 48% of reconnects (11 stale / 23), 0/23 on a single socket.
      # AuthState.access_token lives in that state, so a stale read is a logout (#646).
      REFLEX_REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.docker - Reflex needs it as REFLEX_REDIS_URL (#646)}
      REFLEX_MOUNT_FRONTEND_COMPILED_APP: "true"
      # Pinned absolute on purpose. The default is `./uploaded_files` (config.py), which
      # resolves against the working directory — so app and celery writing from different
      # CWDs would silently use different directories. See #471.
      FILE_UPLOADS_DIR: /app/uploaded_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dbt_projects:/app/dbt_projects
      # Uploaded archives lived inside the image, so every rebuild destroyed them while
      # their UploadedFile rows survived, leaving dangling archive_paths (#471). Must be
      # mounted rw by BOTH app and celery: the load runs in the worker, so a web-only
      # path fails at run time rather than upload time — the slower, more confusing
      # failure. app_b carries it too, or a blue/green swap would lose them.
      - uploaded_files:/app/uploaded_files
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run reflex run --env prod --backend-host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery:
    # Uses the same image as `app` — single Dockerfile, different CMD.
    image: ghcr.io/datanika-io/datanika-core:${DATANIKA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: datanika/Dockerfile
    container_name: datanika-celery
    env_file:
      # Both optional; whichever exists wins. See the note at the top of this file (#736).
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      # core#785 — see `app`. The worker is where this bites hardest: every cloud
      # metering hook and every run-quota check fires in THIS process (core#772),
      # and if `datanika_cloud` stopped importing here, billing would go quiet
      # while the container stayed `Up` and healthy. That exact state already ran
      # undetected in production once.
      UV_NO_SYNC: "1"
      # Must match app/app_b exactly — the LOAD runs here, so if the worker resolves a
      # different directory the failure surfaces at run time, not at upload time (#471).
      FILE_UPLOADS_DIR: /app/uploaded_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dbt_projects:/app/dbt_projects
      - uploaded_files:/app/uploaded_files
    # `-E` (core#704) is what makes the worker publish task-lifecycle events onto the
    # broker. It is NOT cosmetic and it is not the exporter's job: measured on staging
    # 2026-08-31, an exporter pointed at a worker running WITHOUT `-E` emits
    # `celery_worker_up`, `celery_queue_length`, `celery_active_worker_count` and
    # `celery_active_process_count` — and ZERO `celery_task_*` series, because those come
    # from events while the others come from broker/inspect introspection. So the
    # exporter looks healthy and every task metric is still missing. Dropping `-E` would
    # silently re-create exactly the blindness core#704 is about, one layer lower down.
    command: uv run celery -A datanika.tasks.celery_app:celery_app worker -l info -E
    restart: unless-stopped

  # --- Celery exporter (core#704) ---
  # Prometheus scraped seven targets and none was Celery. `celery_tasks_total` is
  # incremented by signal handlers in `services/metrics.py:139-166` — which run in the
  # WORKER process — while `/metrics` is a Starlette route in the APP process, so the
  # counters were never served. Measured against prod Prometheus 2026-08-31:
  # `celery_tasks_total` returns 0 series, so the `celery-task-failures` alert rule has
  # never been able to fire. (`celery_queue_length` is the exception and does work: the
  # app computes it at scrape time from Redis, in-process.)
  #
  # This reads the event stream off the broker instead, so it covers every task rather
  # than just the one we thought to instrument, and needs no application change.
  #
  # ⚠️ Pinned to 0.12.2 deliberately, and `:latest` is a trap here: on Docker Hub
  # `latest` resolves to 0.10.14 (2024-11-11) while 0.12.2 (2025-07-15) is the current
  # release — `latest` is four releases and eight months stale. Both were run against
  # the staging broker on 2026-08-31 and emit identical metric names and labels; 0.12.2
  # is pinned because it is the one that is both current and measured.
  #
  # ⚠️ `--purge-offline-worker-metrics 0` is load-bearing. The default (600) DELETES a
  # worker's series 10 minutes after its last heartbeat, so a dead worker would make
  # `celery_task_succeeded_total` vanish — and `increase(<vanished series>)` yields no
  # series, which with `noDataState: OK` reads as healthy at precisely the moment it is
  # not. Cardinality is not a concern here: one worker, ~15 task names.
  #
  # ⚠️ `profiles: ["monitoring"]` is required, and the reason is a guard that runs in the
  # OPPOSITE direction to the one this service was written against.
  # `test_deploy_service_coverage.py` asks "is every service named by SOME deploy step?"
  # — satisfied by adding this to `up -d celery beat celery-exporter`.
  # `test_selfhost_quickstart.py` asks "does a plain `up -d` start ONLY what the
  # application needs?" — and a self-hoster following the published four-line quickstart
  # has no Prometheus to scrape this with. Without the profile the second guard fails.
  # Naming a profiled service explicitly still starts it, which is exactly how
  # `up -d ... postgres-exporter cadvisor node-exporter` works today, so the deploy is
  # unaffected. Every other operator-only service here carries the same profile.
  celery-exporter:
    profiles: ["monitoring"]
    image: danihodovic/celery-exporter:0.12.2
    container_name: datanika-celery-exporter
    environment:
      # Passed as an env var rather than `--broker-url` on purpose: the URL carries the
      # Redis password, and a command-line argument is visible in `ps` output to every
      # process on this shared box. `CE_` is the exporter's own env prefix.
      # `:?` aborts the deploy loudly if `.env.docker` ever stops carrying REDIS_URL —
      # the deploy PRESERVES that file rather than shipping it, so it is not in the repo.
      CE_BROKER_URL: ${REDIS_URL:?REDIS_URL must be set in .env.docker on the box}
    command:
      - "--purge-offline-worker-metrics=0"
    ports:
      - "127.0.0.1:9808:9808"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Celery Beat (core#653) ---
  # `celery_app.py:46` has defined an hourly `datanika.run_maintenance` since forever and
  # NO BEAT PROCESS HAS EVER EXISTED, so none of the five maintenance sweeps has ever run
  # in production. Measured 2026-08-30, not inferred: the only `run_maintenance` line in
  # `docker logs datanika-celery` is `. datanika.run_maintenance` — the worker's task
  # *registration* banner, not an execution.
  #
  # Why its own container instead of `worker -B`
  # --------------------------------------------
  # `-B` is the smaller diff and the wrong one. A beat thread that dies inside a live
  # worker leaves the container `Up` and `healthy`, so the observable state is identical
  # to the bug being fixed here: nothing happens, and nothing says so. A separate
  # container has a `container_last_seen` series, which is why `container-down` in
  # monitoring/…/alerts.yml now carries `beat` in its regex. Celery's own docs also scope
  # `-B` to development.
  #
  # Why it is safe to have exactly one, without any new mechanism
  # ------------------------------------------------------------
  # Beat is a pure producer — it only puts messages on the broker — so the exactly-once
  # requirement is satisfied by the same thing `celery` already relies on: it is NOT
  # blue/green, and the deploy *recreates* it rather than standing a second one beside it
  # (`up -d celery beat`, deploy-pointer.yml). Two beats would double-fire every entry,
  # which is the same hazard that keeps `celery` out of the blue/green pair.
  #
  # ⚠️ `beat_state` is load-bearing, not tidiness
  # ---------------------------------------------
  # `beat_schedule` uses an INTERVAL (`schedule: 3600.0`). PersistentScheduler seeds
  # `last_run_at = now` when it finds no stored state, so a beat with an ephemeral
  # schedule file restarts its hour on every deploy — and on a day with 16 promotions the
  # hourly job fires zero times while every container reads healthy. That is core#653
  # reproduced in a subtler form, so the shelve DB goes on a named volume and survives
  # `up -d`. Verified on the staging image 2026-08-30: the file appears at
  # /app/beat_state/celerybeat-schedule (16 KB) within seconds of `beat: Starting...`.
  #
  # No `--pidfile`: celery 5 defaults to no PID file (`beat --help`), so there is no
  # stale-pidfile crash loop to guard against. Checked rather than assumed.
  # No dbt/uploads mounts: beat dispatches, it never touches either tree.
  beat:
    image: ghcr.io/datanika-io/datanika-core:${DATANIKA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: datanika/Dockerfile
    container_name: datanika-beat
    env_file:
      # Both optional; whichever exists wins. See the note at the top of this file (#736).
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      # core#785 — see `app`. beat is the only producer of `billing.hourly_tick`
      # and `run_maintenance`; a venv rewritten under it at start would take both
      # out while the container still reads `Up`.
      UV_NO_SYNC: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - beat_state:/app/beat_state
    command: >
      uv run celery -A datanika.tasks.celery_app:celery_app beat -l info
      --schedule /app/beat_state/celerybeat-schedule
    restart: unless-stopped

  # --- Monitoring ---

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: datanika-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      # Enables POST /-/reload so CD can apply a changed prometheus.yml without a
      # restart. Without it the endpoint 403s, and since the config is bind-mounted,
      # `compose up -d` won't recreate the container either — so a deployed config
      # change silently does nothing. See #426. Only reachable on 127.0.0.1.
      - "--web.enable-lifecycle"
    restart: unless-stopped

  # Blackbox Exporter — probes external HTTP(S) endpoints and exposes metrics.
  # Used for sitemap health checks and the SEO probe. Prometheus scrapes this
  # via the scrape configs in monitoring/prometheus.yml.
  blackbox:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:latest
    container_name: datanika-blackbox
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    restart: unless-stopped

  grafana:
    # Profiled for the reason above, and for a second one: the two `../datanika-cloud`
    # bind mounts below reach into a PRIVATE sibling repository. A self-hoster cloning
    # only datanika-core does not have it, and Docker creates a *directory* at a missing
    # bind-mount source — so Grafana would find directories where it expects dashboard
    # JSON, silently. Behind the profile, a default `up -d` never creates the container
    # and never creates those paths. Residual, tracked separately: someone who *does* run
    # `--profile monitoring` from a core-only clone still hits them; the durable fix is a
    # compose override the cloud edition supplies, which needs a deploy change (Infra).
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: datanika-grafana
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      # Both optional; whichever exists wins. See the note at the top of this file (#736).
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.docker}
      GF_UNIFIED_ALERTING_ENABLED: "true"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../datanika-cloud/monitoring/revenue-dashboard.json:/var/lib/grafana/dashboards/cloud/revenue.json:ro
      - ../datanika-cloud/monitoring/volume-dashboard.json:/var/lib/grafana/dashboards/cloud/volume.json:ro
      - ./monitoring/db-performance-dashboard.json:/var/lib/grafana/dashboards/infra/db-performance.json:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/infra/server-overview.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:latest
    container_name: datanika-node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Textfile collector — backup-offsite.sh writes datanika_backup.prom here
      - /opt/datanika/node_textfile:/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/textfile"
    restart: unless-stopped

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: datanika-cadvisor
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  dbt_projects:
  # Shared rw by app, app_b and celery — see #471. The load runs in the worker, so a
  # web-only path would fail at run time rather than upload time.
  uploaded_files:
  # Celery Beat's shelve DB. On a volume so `last_run_at` survives a deploy — without it
  # an interval entry restarts its hour on every recreate and may never fire (core#653).
  beat_state:
  pg_backups:
  prometheus_data:
  grafana_data:
