{{- if .Values.scheduler.enabled }}
# APScheduler — the user-facing cron dispatcher (core#648).
#
# This is the chart's exposure to the same defect production had. `app.replicaCount` is a
# supported knob here, and `datanika/datanika.py` used to arm a BackgroundScheduler at
# import — so scaling the app Deployment to N replicas gave N schedulers polling one
# Postgres jobstore. APScheduler 3.x claims due jobs with a plain SELECT (no FOR UPDATE, no
# lease, no owner column), so each one dispatched every due job: N duplicate pipeline runs,
# N duplicate writes into the user's warehouse.
#
# Distinct from `beat`, which fires our internal maintenance sweeps. This one fires the
# schedules the user creates in the UI, so a duplicate is visible in their data.
#
# Exactly one, enforced by the manifest rather than by convention — same reasoning as beat:
#   * `replicas` is hardcoded to 1 and is deliberately NOT a value.
#   * `strategy: Recreate` — a RollingUpdate overlaps old and new for the length of the
#     rollout, which is precisely the double-dispatch window.
#
# No PVC, unlike beat: APScheduler's jobstore is Postgres and these are cron triggers whose
# next fire time is absolute, so a restart recomputes the same instants. Nothing local to
# lose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datanika.fullname" . }}-scheduler
  labels:
    {{- include "datanika.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "datanika.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "datanika.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: {{ include "datanika.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            {{- toYaml .Values.scheduler.command | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "datanika.fullname" . }}-env
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
