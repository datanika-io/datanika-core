[project]
name = "datanika"
version = "0.1.0"
description = "Multi-tenant data pipeline management platform with dlt + dbt"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    # Data pipeline — pinned to tested versions; bump deliberately
    #
    # ⚠️ `clickhouse` is deliberately NOT in dlt's extras list (core#825). That
    # extra is `adlfs, clickhouse-connect, clickhouse-driver, gcsfs, pyarrow,
    # s3fs`, and the one that matters is **s3fs**. The two ClickHouse drivers
    # are declared directly below, so ClickHouse itself is unaffected; what is
    # lost is `s3://` bucket URLs on the file source (`gs://` and `az://` still
    # work — `gcsfs` and `adlfs` survive via other extras).
    #
    # 🔑 s3fs is excluded by TWO DIFFERENT constraints, one on each side of a
    # gap with no release in it. Both measured with `uv lock` against this
    # exact tree; do not re-derive from either half alone, because each looks
    # like the whole story and each points at the wrong package.
    #
    #   s3fs <= 2025.12.0 -> `aiobotocore<3.0.0` -> botocore ~1.41, but
    #     `redshift-connector>=2.1.14` (the CVE-2026-8838 RCE fix) floors
    #     `boto3>=1.42.22`.                          Blocker: aiobotocore.
    #   s3fs >= 2026.1.0  -> `fsspec>=2026.1` -> `gcsfs` ->
    #     `google-cloud-storage>=3.7.0`, but EVERY dbt-bigquery through 1.12.0
    #     declares `google-cloud-storage>=2.4,<3.2`.
    #                                     Blocker: google-cloud-storage.
    #
    # ⚠️ The FIRST blocker is already dissolving upstream and is NOT the one to
    # watch: `aiobotocore 3.0.0` (2025-12-10) crossed into botocore 1.42, and
    # `s3fs 2026.1.0` (2026-01-09) raised its ceiling to `aiobotocore<4.0.0`.
    # `aiobotocore 3.9.0` + `redshift-connector 2.1.16` resolve together in
    # this tree today — verified. So the live blocker is the SECOND one, and it
    # is a BigQuery/S3 collision inside Google's own client libraries that has
    # nothing to do with security or with dbt-core.
    #
    # See BLOCKED_BY_S3FS_CONFLICT in
    # tests/test_security/test_dependency_advisories.py for the mechanical
    # re-check trigger. This is a deferral with a condition, not a trade.
    "dlt[postgres,snowflake,bigquery,mssql,duckdb,databricks,synapse]>=1.21,<2",
    # dbt-core 1.7 -> 1.11 (core#825). The 1.7 pin was the single line blocking
    # six packages' CRITICAL/HIGH advisories, including `cryptography` (the
    # library `EncryptionService` uses on customer warehouse credentials) and
    # the redshift-connector RCE. Adapters take floors rather than a shared
    # ceiling because dbt 1.8 split the adapter interface out into
    # `dbt-adapters` and the adapters now version independently of dbt-core:
    # at the time of writing dbt-postgres is 1.11.x while dbt-snowflake and
    # dbt-bigquery are 1.12.x.
    "dbt-core>=1.11,<1.12",
    "dbt-postgres>=1.11,<2",
    "dbt-snowflake>=1.11,<2",
    "dbt-bigquery>=1.11,<2",
    "dbt-redshift>=1.11,<2",
    "dbt-sqlserver>=1.11,<2",
    "dbt-clickhouse>=1.9,<2",
    "dbt-duckdb>=1.11,<2",
    # 🚨 `dbt-mysql` is GONE and is not coming back (core#825, founder decision
    # 2026-08-31). Its last release is 1.7.0, published 2024-04-26 from a
    # personal repository (github.com/dbeatty10/dbt-mysql), and it declares
    # `dbt-core~=1.7.0`. A PyPI-index sweep for a successor found exactly two
    # distributions targeting MySQL itself and both are abandoned; the other
    # ten matches target different databases that merely speak the MySQL wire
    # protocol. So this one abandoned package held every advisory above.
    #
    # ⚠️ MySQL is UNAFFECTED as an extract SOURCE — that path goes through
    # SQLAlchemy/`pymysql` and never through dbt. Only `dbt run` against a
    # MySQL warehouse is gone. Verified by moving real rows through a real
    # MySQL 8.4 server in
    # tests/test_services/test_mysql_after_dbt_mysql_removal.py.
    #
    # 🚨 Do NOT extend that sentence to "and as a load destination", which is
    # what core#825 and an earlier draft of this comment both said. MySQL is
    # advertised in `SUPPORTED_DESTINATION_TYPES` but `dlt.destinations` has no
    # `mysql` attribute at all, so every load has always raised AttributeError
    # (core#865). Pre-existing, confirmed against the pre-change image, and
    # found only because the claim was tested against a real server instead of
    # against the set that asserts it.
    #
    # dbt-databricks requires sqlalchemy<2.0, incompatible with our stack
    # dbt-synapse requires sqlalchemy<2.0, incompatible with our stack
    # Both platforms work as dlt destinations — dbt transforms deferred until adapter compat
    # SaaS source dependencies (optional — needed only for dlt verified sources,
    # REST API fallback works without these)
    # "stripe>=5.0",
    # "simple-salesforce>=1.12",
    # "pyairtable>=2.0",
    # "facebook-business>=19.0",
    # "google-analytics-data>=0.18",
    # "google-ads>=24.0",
    # "confluent-kafka>=2.3",
    # Kafka. `kafka-python` rather than the commented-out `confluent-kafka`
    # above: it is pure Python (no C toolchain in the image), and it is already
    # what the nightly connector smoke installs to reach the Redpanda sandbox,
    # so it is the client we have actual evidence works against a real broker.
    # Until now nothing kafka shipped at all and the builder imported a dlt
    # verified source that has never been installed here (core#551).
    "kafka-python>=3.0,<4",
    # Google Sheets
    "gspread>=6.0,<7",
    "google-auth>=2.0,<3",
    # SQL drivers
    "pymysql>=1.1,<2",
    "pymssql>=2.2,<3",
    "pymongo>=4.0,<5",
    "clickhouse-connect>=0.11,<0.12",
    # Declared directly since core#825 dropped dlt's `clickhouse` extra, which
    # is where this used to come from. It also arrives via `dbt-clickhouse`
    # today — which is exactly why it needs its own line: a dependency that
    # exists only as a side effect of an adapter we might later drop is not a
    # dependency, it is a coincidence. Same reasoning as `duckdb-engine` below.
    "clickhouse-driver>=0.2.10,<0.3",
    "duckdb>=1.0,<2",
    # The SQLAlchemy dialect for DuckDB. dlt writes through its own driver, so
    # loads worked without this — but catalog introspection goes through
    # SQLAlchemy and raised NoSuchModuleError, leaving Models/Catalog
    # permanently empty for every DuckDB user (core#494).
    #
    # ⚠️ core#494's own comment here claimed "every other destination already
    # pairs a driver with its dialect; duckdb was the one that did not." That
    # was FALSE when written, and the sweep stopping at one instance is why
    # core#845 survived four more months. Redshift had the same hole, and
    # `redshift-connector` being in the lock (pulled by `dbt-redshift`) makes
    # the tree LOOK complete — the driver is installed, so a manifest read is
    # clean. It registers no dialect. The check that tells them apart is
    # `make_url(f"{drivername}://").get_dialect()`, and it now runs over every
    # entry: tests/test_services/test_supported_sets_resolve.py.
    "duckdb-engine>=0.17,<0.18",
    # The SQLAlchemy dialect for Redshift (core#845). Without it every
    # `sql_database()` source over a Redshift connection raised
    # NoSuchModuleError at `create_engine`, before any network call — so
    # Redshift-as-a-source had never worked at all, and catalog introspection
    # with it. The dbt direction was unaffected, which is why nothing surfaced.
    "sqlalchemy-redshift>=1.0,<2",
    "snowflake-sqlalchemy>=1.7,<2",
    "sqlalchemy-bigquery>=1.11,<2",
    "oracledb>=4.0,<5",
    # Web framework
    "reflex>=0.8.26,<0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.14,<2",
    # Auth
    "passlib[bcrypt]>=1.7,<2",
    "python-jose[cryptography]>=3.3,<4",
    # Task queue & scheduling
    "celery[redis]>=5.4,<6",
    "redis>=6.0,<7",
    "apscheduler>=3.10,<4",
    # Config & utilities
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    # ✅ UNBLOCKED in core#825. This was stuck at 45.x for as long as the dbt
    # 1.7 pin stood, inside four CRITICAL/HIGH advisories — CVE-2026-26007
    # (46.0.5), GHSA-537c-gmf6-5ccf vulnerable bundled OpenSSL (48.0.1),
    # CVE-2026-69249 (49.0.0), CVE-2026-69247 PKCS#7 Bleichenbacher oracle
    # (50.0.0) — on the library `EncryptionService` uses to encrypt customer
    # warehouse credentials.
    #
    # 🔑 The block was through `cffi`, and it was TWO links, not one. Every
    # cryptography >=46.0.1 needs `cffi>=2.0.0`; `dbt-core 1.7.19` declared
    # `cffi<2.0.0` — and so, independently, did every
    # `snowflake-connector-python` 3.x. Since `dbt-snowflake` only admits the
    # scp 4.x line from 1.10.6 (which needs dbt-core >=1.10), moving dbt to 1.8
    # alone would NOT have freed this, and the resolver error would have named
    # `cffi` both times and looked identical. Recorded because that is a day
    # someone else would otherwise lose.
    "cryptography>=50.0,<51",
    # Monitoring
    "prometheus-client>=0.21,<0.26",
    "python3-saml>=1.16,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<0.16",
    "httpx>=0.28,<0.29",
    # Floor raised from >=1.0.0 (core#602, 2026-08-30). The ceiling is what
    # stops 2.x; the floor is what decides *which* 1.x, and >=1.0.0 decided
    # nothing. See datanika-mcp/pyproject.toml for the full rationale — that
    # copy is the one that reaches PyPI consumers.
    "mcp>=1.29.1,<2",
    # Used by tests/test_mcp/test_registry_manifests.py to parse smithery.yaml.
    # Previously relied on as an undeclared transitive dep, which let those
    # manifest-drift guards skip themselves if it ever went missing (core#407 sweep).
    "pyyaml>=6.0,<7",
    # Round-trip migration test auto-provisions Postgres via Docker.
    # Skipped gracefully if Docker is unavailable (see tests/test_migrations/test_roundtrip.py).
    "testcontainers[postgres]>=4.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Security floors for packages we do not declare directly (core#819).
#
# `image-cve` scanned the image the deploy builds and found 61 fixed-available
# CRITICAL/HIGH findings. Almost all of them are transitive — reached via dlt,
# dbt, reflex, snowflake-connector-python — so there is no direct pin to raise.
# A constraint is the right tool: it binds the resolver without declaring a
# dependency we do not ourselves import, and unlike `uv lock --upgrade-package`
# it is a *durable* statement, so the next unrelated re-lock cannot roll it back.
#
# Each floor is the HIGHEST fix version across every CRITICAL/HIGH advisory
# affecting the version we were shipping — not the first one the scanner named.
# Several of these are chains where the later record is a bypass of the earlier
# fix; GitPython is nine deep. `tests/test_security/test_dependency_advisories.py`
# carries the per-CVE justification and fails if the lock drops below any of them.
#
# ✅ The six that used to be listed here as unfixable are FIXED (core#825). All
# six were held down by one line, `dbt-core>=1.7.19,<1.8`, which was in turn
# held down by one abandoned package, `dbt-mysql` (last release 2024-04-26).
# Dropping it moved dbt to 1.11 and cleared, in one resolve:
#
#   redshift-connector  CVE-2026-8838 CRITICAL RCE  2.0.917 -> floor 2.1.14
#   cryptography        4 HIGH                      45.0.7  -> floor 50.0.0
#   sqlparse            3 HIGH                      0.5.4   -> floor 0.6.0
#   urllib3             4 HIGH                      1.26.20 -> floor 2.7.0
#   pyopenssl           CVE-2026-27459              25.3.0  -> floor 26.0.0
#   protobuf            CVE-2026-0994               4.25.8  -> floor 5.29.6
#
# ⚠️ Three of those needed no floor at all — `pyopenssl`, `urllib3` and
# `protobuf` were delivered by the resolver the moment the dbt pin moved. They
# are floored anyway, because a version the resolver happens to pick today is
# not a version a future re-lock is obliged to keep. The whole reason this
# block exists is that a constraint is durable where an `--upgrade-package` is
# not.
#
# 🚨 `protobuf` 4.x -> 6.x is FORCED, not chosen. Every dbt-core at or above
# 1.9.9 requires `protobuf>=6.0`, and `cryptography` needs dbt-core >=1.10, so
# the only way to stay on protobuf 5.x is to leave the credential-encryption
# library on four HIGH advisories. Founder-accepted 2026-08-31. We import
# protobuf nowhere ourselves; the exposure is entirely "do our dependencies
# tolerate 6.x", and at dbt 1.11 the resolver says they do.
#
# Each entry carries a CEILING as well as a floor, for the reason
# `test_dependency_pins.py` already states about declared dependencies: an
# unbounded spec makes a major bump something that happens on whichever day a
# maintainer cuts a release. Without the ceilings this list floated pyarrow
# 23.0.0 -> 25.0.1 (two majors, on dlt's parquet path) as a side effect of
# fixing a use-after-free that 23.0.1 already fixes. A security change should
# move the minimum needed to clear the advisory and no further, so that when
# something breaks the bisect is short.
#
# lxml is the one place a MAJOR is unavoidable: CVE-2026-41066 has no 5.x fix.
constraint-dependencies = [
    "aiohttp>=3.14.3,<4",
    "gitpython>=3.1.58,<4",
    "granian>=2.7.4,<3",
    "lxml>=6.1.0,<7",
    "mako>=1.3.12,<2",
    "msgpack>=1.2.1,<2",
    "pyasn1>=0.6.4,<0.7",
    "pyjwt>=2.13.0,<3",
    "pyarrow>=23.0.1,<24",
    "python-engineio>=4.13.2,<5",
    "python-multipart>=0.0.30,<0.1",
    "python-socketio>=5.16.2,<6",
    "soupsieve>=2.8.4,<3",
    # ---- Unblocked by the dbt 1.11 move (core#825) ----------------------
    # ⚠️ `protobuf` and `urllib3` take a MAJOR ceiling rather than the usual
    # next-major one, because for both of them the fix IS the major: urllib3's
    # 1.x line is EOL with no patch-level escape, and protobuf 6 is what
    # dbt-core >=1.9.9 requires. The ceiling still bounds the next one.
    "protobuf>=5.29.6,<7",
    "pyopenssl>=26.0.0,<27",
    "redshift-connector>=2.1.14,<3",
    "sqlparse>=0.6.0,<0.7",
    "urllib3>=2.7.0,<3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# "S" is flake8-bandit — the SAST half of core#723. It is enabled here, in the
# SAME change that fixes what it found, so the gating `lint` job never goes red
# on `dev`. Do not land the select without the fixes.
#
# It earns its CI minutes in this codebase specifically: we encrypt and decrypt
# customer warehouse credentials, and the expensive mistakes in that area —
# `subprocess(shell=True)` on a variable, a hardcoded fallback key, a broadened
# `except` around a crypto call — are all cheap for bandit to catch and easy to
# write.
#
# ⚠️ The first run found 23 findings in application code, not the ~11 the issue
# estimated. Seven were `try`/`except`/`pass`, four of those on the session and
# audit path, and they were the real ones: each swallow was correct and each was
# silent, so an audit trail could stop recording with no signal anywhere. Those
# are fixed rather than ignored. The rest are name-based false positives
# (a URL assigned to `*_TOKEN_URL`, an HTML template named `_PASSWORD_RESET_*`)
# and carry an inline `# noqa` with the reason, so a genuine hardcoded secret in
# the same file is still caught.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# ⚠️ CI lints with `--exclude datanika/migrations` while the pre-push hook does
# not, so before this the two gates saw different file sets. Putting the
# migration exemption HERE means both read the same rules, which is the only way
# a local green predicts a CI green.
#
# Migrations are S608 by construction: `op.execute()` takes SQL text, and the
# interpolated values are literals in the migration's own source. There is no
# request path into them and no user input to sanitise.
"datanika/migrations/**" = ["S608"]

# Tests: 5,558 findings, of which 5,558 are noise. `assert` IS the test (S101);
# fixture credentials are fixtures (S105/S106/S107); the harnesses that shell out
# to `uv`, `docker` and `alembic` are the point of those tests (S603/S607); and
# a bound-to-all-interfaces address in a testcontainer is not a production
# listener (S104). Left as an explicit list rather than a blanket `"S"` so that,
# for example, S301 (pickle) or S324 (weak hash) in a test still fails.
"tests/**" = ["S101", "S104", "S105", "S106", "S107", "S108", "S603", "S607", "S608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
