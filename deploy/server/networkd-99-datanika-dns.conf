# Managed by Datanika Infra — core#598 item A. Founder-authorized 2026-08-29.
#
# Drops the provider resolver 62.217.126.164 from eth0. It is DEAD, not merely slow:
# 10/10 DNS queries time out (example.com, name-servers.gr, everything) while it still
# answers ICMP at ~6.7% loss. systemd-resolved kept it in rotation and paid a full
# timeout each time it selected it -- 7.9-9.5s per lookup, over the blackbox probe
# timeout, producing false "app.datanika.io is down" pages. Cold-cache lookups measured
# 5.1s (github.com) and 20.1s (api.paddle.com, the billing API).
#
# 8.8.8.8 and 1.1.1.1 both measured 0% loss and resolve the provider's own PUBLIC zone
# (name-servers.gr, s538673.name-servers.gr, pointer.gr, mail.name-servers.gr), so
# nothing is lost. The founder's Amnezia VPN is unaffected by design -- it runs its own
# unbound with hardcoded DoT upstreams (1.1.1.1@853). The webdav vhost does no lookups.
#
# WHY A NETWORKD DROP-IN AND NOT NETPLAN: a /etc/netplan/99-*.yaml drop-in does NOT work.
# Netplan UNIONS nameservers.addresses rather than replacing, so the generated unit still
# carried all three servers (verified 2026-08-29). systemd list options accumulate too --
# hence the empty `DNS=` below, which RESETS the list before it is set.
#
# Rollback: rm -rf /etc/systemd/network/10-netplan-eth0.network.d && networkctl reload
# Canonical copy: plans/infra/scripts/networkd-99-datanika-dns.conf
[Network]
DNS=
DNS=8.8.8.8
DNS=1.1.1.1
