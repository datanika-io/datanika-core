name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps

      - name: Ruff check
        run: ruff check datanika tests --exclude "datanika/migrations"

      - name: Ruff format check
        run: ruff format --check datanika tests --exclude "datanika/i18n"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps

      - name: Run tests
        run: pytest tests/ --tb=short -q

  # Alembic migration round-trip test (PLAN_QA.md P1). Spins up a blank
  # Postgres, runs `upgrade head → downgrade -1 → upgrade head`, asserts
  # the schema round-trips cleanly. Catches migrations whose downgrade()
  # is broken — which only matters at 2 AM during a prod rollback.
  # Kept as a separate job so test failures on main suite don't mask it
  # (and vice-versa). DATABASE_URL_SYNC_TEST points at the service container.
  # Also runs the t1-window guard (core#449): the deployed release's models are
  # read out of git and checked against the migrated schema, which is why this
  # job needs origin/master fetched rather than a shallow PR-only checkout.
  migration-roundtrip:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps

      - name: Fetch the deployed release
        # The t1 guard compares against what production runs, so master must be
        # present. actions/checkout gives a shallow PR-only tree by default.
        run: git fetch --no-tags --depth=1 origin master

      - name: Run round-trip + t1-window tests
        env:
          DATABASE_URL_SYNC_TEST: postgresql://test:test@localhost:5432/test
        run: |
          pytest tests/test_migrations/test_roundtrip.py \
                 tests/test_migrations/test_expand_contract.py -v --tb=long

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Helm lint
        run: helm lint deploy/helm/datanika

      - name: Helm template (dry-run render)
        run: helm template test-release deploy/helm/datanika > /dev/null

  # Prod deploy is handled by .github/workflows/deploy-pointer.yml (build-from-source
  # to pointer.gr on push:master). The old GHCR-pull-to-Hetzner deploy job was
  # removed 2026-07-17 — the Hetzner box is gone and GHCR is inaccessible from the box.

  deploy-staging:
    needs: [lint, test, helm-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout core (dev)
        uses: actions/checkout@v6
        with:
          path: datanika

      - name: Checkout cloud (dev)
        uses: actions/checkout@v6
        with:
          repository: datanika-io/datanika-cloud
          ref: dev
          token: ${{ secrets.CLOUD_REPO_TOKEN }}
          path: datanika-cloud

      - name: Build source tarball
        run: |
          tar czf /tmp/staging-src.tgz --exclude-vcs --exclude='*/.venv' \
            --exclude='datanika/.web' --exclude='*/node_modules' --exclude='*/__pycache__' \
            --exclude='datanika/.env' --exclude='datanika/.env.docker' \
            datanika datanika-cloud

      - name: Configure SSH to pointer.gr
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.POINTER_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.POINTER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # The image build compiles lxml/xmlsec from source and emits nothing for
          # ~5-8 min; without a keepalive the SSH session is torn down mid-build and the
          # step dies with `client_loop: send disconnect: Broken pipe` (exit 255).
          # Same fix already applied to deploy-pointer.yml — this job had the identical
          # pattern and was missed when that one was fixed.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 120\n  TCPKeepAlive yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Transfer dev source + build :staging image
        run: |
          cat /tmp/staging-src.tgz | ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'rm -rf /opt/datanika-staging-src && mkdir -p /opt/datanika-staging-src && cd /opt/datanika-staging-src && tar xzf -'
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'cd /opt/datanika-staging-src && docker build -t ghcr.io/datanika-io/datanika-core:staging -f datanika/Dockerfile .'

      - name: Recreate staging stack on :staging
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'cd /opt/datanika-staging && set -a && . ./.env.docker && set +a && docker compose -p datanika-staging up -d postgres redis app celery'

      - name: Wait for staging health
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'for i in $(seq 1 40); do h=$(docker inspect --format "{{.State.Health.Status}}" $(/opt/datanika-staging/active-app.sh) 2>/dev/null); [ "$h" = healthy ] && { echo staging-healthy; exit 0; }; sleep 5; done; echo "staging NOT healthy"; docker logs --tail 40 $(/opt/datanika-staging/active-app.sh); exit 1'

  smoke-staging:
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps

      - name: Run smoke probes
        id: smoke
        env:
          DATANIKA_STAGING_CF_ACCESS_CLIENT_ID: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_ID }}
          DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET }}
        run: pytest scripts/smoke/ -v --tb=short

      - name: Telegram alert on failure
        if: failure()
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          SHORT_SHA=${COMMIT_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          TEXT=$(printf '\xf0\x9f\x9a\xa8 *Staging smoke failed*\n\n*Commit:* `%s`\n*Message:* %s\n*Run:* %s' \
            "$SHORT_SHA" "$FIRST_LINE" "$RUN_URL")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=Markdown"

  e2e-staging:
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Configure SSH for seed
        env:
          SSH_KEY: ${{ secrets.POINTER_SSH_KEY }}
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # Keepalive: long, output-silent remote steps otherwise drop the session with
          # `client_loop: send disconnect: Broken pipe` (exit 255). Applied to every SSH
          # setup in this file, not just the one that happened to fail.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 120\n  TCPKeepAlive yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Run E2E tests against staging
        working-directory: e2e
        env:
          CI: "true"
          DATANIKA_E2E_BASE_URL: https://staging-app.datanika.io
          DATANIKA_STAGING_CF_ACCESS_CLIENT_ID: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_ID }}
          DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET }}
          DATANIKA_E2E_SEED_CMD: >-
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new root@${{ secrets.POINTER_HOST }}
            'docker exec -e E2E_SEED_ALLOW_ANY_HOST=1 $(/opt/datanika-staging/active-app.sh) uv run python -m datanika.scripts.e2e_seed'
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      # Raw test-results fallback. The HTML report can fail to render when
      # the trace JSON is truncated (process killed mid-write, OOM, etc.) —
      # the raw traces + screenshots + videos survive that class of failure.
      - name: Upload raw test-results (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Telegram alert on failure
        if: failure()
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          SHORT_SHA=${COMMIT_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          TEXT=$(printf '\xf0\x9f\x9a\xa8 *Staging E2E failed*\n\n*Commit:* `%s`\n*Message:* %s\n*Run:* %s' \
            "$SHORT_SHA" "$FIRST_LINE" "$RUN_URL")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=Markdown"

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          gh issue create \
            --repo ${{ github.repository }} \
            --title "[QA] e2e-staging failure on $SHORT_SHA" \
            --body "**Run:** $RUN_URL
          **Commit:** \`$SHORT_SHA\`
          **Message:** $FIRST_LINE
          **Report:** playwright-report artifact on the run page" \
            --label "e2e-failure"

  # SSO E2E tests — runs 16 Playwright specs (OIDC + SAML + edge cases)
  # against the staging app with a disposable Authentik IdP on Hetzner.
  #
  # Topology: Authentik on Hetzner :9000 (same host as staging), SSH tunnel
  # to the CI runner so the Playwright browser can reach the IdP login form.
  # Bootstrap + seed run on Hetzner via SSH (they need docker exec).
  e2e-sso:
    needs: [deploy-staging]
    # Disabled 2026-07-17: the disposable Authentik SSO test-env lived on the dead
    # Hetzner box and hasn't been rebuilt on pointer.gr. Re-enable (and repoint the
    # HETZNER_HOST refs below to POINTER_HOST) once an SSO test env is stood up.
    if: false
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # Keepalive: long, output-silent remote steps otherwise drop the session with
          # `client_loop: send disconnect: Broken pipe` (exit 255). Applied to every SSH
          # setup in this file, not just the one that happened to fail.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 120\n  TCPKeepAlive yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Start Authentik on staging server
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          ssh root@$SSH_HOST "mkdir -p /opt/datanika/e2e-sso/scripts"
          scp e2e/docker-compose.test.yml root@$SSH_HOST:/opt/datanika/e2e-sso/
          scp e2e/scripts/bootstrap-authentik.sh root@$SSH_HOST:/opt/datanika/e2e-sso/scripts/
          scp e2e/scripts/seed-sso-configs.py root@$SSH_HOST:/opt/datanika/e2e-sso/scripts/

          # Start with project name 'e2e' so containers are e2e-authentik-{db,server}-1
          # (matches the docker exec names in bootstrap-authentik.sh)
          ssh root@$SSH_HOST "cd /opt/datanika/e2e-sso && docker compose -p e2e -f docker-compose.test.yml up -d"

          # Wait for Authentik to be healthy (~90s first boot with migrations)
          ssh root@$SSH_HOST 'for i in $(seq 1 30); do
            status=$(docker inspect --format="{{.State.Health.Status}}" e2e-authentik-server-1 2>/dev/null)
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 10
          done
          echo "Authentik failed to become healthy"
          docker logs e2e-authentik-server-1 --tail 50
          exit 1'

      - name: Bootstrap Authentik (OIDC + SAML providers)
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          ssh root@$SSH_HOST "cd /opt/datanika/e2e-sso && DATANIKA_E2E_BASE_URL=https://staging-app.datanika.io bash scripts/bootstrap-authentik.sh"

      - name: Bridge staging container to Authentik network
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          # Staging container needs to reach Authentik for OIDC token exchange.
          # Connect authentik-server to datanika-staging_default with an alias
          # so staging can resolve it by the chosen hostname.
          ssh root@$SSH_HOST "docker network connect --alias e2e-authentik-server datanika-staging_default e2e-authentik-server-1 2>&1" || \
            echo "Network connect failed or already connected"

          # Verify staging can reach Authentik by the alias
          ssh root@$SSH_HOST "docker exec \$(/opt/datanika-staging/active-app.sh) curl -sf --max-time 5 http://e2e-authentik-server:9000/-/health/ready/" && \
            echo "Staging → Authentik OK" || \
            { echo "FATAL: staging can't reach e2e-authentik-server:9000"; exit 1; }

          # Rewrite fixture URLs: localhost:9000 → e2e-authentik-server:9000
          # Same hostname resolves from:
          #   - Staging container: via docker DNS alias → Authentik container
          #   - CI runner: via /etc/hosts → 127.0.0.1 → SSH tunnel → Hetzner:9000
          #   - Authentik self-request: Host header matches, OIDC issuer consistent
          ssh root@$SSH_HOST "sed -i 's|http://localhost:9000|http://e2e-authentik-server:9000|g' /opt/datanika/e2e-sso/.sso-fixture.json"
          ssh root@$SSH_HOST "cat /opt/datanika/e2e-sso/.sso-fixture.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(\"Fixture URL:\", d[\"authentik_url\"])'"

      - name: Seed SSO configs in staging DB
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          ssh root@$SSH_HOST "docker cp /opt/datanika/e2e-sso/.sso-fixture.json \$(/opt/datanika-staging/active-app.sh):/app/e2e/.sso-fixture.json"
          ssh root@$SSH_HOST "docker exec \$(/opt/datanika-staging/active-app.sh) uv run python e2e/scripts/seed-sso-configs.py"

      - name: Open SSH tunnel to Authentik + hosts entry
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          # SSH tunnel: CI runner's localhost:9000 → Hetzner:9000 → Authentik
          ssh -f -N -L 9000:localhost:9000 root@$SSH_HOST

          # /etc/hosts: e2e-authentik-server → 127.0.0.1 (tunnel endpoint)
          # This matches the hostname in the fixture + SSO config, so Playwright
          # browser can resolve and reach Authentik via the tunnel.
          echo "127.0.0.1 e2e-authentik-server" | sudo tee -a /etc/hosts

          # Verify both paths
          for i in $(seq 1 10); do
            curl -sf http://localhost:9000/-/health/ready/ > /dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://e2e-authentik-server:9000/-/health/ready/ > /dev/null || {
            echo "e2e-authentik-server hostname not reachable via tunnel"
            exit 1
          }
          echo "Tunnel + hostname OK"

      - name: Diagnose DNS + CF Access from CI runner
        env:
          DATANIKA_STAGING_CF_ACCESS_CLIENT_ID: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_ID }}
          DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "=== DNS resolution ==="
          nslookup staging-app.datanika.io || true
          echo ""
          echo "=== curl without CF headers ==="
          curl -sI --max-time 10 https://staging-app.datanika.io/ 2>&1 | head -15 || true
          echo ""
          echo "=== curl with CF Access headers ==="
          curl -sI --max-time 10 \
            -H "CF-Access-Client-Id: $DATANIKA_STAGING_CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET" \
            https://staging-app.datanika.io/ 2>&1 | head -15 || true
          echo ""
          echo "=== curl SSO login route with CF headers ==="
          curl -sI --max-time 10 \
            -H "CF-Access-Client-Id: $DATANIKA_STAGING_CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET" \
            https://staging-app.datanika.io/api/auth/sso/login/e2e-fixture 2>&1 | head -15 || true
          echo ""
          echo "=== Authentik tunnel check (localhost + service name) ==="
          curl -sI --max-time 10 http://localhost:9000/-/health/ready/ 2>&1 | head -5 || true
          curl -sI --max-time 10 http://e2e-authentik-server:9000/-/health/ready/ 2>&1 | head -5 || true
          echo ""
          echo "=== Staging → Authentik reachability ==="
          ssh root@${{ secrets.HETZNER_HOST }} "docker exec \$(/opt/datanika-staging/active-app.sh) curl -sI --max-time 5 http://e2e-authentik-server:9000/-/health/ready/ 2>&1 | head -3" || true

      - name: Run SSO specs
        working-directory: e2e
        env:
          CI: "true"
          DATANIKA_E2E_SSO_AUTHENTIK: "1"
          DATANIKA_E2E_SLOW: "1"
          DATANIKA_E2E_SKIP_SEED: "1"
          DATANIKA_E2E_USER_EMAIL: "sso-user@datanika.test"
          DATANIKA_E2E_BASE_URL: https://staging-app.datanika.io
          DATANIKA_E2E_BACKEND_URL: https://staging-app.datanika.io
          DATANIKA_E2E_ORG_SLUG: e2e-fixture
          DATANIKA_E2E_SAML_ORG_SLUG: e2e-fixture-saml
          DATANIKA_STAGING_CF_ACCESS_CLIENT_ID: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_ID }}
          DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test sso-

      - name: Upload SSO Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sso-playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload SSO raw test-results (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sso-test-results
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup Authentik
        if: always()
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          # Disconnect authentik from staging network before teardown
          ssh root@$SSH_HOST "docker network disconnect datanika-staging_default e2e-authentik-server-1 2>/dev/null || true"
          ssh root@$SSH_HOST "cd /opt/datanika/e2e-sso && docker compose -p e2e -f docker-compose.test.yml down -v 2>/dev/null; rm -rf /opt/datanika/e2e-sso" || true

      - name: Telegram alert on failure
        if: failure()
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          SHORT_SHA=${COMMIT_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          TEXT=$(printf '\xf0\x9f\x9a\xa8 *SSO E2E failed*\n\n*Commit:* `%s`\n*Message:* %s\n*Run:* %s' \
            "$SHORT_SHA" "$FIRST_LINE" "$RUN_URL")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=Markdown"

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          gh issue create \
            --repo ${{ github.repository }} \
            --title "[QA] e2e-sso failure on $SHORT_SHA" \
            --body "**Run:** $RUN_URL
          **Commit:** \`$SHORT_SHA\`
          **Message:** $FIRST_LINE
          **Report:** playwright-report-sso artifact on the run page" \
            --label "e2e-failure"

  # Prod post-deploy smoke gates (smoke = URL gate, smoke-prod = pytest shape)
  # moved to .github/workflows/deploy-pointer.yml — they run after the prod deploy
  # there (needs: deploy), since prod deploy left ci.yml on 2026-07-17.
