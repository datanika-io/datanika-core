# Datanika STAGING stack — pointer.gr, isolated 2nd deployment.
# Run: cd /opt/datanika-staging && set -a && . ./.env.docker && set +a && \
#      docker compose -p datanika-staging up -d
# Reuses the prod-built image (ghcr.io/datanika-io/datanika-core:staging already on
# the box). Own container names / ports (3100/8100/5433/6380) / volumes — cannot
# collide with prod (which uses datanika-* names + 3000/8000/5432/6379).

services:
  postgres:
    image: postgres:16-alpine
    container_name: datanika-staging-postgres
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datanika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-datanika}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datanika-staging-redis
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?set in .env.docker}
    volumes:
      - staging_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ghcr.io/datanika-io/datanika-core:staging
    container_name: datanika-staging-app
    ports:
      - "127.0.0.1:3100:3000"
      - "127.0.0.1:8100:8000"
    env_file:
      - .env.docker
    environment:
      # core#785 — see the full note on `app` in the prod docker-compose.yml.
      # `uv run` re-syncs the venv from uv.lock at container start, and the grafted
      # `datanika-cloud` / `datanika-mcp` packages are not in the lock. Staging must
      # carry it too, or staging stops being a rehearsal of prod in exactly the
      # dimension this pins.
      UV_NO_SYNC: "1"
      FILE_UPLOADS_DIR: /app/uploaded_files
      GRANIAN_WORKERS: "2"
      # See docker-compose.yml: Reflex reads REFLEX_REDIS_URL, not REDIS_URL. Without
      # it each worker keeps its own session store and a reconnect served by the other
      # one loses the session (#646). This is why golden-path.spec.ts was 3-of-6 here:
      # `gotoReady` does a full page.goto per step, so every step re-rolls the dice.
      REFLEX_REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.docker - Reflex needs it as REFLEX_REDIS_URL (#646)}
      # core#895 — app metrics MUST aggregate across granian's workers. Staging runs
      # GRANIAN_WORKERS: "2", so a scrape was answered by one of two per-process
      # prometheus_client registries. Measured on staging 2026-09-12, six scrapes:
      # 2, 1, 2, 1, 1, 2 — a counter that DECREASES, which is impossible, and is the
      # signature of this defect rather than of load. Prod carries the same two lines.
      #
      # ⚠️ This must be an ENVIRONMENT variable, not something the app sets:
      # prometheus_client chooses its value class when it is IMPORTED, so a value set
      # in code is already too late.
      #
      # ⚠️ tmpfs, not a named volume, and that is load-bearing. Each process writes a
      # .db file named by pid; a persistent directory accumulates files from dead
      # workers of previous container generations, and MultiProcessCollector sums
      # whatever it finds — so yesterday's counters would be added to today's. tmpfs
      # is empty on every container start.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      REFLEX_MOUNT_FRONTEND_COMPILED_APP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    tmpfs:
      # See PROMETHEUS_MULTIPROC_DIR above — fresh per container start by design (core#895).
      - /tmp/prometheus_multiproc
    volumes:
      - staging_dbt:/app/dbt_projects
      - staging_uploads:/app/uploaded_files
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run reflex run --env prod --backend-host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # --- blue/green partner (A3) ---
  # Same image and env as `app`, different container name and host ports. Behind a
  # profile so `up -d` never starts it; deploy-bluegreen.sh brings it up for a swap,
  # waits for its healthcheck, repoints Apache, then stops the other one.
  app_b:
    profiles: ["bluegreen"]
    image: ghcr.io/datanika-io/datanika-core:staging
    container_name: datanika-staging-app-b
    ports:
      - "127.0.0.1:3110:3000"
      - "127.0.0.1:8110:8000"
    env_file:
      - .env.docker
    environment:
      # core#785 — see the full note on `app` in the prod docker-compose.yml.
      # `uv run` re-syncs the venv from uv.lock at container start, and the grafted
      # `datanika-cloud` / `datanika-mcp` packages are not in the lock. Staging must
      # carry it too, or staging stops being a rehearsal of prod in exactly the
      # dimension this pins.
      UV_NO_SYNC: "1"
      FILE_UPLOADS_DIR: /app/uploaded_files
      GRANIAN_WORKERS: "2"
      # See docker-compose.yml: Reflex reads REFLEX_REDIS_URL, not REDIS_URL. Without
      # it each worker keeps its own session store and a reconnect served by the other
      # one loses the session (#646). This is why golden-path.spec.ts was 3-of-6 here:
      # `gotoReady` does a full page.goto per step, so every step re-rolls the dice.
      REFLEX_REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.docker - Reflex needs it as REFLEX_REDIS_URL (#646)}
      # core#895 — app metrics MUST aggregate across granian's workers. Staging runs
      # GRANIAN_WORKERS: "2", so a scrape was answered by one of two per-process
      # prometheus_client registries. Measured on staging 2026-09-12, six scrapes:
      # 2, 1, 2, 1, 1, 2 — a counter that DECREASES, which is impossible, and is the
      # signature of this defect rather than of load. Prod carries the same two lines.
      #
      # ⚠️ This must be an ENVIRONMENT variable, not something the app sets:
      # prometheus_client chooses its value class when it is IMPORTED, so a value set
      # in code is already too late.
      #
      # ⚠️ tmpfs, not a named volume, and that is load-bearing. Each process writes a
      # .db file named by pid; a persistent directory accumulates files from dead
      # workers of previous container generations, and MultiProcessCollector sums
      # whatever it finds — so yesterday's counters would be added to today's. tmpfs
      # is empty on every container start.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      REFLEX_MOUNT_FRONTEND_COMPILED_APP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    tmpfs:
      # See PROMETHEUS_MULTIPROC_DIR above — fresh per container start by design (core#895).
      - /tmp/prometheus_multiproc
    volumes:
      - staging_dbt:/app/dbt_projects
      - staging_uploads:/app/uploaded_files
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run reflex run --env prod --backend-host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  celery:
    image: ghcr.io/datanika-io/datanika-core:staging
    container_name: datanika-staging-celery
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # core#785 — see the prod docker-compose.yml. The metering and quota hooks
      # all fire in the worker process (core#772), so this is where a silently
      # pruned `datanika_cloud` would cost the most and show the least.
      UV_NO_SYNC: "1"
      FILE_UPLOADS_DIR: /app/uploaded_files
    volumes:
      - staging_dbt:/app/dbt_projects
      - staging_uploads:/app/uploaded_files
    # `-E` publishes task-lifecycle events for the celery-exporter (core#704). See the
    # prod `docker-compose.yml` for why this is not optional: without it the exporter
    # still reports `celery_worker_up` and reads healthy while emitting no task metrics
    # at all. Staging carries it so the exporter can be exercised here first.
    command: uv run celery -A datanika.tasks.celery_app:celery_app worker -l info -E
    restart: unless-stopped

  # Celery exporter (core#704). Mirrors the prod service — see docker-compose.yml for the
  # version-pinning and `--purge-offline-worker-metrics=0` rationale. Staging is not
  # scraped by the prod Prometheus (different docker network, no published route), so
  # this exists to make the exporter's behaviour testable on a real worker before a
  # prod deploy rather than reasoned about afterwards.
  celery-exporter:
    image: danihodovic/celery-exporter:0.12.2
    container_name: datanika-staging-celery-exporter
    environment:
      CE_BROKER_URL: ${REDIS_URL:?REDIS_URL must be set in the staging .env.docker}
    command:
      - "--purge-offline-worker-metrics=0"
    ports:
      - "127.0.0.1:9818:9808"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat (core#653). Mirrors the prod service — see docker-compose.yml for the
  # full rationale (own container rather than `worker -B`, and why `beat_state` is
  # load-bearing). Staging carries it so "exactly one beat across a swap" can be
  # *demonstrated* here rather than reasoned about in a prod deploy, which is core#653's
  # own acceptance criterion 2.
  beat:
    image: ghcr.io/datanika-io/datanika-core:staging
    container_name: datanika-staging-beat
    env_file:
      - .env.docker
    environment:
      # core#785 — see the prod docker-compose.yml.
      UV_NO_SYNC: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staging_beat_state:/app/beat_state
    command: >
      uv run celery -A datanika.tasks.celery_app:celery_app beat -l info
      --schedule /app/beat_state/celerybeat-schedule
    restart: unless-stopped

  # core#648 — SINGLETON, see the long note in the prod docker-compose.yml.
  # Staging runs GRANIAN_WORKERS: "2", so it had the same defect at 3x rather than 5x.
  scheduler:
    image: ghcr.io/datanika-io/datanika-core:staging
    container_name: datanika-staging-scheduler
    env_file:
      - .env.docker
    environment:
      # core#785 — see the prod docker-compose.yml.
      UV_NO_SYNC: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run python -m datanika.scheduler_main
    restart: unless-stopped

volumes:
  staging_pgdata:
  staging_redisdata:
  staging_dbt:
  staging_uploads:
  staging_beat_state:
