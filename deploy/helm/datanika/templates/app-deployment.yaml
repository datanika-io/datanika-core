apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datanika.fullname" . }}-app
  labels:
    {{- include "datanika.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "datanika.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "datanika.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      serviceAccountName: {{ include "datanika.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            {{- toYaml .Values.app.command | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "datanika.fullname" . }}-env
          ports:
            - name: http-frontend
              containerPort: 3000
            - name: http-backend
              containerPort: 8000
          readinessProbe:
            {{- toYaml .Values.app.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.app.probes.liveness | nindent 12 }}
          volumeMounts:
            - name: dbt-projects
              mountPath: /app/dbt_projects
            # Must match the celery deployment exactly. This tier writes the
            # upload archive; the worker reads it back (core#529).
            - name: uploaded-files
              mountPath: /app/uploaded_files
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      volumes:
        - name: dbt-projects
          persistentVolumeClaim:
            claimName: {{ include "datanika.fullname" . }}-dbt-projects
        - name: uploaded-files
          persistentVolumeClaim:
            claimName: {{ include "datanika.fullname" . }}-uploaded-files
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
