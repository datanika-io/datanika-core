apiVersion: 1

groups:
  - orgId: 1
    name: Infrastructure Alerts
    folder: Datanika
    interval: 30s
    rules:
      # --- Container Health ---
      - uid: container-down
        title: Container Down
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Excludes the app pair on purpose — see "App Container Down" below.
              # Under blue/green exactly ONE of datanika-app / datanika-app-b is running,
              # so a per-container staleness check pages for the colour we deliberately
              # retired. Confirmed live during the first prod swap: this rule fired for
              # `datanika-app` while prod served correctly from `datanika-app-b`.
              expr: 'time() - max by (name) (container_last_seen{name=~"datanika-(celery|postgres|redis)"}) > 60'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container {{ $labels.name }} has not been seen for over 60 seconds."

      # --- App container (blue/green aware) ---
      # The app runs as one of a PAIR: datanika-app (blue) or datanika-app-b (green).
      # Exactly one is up at a time, and a swap deliberately stops the other, so a
      # per-container check is wrong by construction — it pages for the retired colour.
      #
      # `max()` over the pair collapses them: the value is the most recent sighting of
      # EITHER colour, so this fires only when *neither* is alive, which is the actual
      # outage. During the first prod swap the old per-container rule fired for
      # `datanika-app` while prod served perfectly from `datanika-app-b`.
      - uid: app-container-down
        title: App Container Down
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'time() - max(container_last_seen{name=~"datanika-app(-b)?"}) > 60'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "No app container is running (neither blue nor green)"
          description: "Neither datanika-app nor datanika-app-b has been seen for over 60 seconds. During a blue/green swap exactly one is expected to be down; this fires only when both are."

      # --- High CPU ---
      - uid: high-cpu
        title: High CPU Usage
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage: {{ $value }}%"
          description: "CPU usage has been above 85% for 5 minutes."

      # --- High Memory ---
      - uid: high-memory
        title: High Memory Usage
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage: {{ $value }}%"
          description: "Memory usage has been above 90% for 5 minutes."

      # --- Disk Space ---
      - uid: disk-space-critical
        title: Disk Space Critical
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '(1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage above 80%: {{ $value }}%"
          description: "Root filesystem is running low on space."

      # --- Backup Stale ---
      # Fires when the nightly off-site pg_dump has not succeeded in over 26h
      # (metric written by scripts/backup-offsite.sh via node-exporter textfile).
      - uid: backup-stale
        title: Backup Stale
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'time() - datanika_backup_last_success_timestamp_seconds > 93600'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Off-site backup is stale (last success over 26h ago)"
          description: "The nightly pg_dump off-site backup to Aweb has not succeeded in more than 26 hours. Check /var/log/datanika-backup.log on the pointer.gr box."

      # --- Container Restart Loop ---
      - uid: container-restart-loop
        title: Container Restart Loop
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'increase(container_start_time_seconds{name=~"datanika-.*"}[1h]) > 3'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is restart-looping"
          description: "Container {{ $labels.name }} has restarted more than 3 times in the last hour."

      # --- Container High Memory ---
      - uid: container-high-memory
        title: Container High Memory
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'container_memory_usage_bytes{name=~"datanika-(app|celery)"} > 1.5e+9'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory over 1.5GB"
          description: "Container {{ $labels.name }} is using more than 1.5GB of memory."

  - orgId: 1
    name: Application Alerts
    folder: Datanika
    interval: 30s
    rules:
      # --- App Health Endpoint ---
      - uid: app-unhealthy
        title: App Unhealthy
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Blue/green: two scrape jobs, exactly ONE of which is expected to be up.
              # `up{job="datanika-app"} == 0` fired continuously whenever GREEN served,
              # because the compose name `app` did not resolve — re-notifying hourly
              # while the site was fine (#479). max() collapses the pair, so this fires
              # only when NEITHER colour is scrapeable, which is the real outage.
              expr: 'max(up{job=~"datanika-app(-b)?"}) == 0'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Datanika app metrics endpoint is down"
          description: "Prometheus cannot scrape the app metrics endpoint for 2 minutes."

      # --- Celery Task Failures ---
      - uid: celery-task-failures
        title: High Celery Task Failure Rate
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'rate(celery_tasks_total{state="FAILURE"}[15m]) > 0.1'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Celery task failure rate"
          description: "More than 0.1 task failures per second over the last 15 minutes."

      # --- Celery Queue Depth ---
      - uid: celery-queue-depth
        title: Celery Queue Backlog
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'celery_queue_length > 50'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue backlog: {{ $value }} tasks"
          description: "Celery queue has had more than 50 pending tasks for 10 minutes."

  - orgId: 1
    name: External Probes
    folder: Datanika
    interval: 30s
    rules:
      # --- Sitemap health (SEO-critical) ---
      - uid: sitemap-down
        title: Sitemap Unreachable
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'probe_success{instance="https://datanika.io/sitemap-index.xml"} == 0'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "datanika.io sitemap-index.xml is unreachable"
          description: "Blackbox probe to https://datanika.io/sitemap-index.xml has failed for 15 minutes. Search engines cannot recrawl. Check Aweb, Nginx, and the landing deploy workflow."

      # --- Landing site reachability ---
      - uid: landing-down
        title: Landing Site Down
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'probe_success{instance="https://datanika.io/"} == 0'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "datanika.io landing site is down"
          description: "Blackbox probe to https://datanika.io/ has failed for 5 minutes."

      # --- Plausible analytics reachability (added 2026-07-17, landing#225) ---
      # Uses raw probe_success + threshold lt 1 (fires when probe_success=0). The
      # older probe alerts above use `== 0` + `gt 0` which doesn't fire on the
      # down-case — flagged as a monitoring follow-up.
      - uid: plausible-down
        title: Plausible Down
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # ⚠️ INVERTED until 2026-07-22: this was missing `== 0`. Every rule's
              # condition is `A > 0`, so with the raw gauge (1 = healthy) it fired
              # whenever Plausible was UP — and re-notified every 4h, matching the
              # warning `repeat_interval`. #479 spotted it as "fires with zero failed
              # samples", which is exactly what an inverted probe check looks like.
              # Every other probe rule already used `== 0`; this one was the outlier.
              expr: 'probe_success{instance="https://plausible.datanika.io/login"} == 0'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Plausible analytics is down"
          description: "Blackbox probe to https://plausible.datanika.io/login has failed for 5 minutes. Landing analytics may be silently dropping."

      # --- App external health ---
      - uid: app-external-down
        title: App External Health Down
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'probe_success{instance="https://app.datanika.io/healthz"} == 0'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "app.datanika.io /healthz not reachable externally"
          description: "External blackbox probe to https://app.datanika.io/healthz has failed continuously for 2 minutes. Distinct from the internal container healthcheck — this catches Nginx/Cloudflare/DNS problems."

      # --- App frontend (what users actually load) ---
      # The /healthz probe only covers the backend :8000. Users hit /, served by the
      # frontend, which boots slower — during the 2026-07-21 deploy gap / was failing
      # while /healthz had already recovered, and nothing measured it.
      - uid: app-frontend-down
        title: App Frontend Down
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'probe_success{instance="https://app.datanika.io/"} == 0'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "app.datanika.io / not reachable externally"
          description: "External blackbox probe to https://app.datanika.io/ (the page users actually load) has failed for 2 minutes. Distinct from /healthz, which only covers the backend."

  - orgId: 1
    name: Database Alerts
    folder: Datanika
    interval: 5m
    rules:
      # --- Slow query rate spike ---
      - uid: pg-slow-queries
        title: PostgreSQL Slow Query Spike
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'rate(pg_stat_statements_seconds_total{datname="datanika"}[5m]) > 0.5'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL slow query rate elevated"
          description: "pg_stat_statements reports elevated query time. Check docker logs datanika-postgres for queries over 500ms."

  # Revenue-facing alerts. Data source is the Postgres `subscriptions` + `plans`
  # tables rather than Prometheus counters — the Paddle webhook handler in
  # datanika_cloud/billing/webhook.py updates row state directly, so `updated_at`
  # is the freshest proxy for "last webhook successfully processed". No app-side
  # metrics instrumentation is required; adding Prometheus counters would be
  # nice-to-have (tracked as a follow-up in PLAN_INFRASTRUCTURE.md).
  #
  # Synthetic fire procedure (run once per rule after provisioning).
  #
  # Lesson from 2026-04-15 PM incident: a prior session ran the webhook-silence
  # synthetic UPDATE but never reverted, leaving sub id=1 with updated_at 900h
  # in the past. When PR #161 shipped the cleaned annotation wording, the
  # still-stale row correctly tripped stuck-past-due and fired a live Telegram
  # alert mid-sweep. Root cause was not a bug — it was an unclean test teardown
  # combined with server-side hot-edits to this very file (violating the
  # deploy-via-git rule). Both are now explicit pre/post steps below.
  #
  # --- Pre-flight (MANDATORY, fail loudly if any step surfaces drift) ---
  # 0a. SSH to Hetzner: `ssh root@46.225.214.120`
  # 0b. Verify the server checkout is CLEAN against master:
  #       `cd /opt/datanika/datanika && git status --porcelain`
  #     MUST return empty. If any file is dirty, STOP — someone hot-edited the
  #     server. Reconcile via git (commit + push + pull, or checkout --)
  #     before touching the DB. Never run a synthetic fire on top of drift;
  #     a CD git pull on next deploy will silently clobber the edits.
  # 0c. Verify no pre-existing stale rows (proves the DB starts clean):
  #       `docker exec datanika-postgres psql -U $POSTGRES_USER -d $POSTGRES_DB -c "
  #         SELECT id, status, updated_at, AGE(NOW(), updated_at) AS age
  #         FROM subscriptions
  #         WHERE deleted_at IS NULL
  #           AND updated_at < NOW() - INTERVAL '30 days';"`
  #     MUST return 0 rows. If rows come back, investigate each one (real
  #     stuck sub? leftover test data?) and resolve BEFORE starting — otherwise
  #     you cannot distinguish the synthetic fire signal from pre-existing noise.
  # 0d. Snapshot the target IDs + current state you are about to mutate, so
  #     you can revert exactly (copy this output into your scratchpad):
  #       `SELECT id, status, updated_at, paddle_subscription_id FROM subscriptions
  #          WHERE status IN ('active','trialing','past_due') AND deleted_at IS NULL
  #          ORDER BY id;`
  #
  # --- Synthetic fire steps (each step MUST include its revert SQL) ---
  # 1. Connect:
  #      `docker exec -it datanika-postgres psql -U $POSTGRES_USER -d $POSTGRES_DB`
  # 2. For webhook-silence:
  #      Fire:   `UPDATE subscriptions SET updated_at = NOW() - INTERVAL '900 hours'
  #                 WHERE status IN ('active','trialing','past_due') AND deleted_at IS NULL;`
  #      Wait:   ~35 minutes (5m eval interval + 30m `for`) and confirm Telegram alert.
  #      REVERT: `UPDATE subscriptions SET updated_at = NOW()
  #                 WHERE status IN ('active','trialing','past_due') AND deleted_at IS NULL;`
  #      Verify: `SELECT id, status, AGE(NOW(), updated_at) FROM subscriptions
  #                 WHERE status IN ('active','trialing','past_due') AND deleted_at IS NULL;`
  #              All ages MUST be < 1 minute. If any age > 1 minute, your revert
  #              missed a row — re-run the revert with a tighter WHERE.
  # 3. For stuck-past-due:
  #      Fire:   `UPDATE subscriptions SET status = 'past_due',
  #                 updated_at = NOW() - INTERVAL '80 hours'
  #                 WHERE id = <one-target-id-from-step-0d>;`
  #              (Prefer flipping an existing active/trialing sub; do NOT INSERT.)
  #      Wait:   ~5 minutes (expr uses `for: 0s`, eval interval 5m).
  #      REVERT: `UPDATE subscriptions
  #                 SET status = '<original-status-from-0d>',
  #                     updated_at = NOW()
  #                 WHERE id = <same-target-id>;`
  #      Verify: `SELECT id, status, AGE(NOW(), updated_at) FROM subscriptions
  #                 WHERE id = <target-id>;`
  #              Status MUST match the 0d snapshot and age MUST be < 1 minute.
  # 4. For MRR drop:
  #      Fire:   `UPDATE subscriptions SET status = 'cancelled',
  #                 ends_at = NOW() - INTERVAL '1 day'
  #                 WHERE id = <one-target-id-from-step-0d>;`
  #      Wait:   ~10 minutes (eval + for).
  #      REVERT: `UPDATE subscriptions SET status = '<original-status-from-0d>',
  #                 ends_at = NULL   -- or the original value from 0d
  #                 WHERE id = <same-target-id>;`
  #      Verify: same as step 3.
  #
  # --- Post-test verification (MANDATORY) ---
  # 5. Re-run the 0c query. MUST return 0 rows. If not, you left drift — fix
  #    NOW before walking away; a stale row will re-fire at the next eval.
  # 6. Re-run the 0b `git status --porcelain` on the server. MUST be empty.
  # 7. Watch Telegram for ~1h: none of the three rules should re-fire.
  #
  # --- Alternative: dry-run via Grafana UI (does NOT touch prod DB) ---
  # Use the "Preview" button in the rule editor to execute the query without
  # waiting for the 5m cadence. Catches query bugs but NOT annotation-template
  # bugs (those only show up on real notifier dispatch — see PR #161).
  # See PR #139 body for details.
  - orgId: 1
    name: Revenue Alerts
    folder: Datanika Cloud
    interval: 5m
    rules:
      # --- Paddle webhook silence ---
      # Fires if `MAX(subscriptions.updated_at)` is older than 840 hours
      # (35 days ≈ one monthly billing cycle + 5-day grace) while at least one
      # active/trialing/past_due subscription exists. The webhook handler
      # touches `updated_at` on every subscription.* and transaction.completed
      # event, so a month-plus silence across ALL active subs means no
      # renewal event ever landed — a strong signal that webhook delivery
      # from Paddle is broken (signature rotation, DNS/firewall change,
      # handler exception, Paddle-side outage).
      #
      # Threshold is TUNED FOR THE CURRENT SMALL CUSTOMER BASE (2026-04-14).
      # Verified against prod: max silence today is 487h on the single
      # active Pro sub (mid-cycle, no events since signup 2026-03-25). Once
      # the webhook handler populates `renews_at` (currently always NULL —
      # `handle_subscription_created` accepts the kwarg but webhook.py never
      # passes it), switch this rule to a missed-renewal query with a 12h
      # threshold: `WHERE renews_at < NOW() - INTERVAL '12 hours' AND updated_at < renews_at`.
      # Tracked as a follow-up in PLAN_INFRASTRUCTURE.md.
      - uid: revenue-webhook-silence
        title: Paddle Webhook Silence
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: datanika-postgres
            model:
              datasource:
                type: postgres
                uid: datanika-postgres
              rawSql: |-
                SELECT COALESCE(
                  CASE
                    WHEN (SELECT COUNT(*) FROM subscriptions
                          WHERE status IN ('active','trialing','past_due')
                            AND deleted_at IS NULL) > 0
                    THEN EXTRACT(EPOCH FROM (NOW() - MAX(updated_at))) / 3600.0
                    ELSE 0
                  END, 0
                )::numeric(10,2) AS hours_since_last_webhook
                FROM subscriptions
                WHERE status IN ('active','trialing','past_due')
                  AND deleted_at IS NULL;
              format: table
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
              settings:
                mode: replaceNN
                replaceWithValue: 0
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [840]
              refId: C
        for: 30m
        labels:
          severity: warning
          team: revenue
        annotations:
          summary: "No Paddle webhooks processed in 35+ days"
          description: "Latest subscriptions.updated_at is older than 840 hours (35 days) while active/trialing/past_due subscriptions exist. A full monthly billing cycle should have produced at least one subscription.updated or transaction.completed event. Check the webhook handler logs on datanika-app for webhook errors, Paddle dashboard → Notifications → Webhooks for delivery errors, and the PADDLE_WEBHOOK_SECRET value in .env.docker. Note: threshold is coarse because subscriptions.renews_at is not currently populated — once it is, switch this rule to a missed-renewal query with a 12h grace."

      # --- Stuck past_due subscription ---
      # A subscription in past_due for > 72h should have transitioned to either
      # active (dunning recovered) or cancelled/expired (dunning gave up) via a
      # follow-up webhook. If it hasn't, the follow-up webhook was dropped —
      # silent revenue state drift.
      - uid: revenue-stuck-past-due
        title: Stuck past_due Subscription
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: datanika-postgres
            model:
              datasource:
                type: postgres
                uid: datanika-postgres
              rawSql: |-
                SELECT COUNT(*)::int AS stuck_count
                FROM subscriptions
                WHERE status = 'past_due'
                  AND updated_at < NOW() - INTERVAL '72 hours'
                  AND deleted_at IS NULL;
              format: table
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
              settings:
                mode: replaceNN
                replaceWithValue: 0
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 0s
        labels:
          severity: critical
          team: revenue
        annotations:
          summary: "Subscription stuck in past_due for over 72h"
          description: "One or more subscriptions have been in past_due for longer than 72 hours. Paddle's dunning cycle should resolve within 72h — either a follow-up webhook was dropped or the handler failed on it. Inspect: SELECT id, paddle_subscription_id, updated_at FROM subscriptions WHERE status = 'past_due' AND updated_at older than 72 hours. Cross-check the Paddle dashboard for the corresponding subscription state. Full query in monitoring/grafana/provisioning/alerting/alerts.yml."

      # --- MRR drop week-over-week ---
      # Business-anomaly detection. Compares today's MRR (sum of monthly-equiv
      # price for active+trialing subs) against MRR as-of 7 days ago. The 10%
      # threshold is tuned for the current small customer base — bump it to
      # 5% once MRR exceeds ~$5k/mo to keep the warn floor meaningful.
      - uid: revenue-mrr-drop-wow
        title: MRR Drop Week-over-Week
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: datanika-postgres
            model:
              datasource:
                type: postgres
                uid: datanika-postgres
              rawSql: |-
                WITH current_mrr AS (
                  SELECT COALESCE(SUM(
                    CASE p.interval
                      WHEN 'yearly'  THEN p.price_cents / 12.0 / 100.0
                      WHEN 'monthly' THEN p.price_cents / 100.0
                      ELSE 0
                    END
                  ), 0)::numeric AS mrr
                  FROM subscriptions s
                  JOIN plans p ON p.id = s.plan_id
                  WHERE s.status IN ('active','trialing')
                    AND s.deleted_at IS NULL
                ),
                last_week_mrr AS (
                  SELECT COALESCE(SUM(
                    CASE p.interval
                      WHEN 'yearly'  THEN p.price_cents / 12.0 / 100.0
                      WHEN 'monthly' THEN p.price_cents / 100.0
                      ELSE 0
                    END
                  ), 0)::numeric AS mrr
                  FROM subscriptions s
                  JOIN plans p ON p.id = s.plan_id
                  WHERE s.created_at <= NOW() - INTERVAL '7 days'
                    AND (s.ends_at IS NULL OR s.ends_at > NOW() - INTERVAL '7 days')
                    AND s.status IN ('active','trialing','past_due')
                    AND s.deleted_at IS NULL
                )
                SELECT
                  CASE
                    WHEN lw.mrr = 0 THEN 0
                    ELSE GREATEST(((lw.mrr - cm.mrr) / lw.mrr * 100)::numeric(10,2), 0)
                  END AS mrr_drop_pct_wow
                FROM current_mrr cm, last_week_mrr lw;
              format: table
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
              settings:
                mode: replaceNN
                replaceWithValue: 0
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C
        for: 30m
        labels:
          severity: warning
          team: revenue
        annotations:
          summary: "MRR dropped more than 10% week-over-week"
          description: "Current MRR is more than 10% below the week-ago baseline. Check the Revenue Metrics dashboard (Datanika Cloud → Revenue Metrics) for which plan tier moved. Likely causes: batch of cancellations landed, high-ARPU customer downgraded, or the MRR query is reading a stale snapshot. Compare the current_mrr vs last_week_mrr CTEs in the alerts.yml file."

  # === Volume Alerts (V2 P1 plumbing, per plans/infra/SPEC_GB_THROUGHPUT_METRICS.md §7.1) ===
  # Three Infra-owned Postgres-backed rules for the bytes_processed meter.
  # Ships with `noDataState: OK` per §9.1 — silent until Engineering's V2 P1
  # hook handlers start writing `bytes_processed` into `usage_ledger`. All
  # annotations follow the §7.3 template sanity rule (no literal backtick,
  # angle, or ampersand characters), carried over from the 2026-04-15
  # synthetic-fire incident.
  - orgId: 1
    name: Volume Alerts
    folder: Datanika Cloud
    interval: 5m
    rules:
      # --- Tenant volume spike ---
      # Fires if any org's bytes_processed in the last 24h is at least 10x
      # its trailing 7-day daily mean (days -8..-1), OR exceeds 100 GB
      # absolute in 24h (catches brand-new tenants with zero trailing
      # history). Query assumes usage_ledger rows are per-run (one ledger
      # row per run with a source_run_id, aggregated at query time) — lines
      # up with Engineering's V2 P1 migration (core#162) adding
      # `usage_ledger.source_run_id`. Returns COUNT of spiking orgs;
      # threshold C fires at gt 0.
      - uid: volume-tenant-spike
        title: Tenant Volume Spike
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: datanika-postgres
            model:
              datasource:
                type: postgres
                uid: datanika-postgres
              rawSql: |-
                WITH last_24h AS (
                  SELECT org_id, COALESCE(SUM(quantity), 0)::bigint AS bytes_24h
                  FROM usage_ledger
                  WHERE metric = 'bytes_processed'
                    AND created_at >= NOW() - INTERVAL '24 hours'
                  GROUP BY org_id
                ),
                trailing_7d AS (
                  SELECT org_id, COALESCE(SUM(quantity), 0) / 7.0 AS daily_mean
                  FROM usage_ledger
                  WHERE metric = 'bytes_processed'
                    AND created_at >= NOW() - INTERVAL '8 days'
                    AND created_at <  NOW() - INTERVAL '1 day'
                  GROUP BY org_id
                )
                SELECT COUNT(*)::int AS spiking_orgs
                FROM last_24h l
                LEFT JOIN trailing_7d t ON t.org_id = l.org_id
                WHERE l.bytes_24h > 107374182400
                   OR (COALESCE(t.daily_mean, 0) > 0 AND l.bytes_24h >= 10 * t.daily_mean);
              format: table
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
              settings:
                mode: replaceNN
                replaceWithValue: 0
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 0s
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Tenant bytes_processed spiked 10x vs trailing 7-day mean or exceeded 100 GB in 24h"
          description: "One or more orgs have a 24h bytes_processed total that is at least 10 times their trailing 7-day daily mean, or exceeds 100 GB absolute in 24h (which catches brand-new tenants with no trailing history). Catches runaway pipelines before the bill explodes — e.g. a scheduled full-table refresh of a TB table flipped on by accident. Inspect: SELECT org_id, SUM(quantity) FROM usage_ledger WHERE metric equals 'bytes_processed' AND created_at within the last 24 hours GROUP BY org_id ORDER BY SUM(quantity) DESC. Cross-check the Volume Metrics dashboard (Datanika Cloud folder) for the per-org breakdown panel."

      # --- Plan cap exceeded ---
      # Fires if any active or trialing subscription's bytes_processed for
      # the current billing period has exceeded 2x the plan.bytes_included
      # allowance. Product's 80% warning email covers the softer threshold;
      # this is the Infra visibility signal that a bill surprise is already
      # baked in. `for: 10m` smooths end-of-period race conditions.
      #
      # Only subscriptions whose plan has a non-NULL positive `bytes_included`
      # are considered — legacy / comped / custom plans pass through.
      - uid: volume-plan-cap-exceeded
        title: Plan Cap Exceeded
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: datanika-postgres
            model:
              datasource:
                type: postgres
                uid: datanika-postgres
              rawSql: |-
                WITH current_usage AS (
                  SELECT
                    s.id AS sub_id,
                    s.org_id,
                    p.bytes_included,
                    COALESCE(SUM(ul.quantity), 0)::bigint AS bytes_used
                  FROM subscriptions s
                  JOIN plans p ON p.id = s.plan_id
                  LEFT JOIN usage_ledger ul
                    ON ul.org_id = s.org_id
                   AND ul.metric = 'bytes_processed'
                   AND ul.period_start >= DATE_TRUNC('month', NOW())
                  WHERE s.status IN ('active','trialing')
                    AND s.deleted_at IS NULL
                    AND p.bytes_included IS NOT NULL
                    AND p.bytes_included > 0
                  GROUP BY s.id, s.org_id, p.bytes_included
                )
                SELECT COUNT(*)::int AS over_cap_subs
                FROM current_usage
                WHERE bytes_used > bytes_included * 2;
              format: table
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
              settings:
                mode: replaceNN
                replaceWithValue: 0
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "One or more subscriptions have used over 200% of plan.bytes_included this billing period"
          description: "At least one active or trialing subscription has consumed more than twice its plan's included bytes allowance for the current billing month. Customer is heading for a bill surprise. Product's 80% warning email handles the softer threshold; this is the Infra visibility signal that a hard overage is already locked in. Inspect: SELECT s.id, s.org_id, p.bytes_included, SUM(ul.quantity) FROM subscriptions s JOIN plans p ON p.id equals s.plan_id LEFT JOIN usage_ledger ul ON ul.org_id equals s.org_id AND ul.metric equals 'bytes_processed' AND ul.period_start at or after the start of the current month WHERE s.status in active or trialing GROUP BY s.id, s.org_id, p.bytes_included HAVING SUM(ul.quantity) over 2x bytes_included. Cross-check the Volume Metrics dashboard usage-vs-cap panel."

      # --- System throughput ceiling (capacity planning) ---
      # Ships commented-out with threshold TBD per spec §7.1.3 and §9.4 P4.
      # Fires when system-wide rate of bytes_processed exceeds a capacity
      # ceiling that warrants a Hetzner scale-up decision. Flip this on
      # after 30 days of baseline Prometheus data post-V2 P2 cutover, once
      # `datanika_cloud_bytes_processed_total` (cloud plugin counter) has
      # been flowing long enough to choose a non-arbitrary threshold. The
      # datasourceUid below matches the existing Prometheus datasource
      # already used by other rules in this file (PBFA97CFB590B2093).
      #
      # - uid: volume-system-throughput-ceiling
      #   title: System Throughput Ceiling
      #   condition: C
      #   noDataState: OK
      #   execErrState: Alerting
      #   data:
      #     - refId: A
      #       relativeTimeRange:
      #         from: 600
      #         to: 0
      #       datasourceUid: PBFA97CFB590B2093
      #       model:
      #         datasource:
      #           type: prometheus
      #           uid: PBFA97CFB590B2093
      #         expr: sum(rate(datanika_cloud_bytes_processed_total[5m]))
      #         refId: A
      #     - refId: B
      #       relativeTimeRange:
      #         from: 600
      #         to: 0
      #       datasourceUid: __expr__
      #       model:
      #         type: reduce
      #         reducer: last
      #         expression: A
      #         refId: B
      #         settings:
      #           mode: replaceNN
      #           replaceWithValue: 0
      #     - refId: C
      #       relativeTimeRange:
      #         from: 600
      #         to: 0
      #       datasourceUid: __expr__
      #       model:
      #         type: threshold
      #         expression: B
      #         conditions:
      #           - evaluator:
      #               type: gt
      #               params: [0]  # TBD — set after 30d baseline per spec §9.4 P4
      #         refId: C
      #   for: 5m
      #   labels:
      #     severity: critical
      #     team: infra
      #   annotations:
      #     summary: "System-wide bytes_processed rate exceeds capacity threshold"
      #     description: "Total bytes_processed rate across all orgs is above the capacity planning ceiling. Consider scaling Hetzner worker nodes or throttling new scheduled runs. Cross-check the Volume Metrics dashboard system-wide throughput panel."

  # ---------------------------------------------------------------------------
  # Monitoring liveness (watchdogs)
  #
  # Every rule above is a FILTERING expression, so a healthy system produces no
  # series — which is byte-identical to a dead exporter, a renamed job, or a
  # removed probe target. Those rules therefore cannot detect their own blindness,
  # and `noDataState: OK` on them is correct rather than negligent.
  #
  # absent() inverts that: it returns a series precisely WHEN the metric is missing.
  # These are the rules that fire when monitoring itself stops working.
  # ---------------------------------------------------------------------------
  - orgId: 1
    name: Monitoring Liveness
    folder: Datanika
    interval: 1m
    rules:
      - uid: watchdog-probe-app-healthz
        title: "Watchdog: app /healthz probe missing"
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'absent(probe_success{instance="https://app.datanika.io/healthz"})'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox probe series for app.datanika.io/healthz has disappeared"
          description: "The probe_success series for https://app.datanika.io/healthz is absent. Blackbox, the scrape job, or the target has gone away — App External Health Down cannot fire while this is true."
      - uid: watchdog-probe-app-root
        title: "Watchdog: app / probe missing"
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'absent(probe_success{instance="https://app.datanika.io/"})'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox probe series for app.datanika.io/ has disappeared"
          description: "The probe_success series for https://app.datanika.io/ is absent. App Frontend Down cannot fire while this is true."
      - uid: watchdog-probe-landing
        title: "Watchdog: landing probe missing"
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'absent(probe_success{instance="https://datanika.io/"})'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Blackbox probe series for datanika.io has disappeared"
          description: "The probe_success series for https://datanika.io/ is absent. Landing Site Down cannot fire while this is true."
      - uid: watchdog-app-scrape
        title: "Watchdog: app scrape target missing"
        condition: C
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Both colours: App Unhealthy uses max() over the pair, which returns no
              # series if BOTH jobs vanish — NoData -> OK -> silence. This covers that.
              expr: 'absent(up{job=~"datanika-app(-b)?"})'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is no longer scraping the app"
          description: "up{job=\"datanika-app\"} is absent — the app scrape target is gone. App Unhealthy cannot fire while this is true."
