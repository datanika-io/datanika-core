name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [master, dev]

  # All five of dev's required checks (lint, test, helm-lint, migration-roundtrip,
  # image-probe) are jobs in this file, so a merge queue on dev depends entirely on this
  # trigger. Without it GitHub never starts a run for a queue entry, none of the five is
  # reported, and the entry sits until check_response_timeout_minutes expires and is
  # ejected -- a PR that stops progressing with nothing red anywhere. That is strictly
  # worse than the strict-mode livelock a queue exists to remove, which a human clears in
  # seconds.
  #
  # Deliberately unfiltered by branch: dev is the only branch that will ever carry a queue
  # (never master -- it needs 1 review, unsatisfiable with a single identity, so a queued
  # promotion would wait forever looking like progress), and a wrong filter here fails in
  # exactly the silent direction above.
  #
  # Verified end-to-end on datanika-landing before landing here: GitHub reads triggers from
  # the merge-group ref's OWN tree, so the PR adding this bootstraps itself through the
  # queue. Guarded by tests/test_deploy/test_merge_queue_triggers.py. (core#904)
  merge_group:
    types: [checks_requested]

concurrency:
  # Per-SHA for pushes, per-ref for PRs.
  #
  # A push to dev used to cancel the previous push's run, because the group was the ref. That
  # was harmless when Infra was the only writer to dev. Since 2026-07-22 all five departments
  # merge into dev themselves and merges arrive faster than CI finishes -- three commits landed
  # inside 90 seconds on the first morning, and three of the last six dev runs were cancelled.
  #
  # The promotion pre-flight needs a green run for dev's EXACT head; a green run from three
  # commits ago says nothing about what you are about to ship. When the head's run is cancelled
  # that condition can never be satisfied. A cancelled run is not a failure -- it is the absence
  # of evidence, and the fix is to stop discarding it.
  #
  # PRs keep cancellation: superseding a PR run is exactly what you want, and no promotion
  # decision rests on it.
  #
  # merge_group is the third case and it needs the SAME protection as push, for the same
  # reason one paragraph up. `github.event_name != 'push'` evaluates TRUE for a merge
  # group, so before core#904 a queue entry's run was cancellable -- and a cancelled
  # queue-entry run is not "recompute it", it is the merge silently not happening: nothing
  # re-runs it, the queue waits out its timeout and ejects the PR.
  #
  # This is not theoretical. The merge-group ref is suffixed with the BASE sha, not the PR
  # head (`refs/heads/gh-readonly-queue/dev/pr-N-<base>`, measured on landing), so two
  # entries for the same PR against an unchanged base share a group key.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' && github.event_name != 'merge_group' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"
          # #475 made CI build lxml/xmlsec from source so it tests what ships, at a cost
          # of ~3 min per job. Cache uv keyed on the lockfile so those builds happen once
          # per lock change instead of once per job per run (#477). The faithfulness is
          # the point -- reclaiming the time by reverting it would restore #470 silently.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps

      - name: Ruff check
        run: ruff check datanika tests --exclude "datanika/migrations"

      - name: Ruff format check
        run: ruff format --check datanika tests --exclude "datanika/i18n"

      # core#876. Seventeen controls over the staging SHA attribution scripts, thirteen of
      # which assert a REFUSAL — including the two shapes that read as green: no stamp on
      # the box at all, and an EXPECTED_SHA that evaluates empty so nothing is compared
      # with nothing. Shell, so it is outside the pytest suite; gated here because a guard
      # nobody has watched fail is not evidence.
      - name: Staging SHA attribution controls
        run: bash scripts/test-staging-sha-stamp.sh

  test:
    runs-on: ubuntu-latest
    # core#841. This job runs `pytest tests/`, which collects every file in
    # tests/test_migrations/ — and the `roundtrip_db_url` fixture there needs a real
    # Postgres. With no service container and no DATABASE_URL_SYNC_TEST it fell through
    # to the testcontainers branch, which is flaky on a shared GHA runner: PR #838 went
    # red with 31 errors and passed on re-run with byte-identical code.
    #
    # `test` is a REQUIRED check on `dev`, so that is worse than an ordinary flake. The
    # only cheap response is to re-run, and a team that re-runs reflexively has lost the
    # ability to tell this apart from a real break (QA_RULES §12) — now that auto-merge is
    # armed, it is also a check that quietly stops merging things.
    #
    # ⚠️ The fix is to give the job the database, NOT to soften the guard. conftest.py's
    # `_no_postgres` deliberately FAILS rather than skips: a migration guard that silently
    # skips when its database is absent is this project's signature defect, a green
    # indistinguishable from the one you would get had it failed. Do not turn it into a
    # skip. ⚠️ Nor `--ignore=tests/test_migrations/`: `migration-roundtrip` names only 3 of
    # the 14 files there, so ignoring the directory would drop the other eleven from every
    # required check — including the two in #838's report — and nothing would say so.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"
          # #475 made CI build lxml/xmlsec from source so it tests what ships, at a cost
          # of ~3 min per job. Cache uv keyed on the lockfile so those builds happen once
          # per lock change instead of once per job per run (#477). The faithfulness is
          # the point -- reclaiming the time by reverting it would restore #470 silently.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps

      - name: Fetch the deployed release
        # This job runs the whole suite, which includes the t1-window guard
        # (core#449). That guard compares against what production runs, and
        # actions/checkout gives a shallow PR-only tree with no origin/master —
        # so without this the guard fails rather than silently comparing
        # nothing. Deliberately not --ignore'd here: `pytest tests/` must mean
        # the same thing in CI as it does locally (core#470).
        run: git fetch --no-tags --depth=1 origin master

      - name: Run tests
        # core#841: point the migration fixtures at the service container above. Without
        # this the env branch of `roundtrip_db_url` is not taken and the fixture falls
        # through to testcontainers even though a healthy Postgres is sitting right there.
        env:
          DATABASE_URL_SYNC_TEST: postgresql://test:test@localhost:5432/test
        run: pytest tests/ --tb=short -q

  # Alembic migration round-trip test (PLAN_QA.md P1). Spins up a blank
  # Postgres, runs `upgrade head → downgrade -1 → upgrade head`, asserts
  # the schema round-trips cleanly. Catches migrations whose downgrade()
  # is broken — which only matters at 2 AM during a prod rollback.
  # Kept as a separate job so test failures on main suite don't mask it
  # (and vice-versa). DATABASE_URL_SYNC_TEST points at the service container.
  # Also runs the t1-window guard (core#449): the deployed release's models are
  # read out of git and checked against the migrated schema, which is why this
  # job needs origin/master fetched rather than a shallow PR-only checkout.
  migration-roundtrip:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"
          # #475 made CI build lxml/xmlsec from source so it tests what ships, at a cost
          # of ~3 min per job. Cache uv keyed on the lockfile so those builds happen once
          # per lock change instead of once per job per run (#477). The faithfulness is
          # the point -- reclaiming the time by reverting it would restore #470 silently.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps

      - name: Fetch the deployed release
        # The t1 guard compares against what production runs, so master must be
        # present. actions/checkout gives a shallow PR-only tree by default.
        run: git fetch --no-tags --depth=1 origin master

      - name: Run round-trip + t1-window tests
        env:
          DATABASE_URL_SYNC_TEST: postgresql://test:test@localhost:5432/test
        run: |
          # core#726: test_data_preservation_roundtrip.py is named HERE and not
          # only left in the directory. A file that lives in tests/test_migrations/
          # but is absent from this list is not run by the job whose name promises
          # to have run it — and `migration-roundtrip` green would then assert
          # something nobody measured. The `test` job runs `pytest tests/` and
          # would pick it up, but a reader checking migration coverage looks here.
          # core#693: test_n0_audit_jsonb_blue_green.py is named here for the same
          # reason. It is the only thing that measures the json -> jsonb conversion's
          # t1 tolerance — test_expand_contract.py's own docstring says type changes
          # are "not covered, and left explicit rather than implied", and
          # test_expand_contract_policy.py only demands a written justification. If
          # that probe ever goes red the N₀ migration cannot ship alone, which is a
          # verdict this job's name promises to have collected.
          pytest tests/test_migrations/test_roundtrip.py \
                 tests/test_migrations/test_data_preservation_roundtrip.py \
                 tests/test_migrations/test_n0_audit_jsonb_blue_green.py \
                 tests/test_migrations/test_expand_contract.py -v --tb=long

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Helm lint
        run: helm lint deploy/helm/datanika

      - name: Helm template (dry-run render)
        run: helm template test-release deploy/helm/datanika > /dev/null

  # ===========================================================================
  # image-probe — GATING. Red here holds the merge. (core#602, QA)
  # ===========================================================================
  #
  # The image is the one artifact that ships, and it was the one artifact
  # nothing asserted on. core#602 shipped a broken /mcp for FIVE WEEKS behind a
  # green CI and a green image build, and surfaced only when a deploy failed.
  #
  # Note `build-push-image.yml` DOES build this image — but only on push to
  # dev/master, and it only asserts the build SUCCEEDS. The offending
  # `RUN uv pip install ./datanika-mcp` step succeeds perfectly; the breakage is
  # at import time inside the container, which nothing exercised. That is a green
  # that would have looked identical had the thing failed. This job adds the
  # missing half: a build that happens AT PR TIME, with assertions on what came
  # out of it.
  #
  # Engineering separately adds a `RUN` import assertion inside the Dockerfile.
  # The two are complementary, not duplicative: theirs makes any build anywhere
  # self-checking, this makes a build actually happen before merge — which
  # theirs cannot do, because nothing was building the image on a PR.
  #
  # ---------------------------------------------------------------------------
  # GRADUATED TO GATING 2026-08-30 (QA) — it was informational until then
  # ---------------------------------------------------------------------------
  # It shipped informational because it was legitimately RED until Engineering's
  # pin landed: the defect it asserts on was real and unfixed. Landing it gating
  # then would have made the only cheap way to merge anything "loosen the
  # assertion", which is the exact incentive inversion PLAN_QA's tier policy
  # exists to prevent.
  #
  # The bar was 3 consecutive `INFORMATIONAL_RESULT=success` on `dev`, read from
  # the LOG LINE and not the job tick. Re-derived from the per-job logs on
  # 2026-08-30 — every `dev` push since #612 landed, oldest→newest:
  #
  #   79b0993e ✅  5f7acf4f ✅  cfa98ab1 ✅  63ef6df5 ✅  cb81fe9e ✅  7165ad1a ✅
  #
  # Six consecutive, twice the bar, the last being the SHA promoted to master.
  # And the probe is proven in BOTH directions on real artifacts: red against a
  # `dev`-built image reproducing #602's exact ImportError, green against #612's
  # fixed image. Graduated on that evidence, not on "the fix landed" — a merged
  # fix and a correct artifact are different claims.
  #
  # ⚠️ ANCHOR THE JOB NAME when re-deriving anything from a run log. Until this
  # commit the same log carried `INFORMATIONAL_RESULT=` lines from BOTH this job
  # and `e2e-staging`, so an unanchored grep returned a verdict blended across
  # two jobs — that nearly got reported as "the probe is flapping" while it was
  # 6/6. This job no longer emits that marker at all (see below), so from here
  # `INFORMATIONAL_RESULT=` in a CI log means `e2e-staging`'s tier and nothing
  # else.
  #
  # ⚠️ WHAT THIS CHECK CANNOT GATE: a fork PR gets no `CLOUD_REPO_TOKEN`, so
  # every step below is skipped and the job reports SUCCESS having probed
  # nothing — a green that would look identical had the artifact been broken.
  # That is not fixable here: failing on forks would block all outside
  # contribution, and a job-level `if:` would leave a required check permanently
  # pending, which blocks the merge instead. The class is still caught, one step
  # later: a fork PR cannot reach prod without a maintainer merging it, and the
  # push-to-`dev` run then builds WITH the token. Engineering's build-time
  # import assertion in the Dockerfile (#612) covers the same ground on any
  # build anywhere. Treat a green here on a fork PR as "not evaluated".
  image-probe:
    name: image-probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout core (this repo)
        uses: actions/checkout@v6
        with:
          path: core

      - name: Check the cloud token is available
        id: token
        env:
          CLOUD_REPO_TOKEN: ${{ secrets.CLOUD_REPO_TOKEN }}
        run: |
          # A fork PR gets no secrets, so the cloud checkout would fail with a
          # confusing 404 rather than an honest "cannot run here". Say so.
          if [ -z "${CLOUD_REPO_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUD_REPO_TOKEN unavailable (fork PR?) — the image cannot be built, so this probe proves nothing about this commit."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # core#923 — see the long note on the identical step in `image-cve` below.
      - name: Resolve the cloud branch to pair against
        id: cloudref
        if: steps.token.outputs.available == 'true'
        # ⚠️ `Checkout core (this repo)` above uses `path: core`, so the repo is NOT
        # at the workspace root and a bare `.github/scripts/...` does not exist.
        # Measured: without this the step exits **127** having printed nothing at
        # all, `Checkout cloud` is skipped, and `image-probe` reads `failure` with
        # no diagnostic — which looks exactly like the core#923 defect it fixes.
        # Same convention as the other steps in this job.
        working-directory: core
        env:
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_ref }}
          PR_BASE: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/resolve-cloud-ref.sh

      - name: Checkout cloud (private)
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: datanika-io/datanika-cloud
          # Pair against the branch this PR targets (dev/master), matching what
          # deploy-staging does. The PR's own branch does not exist in cloud.
          ref: ${{ steps.cloudref.outputs.ref }}
          token: ${{ secrets.CLOUD_REPO_TOKEN }}
          path: cloud

      - name: Reshape build context
        if: steps.token.outputs.available == 'true'
        run: |
          # The Dockerfile assumes the monorepo layout with datanika/ and
          # datanika-cloud/ at the root — same reshape as build-push-image.yml.
          mkdir -p build-context
          cp -r core build-context/datanika
          mv cloud build-context/datanika-cloud

      - uses: astral-sh/setup-uv@v8.0.0
        if: steps.token.outputs.available == 'true'
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "core/uv.lock"

      - name: Export the locked pins
        if: steps.token.outputs.available == 'true'
        working-directory: core
        run: |
          # The comparison basis for check C. --no-dev because the image is built
          # --no-dev; comparing against the dev tree would report dozens of
          # legitimately-absent packages and bury the real finding.
          uv export --frozen --no-dev --no-emit-project --no-hashes -o ../lock-pins.txt
          echo "exported $(grep -c '==' ../lock-pins.txt) pins"

      - uses: docker/setup-buildx-action@v3
        if: steps.token.outputs.available == 'true'

      - name: Build the production image
        if: steps.token.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/datanika/Dockerfile
          push: false
          load: true
          tags: datanika-core:probe
          # Read the cache build-push-image.yml populates with mode=max, so a PR
          # usually pays only the layers its own diff invalidated.
          cache-from: type=gha
          platforms: linux/amd64

      # NO `continue-on-error` — removed 2026-08-30 at graduation. This step's
      # failure IS the job's failure, and the job is a required check on `dev`.
      # Re-adding it would silently un-gate the probe while leaving every
      # comment above claiming otherwise, which is the #602 failure mode itself.
      - name: Probe the built image
        id: probe
        if: steps.token.outputs.available == 'true'
        run: |
          # `python3`, not `python`: this job deliberately does NOT run
          # actions/setup-python, so bare `python` may not exist on the runner.
          # The probe is stdlib-only, so the runner's own interpreter is enough —
          # and every dependency this job does not have is one fewer way for it
          # to go red for a reason that has nothing to do with the artifact.
          python3 core/scripts/probe_built_image.py \
            --image datanika-core:probe \
            --lock-pins lock-pins.txt

      # The tick is now load-bearing, so this step no longer has to substitute
      # for it. It stays because the *reason* still needs saying out loud, and
      # because "did not run" and "passed" must never look alike in a log.
      #
      # Deliberately NOT `INFORMATIONAL_RESULT=` any more: that marker now
      # belongs solely to `e2e-staging`'s informational tier. Two jobs emitting
      # one marker is what produced a blended verdict across two jobs.
      - name: Record the probe result
        if: always()
        run: |
          # `outcome` is the step's real result. With continue-on-error gone,
          # `conclusion` now agrees with it — but read `outcome` regardless, so
          # this line keeps meaning the same thing if the flag ever comes back.
          RESULT="${{ steps.probe.outcome }}"
          echo "IMAGE_PROBE_RESULT=${RESULT}"
          case "${RESULT}" in
            success)
              echo "::notice::image-probe passed: the built image contains what production needs."
              ;;
            failure)
              echo "::error::image-probe FAILED — the built image does not contain what production needs. This is GATING: fix the artifact, do not loosen the assertion. A deploy from this image would fail its blue/green post-swap check (core#602)."
              ;;
            skipped)
              # Two very different reasons land here, and they must not be
              # conflated: no cloud token (fork PR — nothing was built), or the
              # build step failed (the job is already red from that step).
              if [ "${{ steps.token.outputs.available }}" != "true" ]; then
                echo "::warning::image-probe NOT EVALUATED — no CLOUD_REPO_TOKEN (fork PR?), so no image was built. This green proves NOTHING about the artifact; see the job header."
              else
                echo "::error::image-probe did NOT RUN — the image build above failed. That is itself a gating failure; this proves nothing about the artifact either way."
              fi
              ;;
            *)
              echo "::error::image-probe outcome=${RESULT} — unexpected. Treat as not evaluated."
              ;;
          esac

  # ---------------------------------------------------------------------------
  # image-cve — trivy scan of the BUILT IMAGE (#723, placement resolved with #728)
  #
  # WHY THE ARTIFACT AND NOT `uv.lock`. The Dockerfile runs two graft installs
  # *after* `uv sync --frozen`:
  #
  #     RUN uv pip install --constraint /tmp/lock-constraints.txt /cloud
  #     RUN uv pip install --constraint /tmp/lock-constraints.txt ./datanika-mcp
  #
  # That constraints file is an exported `uv.lock`, so it binds only packages
  # CORE ALREADY LOCKS. Anything the grafted trees pull in that core does not
  # lock is unconstrained and appears in NO manifest — the residue of #602 that
  # the constraints fix does not cover. Add `FROM python:3.12-slim` and
  # `COPY --from=ghcr.io/astral-sh/uv:latest`, two floating tags in no lockfile
  # at all, and a manifest scan is measuring the wrong artifact entirely.
  #
  # WHY A SEPARATE JOB AND NOT A STEP IN `image-probe`. image-probe is a
  # REQUIRED check on `dev`. A scan step inside it would gate every merge on
  # third-party CVEs no PR author can fix — the exact objection #728 raises. As
  # its own NON-REQUIRED job it reports without blocking, while the scan step
  # itself still hard-fails (no `continue-on-error` quarantine), which is what
  # #723 asks for. Promoting it to required later is one API call, and by then
  # we will know the noise floor.
  #
  # ⚠️ ACTION PIN. `aquasecurity/trivy-action` tags carry a `v` PREFIX and there
  # is NO major-only tag. Re-derived against the registry 2026-08-31, by HTTP
  # status rather than response body:
  #     v0.36.0 -> 200 (sha a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8, latest release)
  #     0.36.0  -> 404      v0 -> 404      0.33.1 -> 404
  # A `@0.33.1`-style pin written from memory does not resolve and the job never
  # runs. Do NOT "simplify" this to `@v0`.
  # ---------------------------------------------------------------------------
  image-cve:
    name: image-cve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Deliberately NO `security-events: write`. Uploading SARIF would start
      # creating code-scanning alerts on a repo that has none today; do that as
      # a separate, deliberate change once the baseline volume is known.
    steps:
      - name: Checkout core (this repo)
        uses: actions/checkout@v6
        with:
          path: core

      - name: Check the cloud token is available
        id: token
        env:
          CLOUD_REPO_TOKEN: ${{ secrets.CLOUD_REPO_TOKEN }}
        run: |
          # A fork PR gets no secrets, so no image can be built. image-probe has
          # the same guard and the same hazard: without this the job reports
          # green having scanned nothing at all.
          if [ -z "${CLOUD_REPO_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUD_REPO_TOKEN unavailable (fork PR?) — no image can be built, so this scan proves NOTHING about this commit."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------------------------------------------------------
      # core#923 — this is why core's merge queue was rolled back.
      #
      # The expression used to be `${{ github.base_ref || github.ref_name }}`:
      #
      #   event          base_ref   ref_name                          resolved
      #   pull_request   dev        <pr>/merge                         dev  ✅
      #   push           (empty)    dev / master                       dev  ✅
      #   merge_group    (EMPTY)    gh-readonly-queue/dev/pr-N-<sha>   that  ❌
      #
      # `github.base_ref` is populated only for `pull_request`. The `|| ref_name`
      # fallback was written for `push`, where the ref name IS a real branch. On a
      # merge group it is a GitHub-generated queue branch that exists only in THIS
      # repo — so the cloud checkout 404s, `image-probe` (a REQUIRED check) fails
      # in ~46 seconds, and every queue entry is ejected `reason: failed_checks`.
      #
      # ⚠️ It was NOT the token: step "Check the cloud token is available" passed,
      # so the natural first hypothesis sends you to the wrong layer. And it was
      # NOT `image-cve` — a red non-required check does not block queue entry.
      #
      # 🚨 The field name `github.event.merge_group.base_ref` has NOT been
      # confirmed against a real merge-group payload — core has no queue right now,
      # which is the whole problem. #923 warns that a wrong field is empty, falls
      # through to `ref_name`, and reproduces the identical failure. So the
      # resolution moved into `resolve-cloud-ref.sh`, which REFUSES a queue-branch
      # or empty result with a named error instead of handing it to checkout. A
      # wrong field can no longer fail silently; it fails saying so. The script
      # also prints all three inputs, so the first real merge-group run records the
      # payload's actual value in its log.
      # -------------------------------------------------------------------------
      - name: Resolve the cloud branch to pair against
        id: cloudref
        if: steps.token.outputs.available == 'true'
        # ⚠️ `Checkout core (this repo)` above uses `path: core`, so the repo is NOT
        # at the workspace root and a bare `.github/scripts/...` does not exist.
        # Measured: without this the step exits **127** having printed nothing at
        # all, `Checkout cloud` is skipped, and `image-probe` reads `failure` with
        # no diagnostic — which looks exactly like the core#923 defect it fixes.
        # Same convention as the other steps in this job.
        working-directory: core
        env:
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_ref }}
          PR_BASE: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/resolve-cloud-ref.sh

      - name: Checkout cloud (private)
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: datanika-io/datanika-cloud
          # Pair against the branch this PR targets, matching image-probe.
          # NOTE: production builds cloud at a pinned `ref: master`, so a PR into
          # dev scans core-PR + cloud-dev — the right basis for a PR gate, but
          # not the shipping pairing. See the promotion-ordering rule.
          ref: ${{ steps.cloudref.outputs.ref }}
          token: ${{ secrets.CLOUD_REPO_TOKEN }}
          path: cloud

      - name: Reshape build context
        if: steps.token.outputs.available == 'true'
        run: |
          # The Dockerfile assumes the monorepo layout with datanika/ and
          # datanika-cloud/ at the root — same reshape as image-probe.
          mkdir -p build-context
          cp -r core build-context/datanika
          mv cloud build-context/datanika-cloud

      - uses: docker/setup-buildx-action@v3
        if: steps.token.outputs.available == 'true'

      - name: Build the production image
        if: steps.token.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: build-context
          file: build-context/datanika/Dockerfile
          push: false
          load: true
          tags: datanika-core:cve
          # Reads the cache image-probe and build-push-image populate, so this
          # usually pays only the layers the diff invalidated.
          cache-from: type=gha
          platforms: linux/amd64

      # ── CANARY, and it runs BEFORE the gate on purpose ──────────────────────
      # A scan reporting no findings is indistinguishable from a scan that never
      # loaded its vulnerability database, never parsed the image, or had its
      # exit-code plumbing misconfigured. This project has shipped that exact
      # shape repeatedly (#615 and #616 were structurally unable to fire; a
      # restore drill asserted seed data), so a green from the gate below is not
      # evidence until this step has been seen to go red.
      #
      # It scans THE SAME image with the net thrown as wide as it goes: every
      # severity, unfixed included. A Debian-based Python image cannot be clean
      # at LOW+. If this finds nothing, trivy is not working — and we learn that
      # instead of publishing a reassuring green.
      #
      # Deliberately NOT a pinned known-vulnerable image: that needs an extra
      # pull, and it silently stops proving anything the day its findings get
      # fixed or dropped from the DB.
      - name: Canary — prove the scanner can actually fail
        id: canary
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Trivy pulls its DB from ghcr.io; anonymous pulls from shared runner
          # IPs get 429'd. This is the AUTOMATIC GITHUB_TOKEN — not a configured
          # secret, nothing to provision, and it works on forks.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: datanika-core:cve
          scan-type: image
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Assert the canary went red
        if: steps.token.outputs.available == 'true'
        run: |
          # `outcome` is the step's real result even though continue-on-error
          # forced `conclusion` to success.
          if [ "${{ steps.canary.outcome }}" != "failure" ]; then
            echo "::error::CANARY DID NOT FIRE. Trivy reported no findings at ANY severity, including unfixed, on a Debian-based image. The scanner is not armed — treat the gate below as proving nothing, and fix trivy before trusting this job."
            exit 1
          fi
          echo "::notice::Canary fired as expected — trivy is armed and its exit-code plumbing works."

      # ── The actual gate ─────────────────────────────────────────────────────
      - name: Scan the built image
        if: steps.token.outputs.available == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: datanika-core:cve
          scan-type: image
          format: table
          # CRITICAL+HIGH, fixed-only, and the reason is written down per #728's
          # "say why": a python:3.12-slim base carries a long tail of MEDIUM/LOW
          # OS CVEs Debian will not fix in a slim image, and an unfixable CVE is
          # a base-image decision, not an action item for a PR author. A report
          # that is always red gets ignored, which is the same as no report.
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Record what this job actually evaluated
        if: always()
        run: |
          if [ "${{ steps.token.outputs.available }}" != "true" ]; then
            echo "::warning::image-cve NOT EVALUATED — no image was built (fork PR). This green proves nothing."
          else
            echo "::notice::image-cve scanned the built artifact (CRITICAL+HIGH, fixed-only); canary confirmed the scanner armed."
          fi

  # Prod deploy is handled by .github/workflows/deploy-pointer.yml (build-from-source
  # to pointer.gr on push:master). The old GHCR-pull-to-Hetzner deploy job was
  # removed 2026-07-17 — the Hetzner box is gone and GHCR is inaccessible from the box.

  deploy-staging:
    # Serialise staging deploys (#572). Merges into dev now arrive faster than a staging
    # deploy takes to finish, so two runs manipulated the same container names at once: one
    # removed a container while the other recreated it, the removal failed, docker renamed the
    # loser to <id>_<name>, and every later run hit "container name is already in use".
    #
    # cancel-in-progress is FALSE on purpose. Cancelling a deploy mid-flight is what created the
    # wedged state; queueing is safe because GitHub holds only one pending job, so the newest
    # queued run wins and nothing is killed while it is manipulating containers.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    needs: [lint, test, helm-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout core (dev)
        uses: actions/checkout@v6
        with:
          path: datanika

      - name: Checkout cloud (dev)
        uses: actions/checkout@v6
        with:
          repository: datanika-io/datanika-cloud
          ref: dev
          token: ${{ secrets.CLOUD_REPO_TOKEN }}
          path: datanika-cloud

      - name: Build source tarball
        run: |
          tar czf /tmp/staging-src.tgz --exclude-vcs --exclude='*/.venv' \
            --exclude='datanika/.web' --exclude='*/node_modules' --exclude='*/__pycache__' \
            --exclude='datanika/.env' --exclude='datanika/.env.docker' \
            datanika datanika-cloud

      - name: Configure SSH to pointer.gr
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.POINTER_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.POINTER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # The image build compiles lxml/xmlsec from source and emits nothing for
          # ~5-8 min; without a keepalive the SSH session is torn down mid-build and the
          # step dies with `client_loop: send disconnect: Broken pipe` (exit 255).
          # Same fix already applied to deploy-pointer.yml — this job had the identical
          # pattern and was missed when that one was fixed.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 120\n  TCPKeepAlive yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Transfer dev source + build :staging image
        run: |
          cat /tmp/staging-src.tgz | ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'rm -rf /opt/datanika-staging-src && mkdir -p /opt/datanika-staging-src && cd /opt/datanika-staging-src && tar xzf -'
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'cd /opt/datanika-staging-src && docker build -t ghcr.io/datanika-io/datanika-core:staging -f datanika/Dockerfile .'

      - name: Sync staging compose from the repo
        # Staging's docker-compose.yml used to exist only on the box, so manifest changes in the
        # repo silently did not apply to staging -- that is how #529 (no uploads volume on
        # staging) persisted after Engineering fixed every in-repo manifest. It is version
        # controlled now, at deploy/staging/docker-compose.yml, and the transfer step above has
        # already placed the tree at /opt/datanika-staging-src.
        #
        # Backup -> write -> `docker compose config` validate -> restore + fail on invalid. The
        # recreate step immediately below picks up the new file (it cd's into
        # /opt/datanika-staging), so this step deliberately does not restart anything.
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" 'bash -s' <<'SYNC'
          set -e
          SRC=/opt/datanika-staging-src/datanika/deploy/staging/docker-compose.yml
          DST=/opt/datanika-staging/docker-compose.yml
          [ -f "$SRC" ] || { echo "repo copy missing at $SRC"; exit 1; }
          if cmp -s "$SRC" "$DST"; then echo "staging compose already current"; exit 0; fi
          cp -a "$DST" "${DST}.bak.$(date +%s)"
          cp "$SRC" "$DST"
          cd /opt/datanika-staging
          set -a && . ./.env.docker && set +a
          if docker compose -p datanika-staging config >/dev/null 2>/tmp/cfgerr; then
            echo "staging compose synced from repo and validated"
          else
            echo "INVALID compose from repo -- restoring previous:"; cat /tmp/cfgerr
            cp "$(ls -t ${DST}.bak.* | head -1)" "$DST"
            docker compose -p datanika-staging config >/dev/null
            exit 1
          fi
          SYNC

      - name: Recreate staging stack on :staging
        # `up -d` can fail with `No such container: <id>` when compose still holds a reference
        # to a container removed out of band (#536). There was no recovery, so the step died.
        #
        # The cost is out of proportion to the fault: deploy-staging failing marks
        # smoke-staging, e2e-staging and e2e-sso as SKIPPED, so the E2E tier does not report a
        # failure -- it disappears, and a skipped gate reads like a pass at a glance. One bad
        # deploy therefore costs a whole night of staging coverage.
        #
        # Clear the stale per-service state and retry once. Deliberately NOT --remove-orphans:
        # app_b is a profile service, so compose can classify it as an orphan while the profile
        # is inactive and delete the staging green colour along with the stale reference.
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" 'bash -s' <<'STAGING'
          set -e
          cd /opt/datanika-staging
          set -a && . ./.env.docker && set +a
          if docker compose -p datanika-staging up -d postgres redis app celery beat celery-exporter; then
            echo "staging stack up"
          else
            echo "compose up failed - clearing the whole project's containers, retrying once"
            # By PROJECT LABEL, not service name: a container docker renamed to <id>_<name>
            # after a failed removal is no longer recognised by compose as that service, so
            # `rm -sf app celery` walks straight past the very container blocking the name.
            # Named volumes are untouched by `docker rm`, so staging data survives.
            docker ps -aq --filter 'label=com.docker.compose.project=datanika-staging' \
              | xargs -r docker rm -f || true
            docker compose -p datanika-staging up -d --force-recreate postgres redis app celery beat celery-exporter
            echo "staging stack up after recovery"
          fi
          STAGING

      - name: Wait for staging health
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            'for i in $(seq 1 40); do h=$(docker inspect --format "{{.State.Health.Status}}" $(/opt/datanika-staging/active-app.sh) 2>/dev/null); [ "$h" = healthy ] && { echo staging-healthy; exit 0; }; sleep 5; done; echo "staging NOT healthy"; docker logs --tail 40 $(/opt/datanika-staging/active-app.sh); exit 1'

      - name: Stamp the commit staging is now running
        # core#876. LAST step on purpose: the stamp asserts "staging is serving this
        # commit", which is only true once the stack is up and healthy. Written after the
        # health wait, and the writer refuses to record a stack it cannot identify, so a
        # half-finished deploy leaves the PREVIOUS stamp standing rather than a false one —
        # and the next verifier then correctly refuses instead of testing a stale build in
        # the belief it is fresh.
        run: |
          ssh -i ~/.ssh/deploy "root@${{ secrets.POINTER_HOST }}" \
            "bash -s -- write ${{ github.sha }} ${{ github.run_id }} ${{ github.run_attempt }}" \
            < datanika/scripts/staging-deploy-stamp.sh   # this job checks core out under datanika/

  smoke-staging:
    # core#753: this job READS the stack `deploy-staging` mutates, so it must hold the same
    # lock. `deploy-staging`'s group serialised the deploy and then RELEASED it -- while its
    # own verifiers were still running against the stack -- so the next push's deploy was
    # free to recreate containers underneath a suite mid-flight. Measured at 38 false-red
    # gating E2E results on 2026-08-31, and one auto-filed issue against an innocent commit
    # whose entire diff was a shell script.
    #
    # The lock must not be released until nothing is still reading the stack it protects.
    # See the note on `e2e-staging` for what this does and does not buy.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      # core#876. FIRST, before ~4 minutes of dependency installation: if staging is not
      # running this run's commit there is nothing here worth measuring, and the cheapest
      # moment to say so is now.
      - name: Configure SSH to pointer.gr
        env:
          SSH_KEY: ${{ secrets.POINTER_SSH_KEY }}
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 120\n  TCPKeepAlive yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Assert staging is running THIS commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        # SSH_KEY_PATH is deliberately NOT set here: GitHub does no shell expansion in an
        # `env:` value, so `~/.ssh/id_rsa` would arrive as a literal tilde and `ssh -i`
        # would fail on a path that does not exist. The script defaults to
        # "$HOME/.ssh/id_rsa", expanded by the shell that actually runs it.
        run: bash scripts/assert-staging-sha.sh

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "latest"
          # #475 made CI build lxml/xmlsec from source so it tests what ships, at a cost
          # of ~3 min per job. Cache uv keyed on the lockfile so those builds happen once
          # per lock change instead of once per job per run (#477). The faithfulness is
          # the point -- reclaiming the time by reverting it would restore #470 silently.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Install the LOCKED tree, not a fresh resolution: prod builds
          # from uv.lock via `uv sync --frozen`, and CI green means nothing
          # about prod if the two resolve differently (core#470).
          # lxml + xmlsec build from source against ONE system libxml2,
          # mirroring the Dockerfile: their prebuilt wheels each bundle a
          # different libxml2 and mismatch at import. Pinning to the locked
          # pair surfaced this — CI had only worked by resolving a different one.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl \
            pkg-config zlib1g-dev libssl-dev
          uv export --frozen --extra dev --no-emit-project --no-hashes -o ci-requirements.txt
          uv pip install --system -r ci-requirements.txt --no-binary lxml --no-binary xmlsec
          uv pip install --system -e . --no-deps

      - name: Run smoke probes
        id: smoke
        env:
          DATANIKA_STAGING_CF_ACCESS_CLIENT_ID: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_ID }}
          DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET }}
        run: pytest scripts/smoke/ -v --tb=short

      # core#873 audited this job. `if: failure()` WAS safe while `Run smoke probes` was
      # the only step that could fail — job-red and probe-red were the same event.
      #
      # 🆕 core#876 broke that and the invariant below said exactly what to do about it.
      # The SHA assertion added above this can fail, which skips the probes entirely; under
      # `if: failure()` that pages "Staging smoke failed" for a run whose probes never ran —
      # a false headline on a true problem, precisely the defect #873 removed from
      # `e2e-staging`. So the alert is keyed on the probe's own outcome, which is what the
      # `id:` was put there for.
      #
      # An attribution refusal deliberately pages NOTHING. It is a CI-hygiene event, not a
      # production alarm: staging is fine, this run simply cannot honestly report on it. It
      # is loud where it belongs — a red required-adjacent check and a message naming both
      # SHAs — and paging on it would put a "staging is broken" alert in front of the
      # founder several times a day for a scheduling artifact.
      #
      # 🚨 INVARIANT (unchanged, now enforced): any step that can fail is invisible to this
      # alert unless it is folded into the condition below. Do not restore a bare
      # `failure()` — re-read #873 first.
      # ⚠️ `always() &&` is NOT optional here. A bare `steps.smoke.outcome == 'failure'` is
      # implicitly `success() && …`, and `success()` is false precisely when the probe
      # failed — so the alert would never fire again, silently. Same trap the e2e-staging
      # classifier documents at length (core#873).
      - name: Telegram alert on failure
        if: always() && steps.smoke.outcome == 'failure'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          SHORT_SHA=${COMMIT_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          TEXT=$(printf '\xf0\x9f\x9a\xa8 <b>Staging smoke failed</b>\n\n<b>Commit:</b> <code>%s</code>\n<b>Message:</b> %s\n<b>Run:</b> %s' \
            "$(esc "$SHORT_SHA")" "$(esc "$FIRST_LINE")" "$(esc "$RUN_URL")")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML"

  # Two tiers (core#521). GATING specs have a track record and their red holds
  # the promotion. INFORMATIONAL specs are newly written: they run, report and
  # upload artifacts, but do not hold it. A spec graduates informational →
  # gating after 3 consecutive greens on `dev`; demotion is deliberate and needs
  # an issue, or "informational" becomes where tests quietly go to die.
  #
  # Why the tier exists: taking this job from 5 of 62 tests to 62 (#484/#496)
  # also coupled production promotion to the stability of tests written that
  # morning — golden-path, authored 2026-07-22, held back a P0 the same
  # afternoon (#520). Without a tier, every future coverage expansion repeats
  # that, and the cheapest way to unblock a promotion becomes loosening the
  # assertion. Product already caught exactly that on #485: relaxing step 4 to
  # `rows >= 1` would have gone green against an OPEN P0, because you get one
  # row and it is the file listing. A gate that punishes honest new tests
  # produces dishonest ones.
  #
  # Env is job-level so both tiers share one definition — two copies is how
  # they drift apart, which is the failure mode this whole job has been fixing.
  e2e-staging:
    # core#753. Same lock as the mutation it verifies -- see `smoke-staging` above.
    #
    # ⚠️ What this buys, precisely, because the shape is easy to over-claim. GitHub runs one
    # job per group and holds ONE pending job; a newly queued job cancels the previously
    # pending one. So:
    #
    #   GUARANTEED: no `deploy-staging` can run while a verifier holds the lock. That is the
    #   whole of the measured harm -- every failing assertion in the 2026-08-31 evidence
    #   returned 502 (x9) or 503 (x5) and none returned anything else, i.e. containers being
    #   recreated mid-test. That failure mode is now impossible.
    #
    #   NOT guaranteed: a burst can still cancel a run's pending verification, because a
    #   third run's deploy queuing cancels whatever was pending. A CANCELLED verdict is
    #   neither green nor red and reads as absent, which is a far better failure than a red
    #   on the tenant-isolation and RBAC specs -- those run last, so a false red here wore
    #   the most alarming possible headline on the night a real cross-tenant S1 was being
    #   promoted. The newest push always wins the queue, which is the right polarity: the
    #   promotion pre-flight needs a verdict for `dev`'s exact HEAD.
    #
    # ⚠️ `cancel-in-progress` must stay false in every member. `true` on the deploy is
    # core#572 (a cancelled deploy left renamed containers and wedged staging); `true` here
    # discards a verdict the promotion pre-flight needs.
    #
    # Deliberately NOT linearised behind `smoke-staging`. Chaining them would not prevent a
    # competing deploy cancelling this job's pending slot -- it only changes which of the two
    # is sacrificed -- while it WOULD make a red smoke skip E2E entirely, and a skipped gate
    # reads like a pass at a glance.
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      issues: write
    env:
      CI: "true"
      DATANIKA_E2E_BASE_URL: https://staging-app.datanika.io
      DATANIKA_STAGING_CF_ACCESS_CLIENT_ID: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_ID }}
      DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET }}
      # Include @slow specs (core#484). Until 2026-07-22 NO job set this, so
      # `playwright.config.ts`'s grepInvert silently dropped every @slow spec
      # from every run: this job reported success having executed 5 of 62 tests,
      # both files about `?template=` handling. golden-path, tenant-jwt-boundary,
      # tenant-isolation, rbac and viewer-role-ui had never gated a merge.
      DATANIKA_E2E_SLOW: "1"
      # sso-edge-cases hits the backend directly via fixtures/sso.ts, which
      # defaults to http://localhost:8000 — on a CI runner that is nothing, and
      # 5 specs died with `connect ECONNREFUSED ::1:8000` (core#496). The
      # e2e-sso job has always set this; this job never did.
      DATANIKA_E2E_BACKEND_URL: https://staging-app.datanika.io
      # E2E_SEED_INCLUDE_API_KEYS=1 is required by rbac / tenant-isolation /
      # tenant-jwt-boundary: without it the payload carries no keys and the
      # fixtures throw at setup (`DATANIKA_E2E_API_KEY_READONLY not set`), which
      # reads in the log as ~35 tenant-isolation FAILURES rather than as a
      # missing flag (core#496). global-setup.ts already maps all three keys and
      # every org-B field; only the flag was missing. Org B is seeded
      # unconditionally — there is no second-tenant gate.
      DATANIKA_E2E_SEED_CMD: >-
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new root@${{ secrets.POINTER_HOST }}
        'docker exec -e E2E_SEED_ALLOW_ANY_HOST=1 -e E2E_SEED_INCLUDE_API_KEYS=1 $(/opt/datanika-staging/active-app.sh) uv run python -m datanika.scripts.e2e_seed'
    steps:
      - uses: actions/checkout@v6

      # core#876. SSH first, then the attribution assertion, then the ~3 minutes of npm ci
      # and browser install. Two reasons for the order, and the second is the one that
      # matters: a refusal costs no setup time, and it RELEASES THE `staging-deploy` LOCK
      # three minutes sooner, so the run that should be verifying staging gets there faster.
      - name: Configure SSH for seed
        env:
          SSH_KEY: ${{ secrets.POINTER_SSH_KEY }}
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # Keepalive: long, output-silent remote steps otherwise drop the session with
          # `client_loop: send disconnect: Broken pipe` (exit 255). Applied to every SSH
          # setup in this file, not just the one that happened to fail.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 120\n  TCPKeepAlive yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # ⚠️ `id: attribution` is load-bearing the same way `id: gating` is — the classifier
      # below distinguishes "the specs failed" from "this run refused to grade somebody
      # else's build", and those two reds must never wear each other's headline.
      - name: Assert staging is running THIS commit
        id: attribution
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        # SSH_KEY_PATH is deliberately NOT set here: GitHub does no shell expansion in an
        # `env:` value, so `~/.ssh/id_rsa` would arrive as a literal tilde and `ssh -i`
        # would fail on a path that does not exist. The script defaults to
        # "$HOME/.ssh/id_rsa", expanded by the shell that actually runs it.
        run: bash scripts/assert-staging-sha.sh

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      # ── TIER 1: GATING ──────────────────────────────────────────────────────
      # Proven specs. Red here holds the promotion, which is the whole point of
      # the job. Note this job is not a required check on `dev` (those are lint
      # + test), so a red is loud without blocking a merge — it blocks the
      # promotion, which is the decision that should be blocked.
      # ⚠️ `id: gating` is load-bearing (core#873). Everything that CLAIMS an E2E
      # failure keys on THIS step's outcome, never on the job's conclusion — the
      # job is red for reasons that have nothing to do with the specs.
      - name: Run gating E2E specs against staging
        id: gating
        working-directory: e2e
        run: npx playwright test --grep-invert "@informational"

      # ── core#757: a flaky GATING spec is a green run that filed nothing ─────
      # `retries: process.env.CI ? 1 : 0` means a gating spec that fails and then
      # passes on retry is reported `flaky` and Playwright exits 0 — so the step
      # above succeeds, the job succeeds, and every alert below (`if: failure()`)
      # never fires. That is the mechanism by which core#744 reached production:
      # de00365 was `1 flaky / 16 skipped / 45 passed`, concluded `success`, filed
      # no issue, and was promoted.
      #
      # `docs/QA_RULES.md` §12 already forbids retrying an assertion. This step is
      # the pipeline finally implementing the rule that was only written down.
      #
      # ⚠️ It MUST stay above "Assert the @slow specs were actually collected".
      # That step runs `playwright test --list` three times, and each run
      # regenerates the report from zero tests — which is why the artifact really
      # uploaded for de00365 reads `{"files":[],"stats":{"total":0,"flaky":0,
      # "ok":true}}` with a 61 ms duration. Reading the report after those calls
      # measures the `--list`, not the run.
      #
      # `always()`: a genuinely red run can also carry flaky specs, and the report
      # deserves reading either way. The detector never fails the job itself —
      # the gate's verdict is deliberately left unchanged until core#753 stops
      # staging injecting infrastructure noise (hardening the gate while false
      # reds are being injected would punish honest specs, which is the failure
      # the tier policy exists to prevent).
      - name: Detect flaky gating specs
        id: flaky_gate
        if: always()
        working-directory: e2e
        run: python3 scripts/detect_flaky_gating.py results-gating.json --github-output

      # ── TIER 2: INFORMATIONAL ───────────────────────────────────────────────
      # New specs earning a track record. `continue-on-error` quarantines the
      # VERDICT, never the execution: they still run against staging and still
      # upload artifacts, because a quarantined test that stops producing
      # evidence is just a disabled one — and you would never learn it had
      # started passing.
      # ⚠️ The tier can legitimately be EMPTY, and it is as of 2026-08-30 —
      # `golden-path` graduated into the gating tier (core#529) and nothing has
      # replaced it. Both obvious spellings of this step are wrong when it is:
      #   * as written, `playwright test --grep` exits **1** on "No tests found",
      #     so `continue-on-error` catches it and the tier reports a permanent
      #     phantom FAILURE — into the exact line QA reads to count graduations;
      #   * `--pass-with-no-tests` alone makes it exit 0, which is worse: a
      #     phantom PASS that counts a green toward graduating nothing, and three
      #     of those would "graduate" an empty set.
      # So the tier size is established first and the verdict has FOUR states:
      # success / failure / empty / unknown.
      - name: Count the informational tier
        id: info_count
        working-directory: e2e
        env:
          DATANIKA_E2E_SLOW: "1"
          DATANIKA_E2E_SKIP_SEED: "1"
          DATANIKA_E2E_USER_EMAIL: collected-count@datanika.test
        run: |
          LAST=$(npx playwright test --list --grep "@informational" --pass-with-no-tests | tail -1)
          N=$(printf '%s' "$LAST" | grep -oE '[0-9]+' | head -1)
          echo "count=${N:-0}" >> "$GITHUB_OUTPUT"
          echo "informational tier holds ${N:-0} spec(s) — playwright --list said: $LAST"

      - name: Run informational E2E specs (not gating)
        id: informational
        if: steps.info_count.outputs.count != '0'
        working-directory: e2e
        continue-on-error: true
        env:
          # Keep this run's JSON out of the gating report's file. The detector
          # above has already read it, so this is belt-and-braces — but a future
          # reorder that moved the detector down would otherwise have it grading
          # the informational tier while reporting on the gating one.
          PLAYWRIGHT_JSON_OUTPUT_NAME: results-informational.json
        run: npx playwright test --grep "@informational"

      # `continue-on-error` masks the step's conclusion, so the graduation
      # evidence has to be emitted explicitly rather than read off the tick.
      - name: Report informational tier result
        if: always()
        run: |
          COUNT='${{ steps.info_count.outputs.count }}'
          OUTCOME='${{ steps.informational.outcome }}'
          if [ -z "$COUNT" ]; then
            echo "INFORMATIONAL_RESULT=unknown"
            echo "::warning::Could not determine the informational tier size — the count step reported nothing. Neither green nor red; fix that step before trusting this line."
          elif [ "$COUNT" = "0" ]; then
            echo "INFORMATIONAL_RESULT=empty"
            echo "::notice::Informational tier is EMPTY — no spec is currently earning a track record. Neither a green nor a red: it counts toward nothing, exactly like a skip."
          elif [ "$OUTCOME" = "success" ]; then
            echo "INFORMATIONAL_RESULT=success"
            echo "::warning::Informational E2E specs PASSED. That is 1 green toward graduation — see PLAN_QA.md §E2E tiers. Three consecutive greens on dev and they move into the gating tier."
          else
            echo "INFORMATIONAL_RESULT=failure"
            echo "::notice::Informational E2E specs failed (not gating). Graduation counter resets to 0."
          fi

      # A green tick above is not evidence that anything ran — that is exactly
      # how core#484 hid for months. Print the collected count so the run log
      # carries the number, and fail if it collapses back toward the fast subset.
      - name: Assert the @slow specs were actually collected
        if: always()
        working-directory: e2e
        env:
          DATANIKA_E2E_SLOW: "1"
          DATANIKA_E2E_SKIP_SEED: "1"
          DATANIKA_E2E_USER_EMAIL: collected-count@datanika.test
        run: |
          # stderr is deliberately NOT suppressed: if --list itself breaks, the
          # count is 0 and the reason needs to be readable, not swallowed.
          LAST=$(npx playwright test --list | tail -1)
          echo "playwright --list said: $LAST"
          COUNT=$(printf '%s' "$LAST" | grep -oE '[0-9]+' | head -1)
          if [ "${COUNT:-0}" -lt 40 ]; then
            echo "::error::Only ${COUNT:-0} tests collected (expected 60+). The @slow specs are being filtered out again — see core#484."
            exit 1
          fi
          # A skip is neither tier and counts toward nothing (core#521). Say so
          # out loud: 16 specs skip today (SSO needs an Authentik that has been
          # down since the 2026-07-17 outage; overage belongs to the nightly
          # soak), and "46 passed" reads like full coverage until you notice.
          GATING=$(npx playwright test --list --grep-invert "@informational" | tail -1)
          # --pass-with-no-tests: an empty tier is legal (see above), and without
          # it this substitution exits 1 under `bash -e -o pipefail` and takes the
          # whole step — and therefore the e2e-staging job — down with it.
          INFO=$(npx playwright test --list --grep "@informational" --pass-with-no-tests | tail -1)
          echo "gating tier:        $GATING"
          echo "informational tier: $INFO"
          echo "::notice::Tier split — gating: ${GATING}; informational: ${INFO}. Skipped specs belong to NEITHER tier; a skip is not a green."

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      # Raw test-results fallback. The HTML report can fail to render when
      # the trace JSON is truncated (process killed mid-write, OOM, etc.) —
      # the raw traces + screenshots + videos survive that class of failure.
      # `always()`, not `failure()`: the concurrency group cancels this job
      # whenever another push lands on dev mid-run, and a CANCELLED job is not a
      # FAILED one — so the traces and screenshots from the run that just failed
      # were never uploaded. That happened on golden-path's first execution and
      # cost the entire diagnosis (core#501).
      - name: Upload raw test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # ── core#873: what is this job's red actually SAYING? ───────────────────
      # The filer and the pager below used to fire on job-level `failure()`, so
      # ANY failing step asserted a gating E2E failure. On 2026-09-01 a GitHub
      # artifact-service timeout on `Upload Playwright report` filed against
      # #858 and paged Telegram for a run whose every spec passed — and that run
      # was the post-promotion verification for a 15-commit production release.
      #
      # The job stays red for all of these. That is deliberate (#873: losing test
      # reports is worth knowing). What changes is what we CLAIM about the red.
      #
      # 🚨 TWO TRAPS, both of which turn this fix into a worse bug:
      #
      # 1. `if: steps.gating.outcome == 'failure'` — the spelling in #873's own
      #    body — is WRONG and fails CLOSED. An `if:` containing none of
      #    success()/always()/cancelled()/failure() is implicitly wrapped in
      #    `success() && ...`. When the gating step fails the job is already
      #    failing, so `success()` is false and the step is SKIPPED. The filer
      #    would never fire again, on any real gating failure — silence where we
      #    had a false alarm. Every condition below therefore leads with
      #    `always() &&`.
      # 2. Keying only on `== 'failure'` would go silent when the gating step
      #    never RAN (npm ci / browser install / SSH setup died). That is not an
      #    E2E failure, but it is not a pass either — the promotion pre-flight
      #    gets NO verdict, and this project's recurring defect is that an
      #    absence reads like clean. So `no_verdict` pages with its own wording
      #    instead of being swallowed.
      #
      # Cancellation is excluded on purpose: the `staging-deploy` concurrency
      # group cancels this job whenever another push lands on dev mid-run. That
      # is normal and documented above as "neither green nor red"; paging on it
      # would be a new false-alarm generator of exactly the kind being removed.
      - name: Classify what this job's result means
        id: verdict
        if: always()
        env:
          GATING_OUTCOME: ${{ steps.gating.outcome }}
          ATTRIB_OUTCOME: ${{ steps.attribution.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # !! `cancelled()` MUST NOT appear in this `env:`, and that is not
          # style. The status-check functions (success/failure/cancelled/always)
          # are valid ONLY inside an `if:`. Anywhere else -- a step `env:`
          # included -- GitHub rejects the whole FILE at template-validation
          # time, before a single job is created.
          #
          # Measured on run 33451148336 (core#880): conclusion `failure`, ZERO
          # jobs, `created_at == updated_at`, and `commits/<sha>/check-runs`
          # returning an EMPTY LIST rather than a red one. A PR in that state
          # displays NO checks at all -- indistinguishable from "CI has not
          # started yet" -- so it sits BLOCKED forever while looking pending.
          # `job.status` carries the same signal and IS allowed in a step
          # `env:`. Guarded by tests/test_deploy/test_ci_autofiler_trigger.py.
          # core#876: `wrong_build` is tested BEFORE `no_verdict`, and the order is the
          # point. An attribution refusal skips the gating step, so its outcome is
          # `skipped` and the old branching would classify it `no_verdict` — which pages
          # "the harness did not run" for a harness that is perfectly fine. The two states
          # need different responses: `no_verdict` means fix the harness, `wrong_build`
          # means re-deploy this commit.
          if [ "$JOB_STATUS" = "cancelled" ] || [ "$GATING_OUTCOME" = "cancelled" ]; then
            STATE=cancelled
          elif [ "$ATTRIB_OUTCOME" = "failure" ]; then
            STATE=wrong_build
          elif [ "$GATING_OUTCOME" = "failure" ]; then
            STATE=gating_failed
          elif [ "$GATING_OUTCOME" = "success" ]; then
            if [ "$JOB_STATUS" = "success" ]; then STATE=clean; else STATE=infra_only; fi
          else
            STATE=no_verdict
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "gating step outcome: $GATING_OUTCOME / job status: $JOB_STATUS / verdict: $STATE"
          case "$STATE" in
            gating_failed)
              echo "::error::GATING E2E specs FAILED. This red is a real test failure and holds the promotion." ;;
            infra_only)
              echo "::warning::The gating E2E specs PASSED — this job is red for a NON-TEST reason (artifact upload, or a step after the specs). Do not read this as an E2E failure; no issue was filed and no alert was paged. Find the failing step before treating the promotion as blocked (core#873)." ;;
            no_verdict)
              echo "::error::e2e-staging produced NO E2E VERDICT — the gating step did not run (outcome=$GATING_OUTCOME). This is neither a pass nor a test failure: the promotion pre-flight has nothing to read. Fix the harness, then re-run." ;;
            wrong_build)
              echo "::error::e2e-staging REFUSED to run: staging was not running this commit (core#876). This is NOT an E2E failure and NOT a broken harness — the specs were never started, so this commit still has no reading. Re-run this commit's deploy, then re-run this job. Do NOT re-deploy from inside a verifier (core#753)." ;;
            cancelled)
              echo "::notice::Job cancelled (staging-deploy concurrency group). A cancelled verdict is neither green nor red — the next push on dev produces the reading." ;;
            clean)
              echo "::notice::Gating E2E specs passed and the job is green." ;;
          esac

      - name: Telegram alert on failure
        if: always() && steps.verdict.outputs.state == 'gating_failed'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          SHORT_SHA=${COMMIT_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          TEXT=$(printf '\xf0\x9f\x9a\xa8 <b>Staging E2E failed</b>\n\n<b>Commit:</b> <code>%s</code>\n<b>Message:</b> %s\n<b>Run:</b> %s' \
            "$(esc "$SHORT_SHA")" "$(esc "$FIRST_LINE")" "$(esc "$RUN_URL")")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML"

      # No issue is filed for this one: a harness that never ran is not a test
      # failure and does not belong on the `e2e-staging-failure` dedup thread,
      # which exists to track failing SPECS. It still pages, because an absent
      # verdict is the state most likely to be mistaken for a pass.
      - name: Telegram alert when the E2E tier produced no verdict
        if: always() && steps.verdict.outputs.state == 'no_verdict'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GATING_OUTCOME: ${{ steps.gating.outcome }}
        run: |
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          SHORT_SHA=${COMMIT_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          TEXT=$(printf '\xe2\x9a\xa0\xef\xb8\x8f <b>Staging E2E: NO VERDICT</b>\n\nThe gating step did not run (outcome: %s), so this run says nothing about the specs either way. The promotion pre-flight has nothing to read.\n\n<b>Commit:</b> <code>%s</code>\n<b>Message:</b> %s\n<b>Run:</b> %s' \
            "$(esc "$GATING_OUTCOME")" "$(esc "$SHORT_SHA")" "$(esc "$FIRST_LINE")" "$(esc "$RUN_URL")")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML"

      - name: File issue on failure
        if: always() && steps.verdict.outputs.state == 'gating_failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          # Dedup: comment on this CHANNEL's open issue if one exists, else open
          # one. Without this, a red streak files one issue PER SHA — on
          # 2026-07-22 that produced SIX issues for TWO causes inside two hours
          # (#495, #498 harness; #506, #512, #513, #519 golden-path), which
          # buries the real signal in bookkeeping and makes a two-cause outage
          # look like six problems.
          #
          # ⚠️ The dedup key is `e2e-staging-failure`, NOT `e2e-failure` (#818).
          # `e2e-failure` is the human-facing UMBRELLA label — e2e-staging and
          # e2e-sso both write it, so keying dedup on it makes an SSO failure
          # comment onto a staging thread and vice versa. Each filer gets its own
          # channel label; `overage-e2e-nightly.yml` had this right all along and
          # is the pattern being followed here. Never dedup on `e2e-failure`.
          gh label create e2e-staging-failure --repo ${{ github.repository }} \
            --color D93F0B --description "Dedup channel: e2e-staging (auto-filed)" --force || true
          gh label create e2e-failure --repo ${{ github.repository }} \
            --color D93F0B --description "Umbrella: any auto-filed E2E failure. NOT a dedup key." --force || true
          existing=$(gh issue list \
            --repo ${{ github.repository }} \
            --label e2e-staging-failure \
            --state open \
            --limit 1 \
            --json number --jq '.[0].number // empty')
          # printf with the strings indented INSIDE the block scalar: a body
          # line at column 0 terminates the YAML block early and a leading `*`
          # is then read as an alias — the exact break that stopped the Paddle
          # nightly compiling for three months (cloud#77).
          body=$(printf '%s\n' \
            "**Run:** $RUN_URL" \
            "**Commit:** \`$SHORT_SHA\`" \
            "**Message:** $FIRST_LINE" \
            "**Report:** playwright-report artifact on the run page" \
            "" \
            "This is filed on the GATING step's own outcome, not on the job's conclusion (core#873)." \
            "So it means the gating specs themselves went red — not that some other step failed." \
            "Informational specs cannot open this either; they are \`continue-on-error\` (core#521).")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo ${{ github.repository }} \
              --body "Another e2e-staging failure on \`$SHORT_SHA\`: $RUN_URL"
          else
            gh issue create \
              --repo ${{ github.repository }} \
              --title "[QA] e2e-staging failure on $SHORT_SHA" \
              --body "$body" \
              --label "e2e-staging-failure" \
              --label "e2e-failure"
          fi

      # ── core#757: the same two alerts, for a run that stayed GREEN ──────────
      # These are NOT `if: failure()`. That is the entire point: the run they
      # exist to report on usually concludes `success`, which is why nothing
      # fired for de00365. They branch on the detector's own output instead.
      #
      # ⚠️ core#877 (QA): this alert used to open with the hardcoded sentence
      # "The run is GREEN." It fired on `94b1ec9`, where `e2e-staging` concluded
      # `failure`. The `if:` was right and the sentence beside it was a claim
      # about a state the step never checked — the same defect as core#873 one
      # step further along, and the reason the colour is now DERIVED from the
      # `verdict` step rather than asserted. A run can be flaky and red at once.
      - name: Telegram alert on flaky gating spec
        if: always() && steps.flaky_gate.outputs.status == 'flaky'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FLAKY_SPECS: ${{ steps.flaky_gate.outputs.specs }}
          VERDICT: ${{ steps.verdict.outputs.state }}
        run: |
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          SHORT_SHA=${COMMIT_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          case "$VERDICT" in
            clean)         STATE="The run is GREEN." ;;
            infra_only)    STATE="The gating specs PASSED; the run is red for a NON-TEST reason (core#873)." ;;
            gating_failed) STATE="The run is RED and a gating spec ALSO retried into a pass — two findings, not one." ;;
            cancelled)     STATE="The run was CANCELLED, so its verdict is neither green nor red." ;;
            *)             STATE="Run state: ${VERDICT:-unknown}." ;;
          esac
          TEXT=$(printf '\xe2\x9a\xa0\xef\xb8\x8f <b>Staging E2E: GATING spec was FLAKY</b>\n\n%s A gating spec failed and passed on retry, which hides an intermittent product bug (QA_RULES §12).\n\n<b>Commit:</b> <code>%s</code>\n<b>Message:</b> %s\n<b>Specs:</b> %s\n<b>Run:</b> %s' \
            "$(esc "$STATE")" "$(esc "$SHORT_SHA")" "$(esc "$FIRST_LINE")" "$(esc "$FLAKY_SPECS")" "$(esc "$RUN_URL")")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML"

      - name: File issue on flaky gating spec
        if: always() && steps.flaky_gate.outputs.status == 'flaky'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          FLAKY_SPECS: ${{ steps.flaky_gate.outputs.specs }}
          VERDICT: ${{ steps.verdict.outputs.state }}
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          # core#877: derive the run's colour, never assert it. This body used to
          # open "The run is GREEN" unconditionally; a run can be flaky AND red.
          case "$VERDICT" in
            clean)         STATE="**The run is GREEN.**" ;;
            infra_only)    STATE="**The gating specs PASSED. The run is red for a NON-TEST reason (core#873), not for this.**" ;;
            gating_failed) STATE="**The run is RED on the gating tier AND a gating spec retried into a pass. Two findings, not one.**" ;;
            cancelled)     STATE="**The run was CANCELLED** — its verdict is neither green nor red." ;;
            *)             STATE="**Run state: ${VERDICT:-unknown}.**" ;;
          esac
          # Same dedup CHANNEL as a red (`e2e-staging-failure`): a flaky gating
          # spec is the same event as a red one that happened to retry into a
          # green, so it belongs on the same thread rather than in a parallel one.
          # Sharing a channel WITHIN a job is deliberate; sharing one ACROSS jobs
          # is the #818 defect. See the note on the red filer above.
          gh label create e2e-staging-failure --repo ${{ github.repository }} \
            --color D93F0B --description "Dedup channel: e2e-staging (auto-filed)" --force || true
          gh label create e2e-failure --repo ${{ github.repository }} \
            --color D93F0B --description "Umbrella: any auto-filed E2E failure. NOT a dedup key." --force || true
          existing=$(gh issue list \
            --repo ${{ github.repository }} \
            --label e2e-staging-failure \
            --state open \
            --limit 1 \
            --json number --jq '.[0].number // empty')
          body=$(printf '%s\n' \
            "$STATE This is not a red that was retried away — it is a red that Playwright reported as \`flaky\` and exited 0 on." \
            "" \
            "**Run:** $RUN_URL" \
            "**Commit:** \`$SHORT_SHA\`" \
            "**Message:** $FIRST_LINE" \
            "**Flaky gating specs:** $FLAKY_SPECS" \
            "" \
            "\`docs/QA_RULES.md\` §12 — a retry around container startup hides nothing; a retry around an assertion hides a product bug. These are gating specs, so this is the second kind." \
            "" \
            "core#757 is why this alert exists: core#744 reached production because a run in exactly this shape concluded \`success\`.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo ${{ github.repository }} \
              --body "$body"
          else
            gh issue create \
              --repo ${{ github.repository }} \
              --title "[QA] e2e-staging GATING spec flaky (green run) on $SHORT_SHA" \
              --body "$body" \
              --label "e2e-staging-failure" \
              --label "e2e-failure"
          fi

  # SSO E2E tests — runs 16 Playwright specs (OIDC + SAML + edge cases) against the
  # staging app with a disposable Authentik IdP on pointer.gr.
  #
  # Topology: Authentik on pointer.gr :9000 (same host as staging), SSH tunnel to the
  # CI runner so the Playwright browser can reach the IdP login form. Bootstrap + seed
  # run on pointer.gr via SSH (they need docker exec). The IdP and the app under test
  # MUST stay co-located: they are joined by a docker network alias, and splitting them
  # is exactly what the 2026-07-17 migration did.
  #
  # Re-enabled 2026-08-31 (core#714) after six weeks dark. It was switched off on
  # 2026-07-17 in the Hetzner→pointer.gr migration because the disposable IdP lived on
  # the box that was terminated, and #298 — which tracked rebuilding it — was closed
  # having rebuilt only two of its three subjects.
  #
  # ⚠️ Nothing needed rebuilding. The whole server-side topology was rehearsed by hand
  # on pointer.gr on 2026-08-31 and worked first time: Authentik came up, bootstrap
  # exited 0 (OIDC + SAML providers created), the staging container reached the IdP over
  # the docker alias (HTTP 200) with a consistent OIDC issuer, and the configs seeded
  # (orgs e2e-fixture / e2e-fixture-saml). Peak footprint 367 MiB; prod was unaffected.
  # What was missing was not a host — it was someone running it.
  #
  # ⚠️ INFORMATIONAL TIER (core#521), which is what `continue-on-error` below encodes.
  # Sixteen specs that have not run in six weeks are NEW specs for gating purposes
  # regardless of their file dates. They graduate to gating after three consecutive
  # greens on dev, and demotion afterwards needs an issue. Do NOT add this to the
  # required checks on dev until it has earned that — a permanently-red gate is how a
  # whole tier gets ignored, which is the history behind #222, #230 and #232.
  e2e-sso:
    # core#765: its OWN queued group, not `staging-deploy`. This job mutates things nothing
    # else touches -- a fixed compose project name `e2e`, fixed container names, host port
    # 9000, a `docker network connect` onto datanika-staging_default, and
    # /opt/datanika/e2e-sso/.sso-fixture.json rewritten in place -- all on the shared
    # production box. Two overlapping runs interleave badly and the teardown is the sharp
    # edge: run A's `if: always()` `down -v` destroys run B's IdP mid-test and then
    # `rm -rf`s the directory B is reading its fixture from. B fails with connection errors
    # that look like a broken SSO implementation and are not.
    #
    # ⚠️ `cancel-in-progress: false` is the load-bearing half. `true` would cancel a run
    # BETWEEN its `up -d` and its `if: always()` cleanup, and a cancelled job's always()
    # steps are not guaranteed to complete -- leaving four Authentik containers and a network
    # attachment stranded on the production box. That is core#536's failure mode with an IdP
    # attached, and recovery then has to clean up by LABEL, because compose no longer
    # recognises a renamed container as that service.
    #
    # ⚠️ Its own group and not `staging-deploy`, deliberately, with a residual: this job is
    # therefore still exposed to a `deploy-staging` recreating the staging app underneath it.
    # Sharing `staging-deploy` would close that but serialise SSO behind the ~10-minute
    # e2e-staging, roughly doubling staging latency for every push, and the two mutate
    # different things. e2e-sso is the informational tier (core#521) and does not gate a
    # merge, so a collision costs a spurious red rather than a blocked one. Revisit before
    # it graduates to gating -- a collision-induced red RESETS the three-consecutive-greens
    # counter, which is the exact mechanism by which #222, #230 and #232 ended with a whole
    # tier being ignored.
    concurrency:
      group: staging-e2e-sso
      cancel-in-progress: false
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.POINTER_SSH_KEY }}
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # Keepalive: long, output-silent remote steps otherwise drop the session with
          # `client_loop: send disconnect: Broken pipe` (exit 255). Applied to every SSH
          # setup in this file, not just the one that happened to fail.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 120\n  TCPKeepAlive yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # core#876. Before Authentik: bringing up four containers on the production box to
      # test somebody else's build wastes ~5 minutes and leaves a teardown to get wrong.
      - name: Assert staging is running THIS commit
        id: attribution
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        # SSH_KEY_PATH is deliberately NOT set here: GitHub does no shell expansion in an
        # `env:` value, so `~/.ssh/id_rsa` would arrive as a literal tilde and `ssh -i`
        # would fail on a path that does not exist. The script defaults to
        # "$HOME/.ssh/id_rsa", expanded by the shell that actually runs it.
        run: bash scripts/assert-staging-sha.sh

      - name: Start Authentik on staging server
        env:
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        run: |
          ssh root@$SSH_HOST "mkdir -p /opt/datanika/e2e-sso/scripts"
          scp e2e/docker-compose.test.yml root@$SSH_HOST:/opt/datanika/e2e-sso/
          scp e2e/scripts/bootstrap-authentik.sh root@$SSH_HOST:/opt/datanika/e2e-sso/scripts/
          scp e2e/scripts/seed-sso-configs.py root@$SSH_HOST:/opt/datanika/e2e-sso/scripts/

          # Start with project name 'e2e' so containers are e2e-authentik-{db,server}-1
          # (matches the docker exec names in bootstrap-authentik.sh)
          ssh root@$SSH_HOST "cd /opt/datanika/e2e-sso && docker compose -p e2e -f docker-compose.test.yml up -d"

          # Wait for Authentik to be READY, not merely "healthy" (core#714).
          #
          # ⚠️ Two things measured on pointer.gr 2026-08-31, and the old 30x10s
          # container-health wait was wrong on both counts:
          #   1. Cold first boot spends ~315s in django migrations. The old budget was
          #      300s, so it expired roughly 15s BEFORE the container went healthy --
          #      a job that would have failed while nothing was actually broken.
          #   2. `ak healthcheck` probes /-/health/live/. Measured: live returned 200
          #      while /-/health/ready/ was still returning 502, so docker reported
          #      "healthy" for a server that could not yet serve an API request.
          #      Waiting on container health is waiting on the wrong signal.
          # Poll readiness directly, and give it 600s.
          ssh root@$SSH_HOST 'for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:9000/-/health/ready/)
            echo "attempt $i: ready=$code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Authentik never became ready within 600s"
          docker ps -a --filter name=e2e --format "{{.Names}}\t{{.Status}}"
          docker inspect --format "oom={{.State.OOMKilled}} restarts={{.RestartCount}}" e2e-authentik-server-1
          docker logs e2e-authentik-server-1 --tail 50
          exit 1'

      - name: Bootstrap Authentik (OIDC + SAML providers)
        env:
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        run: |
          ssh root@$SSH_HOST "cd /opt/datanika/e2e-sso && DATANIKA_E2E_BASE_URL=https://staging-app.datanika.io bash scripts/bootstrap-authentik.sh"

      - name: Bridge staging container to Authentik network
        env:
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        run: |
          # Staging container needs to reach Authentik for OIDC token exchange.
          # Connect authentik-server to datanika-staging_default with an alias
          # so staging can resolve it by the chosen hostname.
          ssh root@$SSH_HOST "docker network connect --alias e2e-authentik-server datanika-staging_default e2e-authentik-server-1 2>&1" || \
            echo "Network connect failed or already connected"

          # Verify staging can reach Authentik by the alias
          ssh root@$SSH_HOST "docker exec \$(/opt/datanika-staging/active-app.sh) curl -sf --max-time 5 http://e2e-authentik-server:9000/-/health/ready/" && \
            echo "Staging → Authentik OK" || \
            { echo "FATAL: staging can't reach e2e-authentik-server:9000"; exit 1; }

          # Rewrite fixture URLs: localhost:9000 → e2e-authentik-server:9000
          # Same hostname resolves from:
          #   - Staging container: via docker DNS alias → Authentik container
          #   - CI runner: via /etc/hosts -> 127.0.0.1 -> SSH tunnel -> pointer.gr:9000
          #   - Authentik self-request: Host header matches, OIDC issuer consistent
          ssh root@$SSH_HOST "sed -i 's|http://localhost:9000|http://e2e-authentik-server:9000|g' /opt/datanika/e2e-sso/.sso-fixture.json"
          ssh root@$SSH_HOST "cat /opt/datanika/e2e-sso/.sso-fixture.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(\"Fixture URL:\", d[\"authentik_url\"])'"

      - name: Seed SSO configs in staging DB
        env:
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        run: |
          ssh root@$SSH_HOST "docker cp /opt/datanika/e2e-sso/.sso-fixture.json \$(/opt/datanika-staging/active-app.sh):/app/e2e/.sso-fixture.json"
          # Call the interpreter directly, NOT `uv run` (WORKFLOW_RULES §3): `uv run`
          # re-syncs the venv from uv.lock before running, so it mutates a live staging
          # container on the way to seeding it. Verified working on pointer.gr
          # 2026-08-31 -- seeded orgs e2e-fixture (OIDC) and e2e-fixture-saml (SAML).
          ssh root@$SSH_HOST "docker exec \$(/opt/datanika-staging/active-app.sh) /app/.venv/bin/python e2e/scripts/seed-sso-configs.py"

      - name: Open SSH tunnel to Authentik + hosts entry
        env:
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        run: |
          # SSH tunnel: CI runner localhost:9000 -> pointer.gr:9000 -> Authentik
          ssh -f -N -L 9000:localhost:9000 root@$SSH_HOST

          # /etc/hosts: e2e-authentik-server → 127.0.0.1 (tunnel endpoint)
          # This matches the hostname in the fixture + SSO config, so Playwright
          # browser can resolve and reach Authentik via the tunnel.
          echo "127.0.0.1 e2e-authentik-server" | sudo tee -a /etc/hosts

          # Verify both paths
          for i in $(seq 1 10); do
            curl -sf http://localhost:9000/-/health/ready/ > /dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://e2e-authentik-server:9000/-/health/ready/ > /dev/null || {
            echo "e2e-authentik-server hostname not reachable via tunnel"
            exit 1
          }
          echo "Tunnel + hostname OK"

      - name: Diagnose DNS + CF Access from CI runner
        env:
          DATANIKA_STAGING_CF_ACCESS_CLIENT_ID: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_ID }}
          DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "=== DNS resolution ==="
          nslookup staging-app.datanika.io || true
          echo ""
          echo "=== curl without CF headers ==="
          curl -sI --max-time 10 https://staging-app.datanika.io/ 2>&1 | head -15 || true
          echo ""
          echo "=== curl with CF Access headers ==="
          curl -sI --max-time 10 \
            -H "CF-Access-Client-Id: $DATANIKA_STAGING_CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET" \
            https://staging-app.datanika.io/ 2>&1 | head -15 || true
          echo ""
          echo "=== curl SSO login route with CF headers ==="
          curl -sI --max-time 10 \
            -H "CF-Access-Client-Id: $DATANIKA_STAGING_CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET" \
            https://staging-app.datanika.io/api/auth/sso/login/e2e-fixture 2>&1 | head -15 || true
          echo ""
          echo "=== Authentik tunnel check (localhost + service name) ==="
          curl -sI --max-time 10 http://localhost:9000/-/health/ready/ 2>&1 | head -5 || true
          curl -sI --max-time 10 http://e2e-authentik-server:9000/-/health/ready/ 2>&1 | head -5 || true
          echo ""
          echo "=== Staging → Authentik reachability ==="
          ssh root@${{ secrets.POINTER_HOST }} "docker exec \$(/opt/datanika-staging/active-app.sh) curl -sI --max-time 5 http://e2e-authentik-server:9000/-/health/ready/ 2>&1 | head -3" || true

      # ⚠️ `id: sso_specs` is load-bearing — same reason as `e2e-staging`'s
      # `id: gating` (core#873). Two steps below this one run on `always()` and
      # can fail a job whose specs all passed: the artifact upload (the exact
      # failure that produced the false report on 2026-09-01) and the Authentik
      # cleanup, whose `|| true` is INSIDE the remote command string, so an ssh
      # that cannot connect still fails the step.
      - name: Run SSO specs
        id: sso_specs
        working-directory: e2e
        env:
          CI: "true"
          DATANIKA_E2E_SSO_AUTHENTIK: "1"
          DATANIKA_E2E_SLOW: "1"
          DATANIKA_E2E_SKIP_SEED: "1"
          DATANIKA_E2E_USER_EMAIL: "sso-user@datanika.test"
          DATANIKA_E2E_BASE_URL: https://staging-app.datanika.io
          DATANIKA_E2E_BACKEND_URL: https://staging-app.datanika.io
          DATANIKA_E2E_ORG_SLUG: e2e-fixture
          DATANIKA_E2E_SAML_ORG_SLUG: e2e-fixture-saml
          DATANIKA_STAGING_CF_ACCESS_CLIENT_ID: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_ID }}
          DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET: ${{ secrets.DATANIKA_STAGING_CF_ACCESS_CLIENT_SECRET }}
        run: npx playwright test sso-

      # core#876, the half `e2e-staging` does not need. This job holds `staging-e2e-sso`,
      # NOT `staging-deploy` — deliberately, because it owns a compose project of its own
      # (core#765). The cost of that correct decision is that a deploy CAN land underneath
      # it, so the assertion made before Authentik came up is stale by the time the specs
      # finish. Re-assert: if staging was replaced mid-run, these specs graded a moving
      # target and the verdict does not belong to this commit either way it went.
      #
      # `always()` on purpose — a green that is not attributable is exactly as misleading
      # as a red one, and it is the direction nobody checks.
      - name: Re-assert staging was still THIS commit at the end
        id: attribution_post
        if: always() && steps.attribution.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        # SSH_KEY_PATH is deliberately NOT set here: GitHub does no shell expansion in an
        # `env:` value, so `~/.ssh/id_rsa` would arrive as a literal tilde and `ssh -i`
        # would fail on a path that does not exist. The script defaults to
        # "$HOME/.ssh/id_rsa", expanded by the shell that actually runs it.
        run: bash scripts/assert-staging-sha.sh

      - name: Upload SSO Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sso-playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload SSO raw test-results (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sso-test-results
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup Authentik
        if: always()
        env:
          SSH_HOST: ${{ secrets.POINTER_HOST }}
        run: |
          # Disconnect authentik from staging network before teardown
          ssh root@$SSH_HOST "docker network disconnect datanika-staging_default e2e-authentik-server-1 2>/dev/null || true"
          ssh root@$SSH_HOST "cd /opt/datanika/e2e-sso && docker compose -p e2e -f docker-compose.test.yml down -v 2>/dev/null; rm -rf /opt/datanika/e2e-sso" || true

      # ⚠️ ORDER IS LOAD-BEARING: the filer runs BEFORE the Telegram step, and the
      # Telegram step branches on what the filer did. See #818 — this job was red on
      # every push for a real product bug (#830) and filed a fresh issue AND paged the
      # founder each time: ten issues and ten pages for one condition. The tracker was
      # ~15% duplicate noise and the alarm had stopped carrying information.
      # core#873, same classifier as `e2e-staging`. See the long note there for
      # why every condition leads with `always() &&` (a bare
      # `steps.x.outcome == 'failure'` is implicitly `success() && ...` and so
      # fails CLOSED — it would never fire again), and why a gating step that
      # never RAN pages under its own wording instead of being swallowed.
      - name: Classify what this job's result means
        id: verdict
        if: always()
        env:
          SPECS_OUTCOME: ${{ steps.sso_specs.outcome }}
          ATTRIB_OUTCOME: ${{ steps.attribution.outcome }}
          ATTRIB_POST_OUTCOME: ${{ steps.attribution_post.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # No `cancelled()` in this `env:` -- see the e2e-staging classifier
          # above for why it invalidates the entire workflow file at validation
          # time and produces a run with zero jobs and zero check-runs.
          #
          # core#876: EITHER attribution check failing means this run cannot honestly
          # report on this commit, whichever way the specs went. Tested before the specs
          # so a passing suite on the wrong build is not classified `clean`.
          if [ "$JOB_STATUS" = "cancelled" ] || [ "$SPECS_OUTCOME" = "cancelled" ]; then
            STATE=cancelled
          elif [ "$ATTRIB_OUTCOME" = "failure" ] || [ "$ATTRIB_POST_OUTCOME" = "failure" ]; then
            STATE=wrong_build
          elif [ "$SPECS_OUTCOME" = "failure" ]; then
            STATE=specs_failed
          elif [ "$SPECS_OUTCOME" = "success" ]; then
            if [ "$JOB_STATUS" = "success" ]; then STATE=clean; else STATE=infra_only; fi
          else
            STATE=no_verdict
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "SSO specs outcome: $SPECS_OUTCOME / job status: $JOB_STATUS / verdict: $STATE"
          case "$STATE" in
            specs_failed)
              echo "::error::SSO E2E specs FAILED. This red is a real test failure." ;;
            infra_only)
              echo "::warning::The SSO specs PASSED — this job is red for a NON-TEST reason (artifact upload, or the Authentik cleanup). No issue was filed and no alert was paged. Do not read this as an SSO regression (core#873)." ;;
            no_verdict)
              echo "::error::e2e-sso produced NO VERDICT — the specs did not run (outcome=$SPECS_OUTCOME), most likely an Authentik bootstrap or tunnel failure. Neither a pass nor a regression." ;;
            wrong_build)
              echo "::error::e2e-sso cannot report on this commit: staging was not running it (pre=$ATTRIB_OUTCOME post=$ATTRIB_POST_OUTCOME, core#876). If the POST check is the failing one the specs DID run, but against a stack that changed underneath them — so a green here would not have been this commit's green either. Not an SSO regression; re-deploy this commit and re-run." ;;
            cancelled)
              echo "::notice::Job cancelled — neither green nor red." ;;
            clean)
              echo "::notice::SSO specs passed and the job is green." ;;
          esac

      # No issue is filed here: a harness that never came up is not a product
      # bug and does not belong on the `e2e-sso-failure` dedup thread, which
      # #830 is actively using. It pages, because an absent verdict on a job
      # that is normally red is the easiest thing in this pipeline to misread
      # as a fix.
      - name: Telegram alert when the SSO tier produced no verdict
        if: always() && steps.verdict.outputs.state == 'no_verdict'
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SPECS_OUTCOME: ${{ steps.sso_specs.outcome }}
        run: |
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          SHORT_SHA=${COMMIT_SHA:0:7}
          TEXT=$(printf '\xe2\x9a\xa0\xef\xb8\x8f <b>SSO E2E: NO VERDICT</b>\n\nThe SSO specs did not run (outcome: %s) — the IdP or the tunnel most likely never came up. This run says nothing about SSO either way; in particular it is NOT evidence that #830 is fixed.\n\n<b>Commit:</b> <code>%s</code>\n<b>Run:</b> %s' \
            "$(esc "$SPECS_OUTCOME")" "$(esc "$SHORT_SHA")" "$(esc "$RUN_URL")")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML"

      - name: File issue on failure
        id: file_issue
        if: always() && steps.verdict.outputs.state == 'specs_failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          # ⚠️ The dedup key is `e2e-sso-failure`, and copying the e2e-staging block
          # verbatim would have been WRONG: that copy keys on `e2e-failure`, which both
          # jobs write, so a staging failure would comment onto an SSO thread and vice
          # versa. `e2e-failure` stays as the human-facing umbrella label so
          # `--label e2e-failure` still finds everything; it is never a dedup key.
          # `tests/test_deploy/test_ci_autofiler_dedup.py` enforces both halves.
          gh label create e2e-sso-failure --repo ${{ github.repository }} \
            --color D93F0B --description "Dedup channel: e2e-sso (auto-filed)" --force || true
          gh label create e2e-failure --repo ${{ github.repository }} \
            --color D93F0B --description "Umbrella: any auto-filed E2E failure. NOT a dedup key." --force || true
          existing=$(gh issue list \
            --repo ${{ github.repository }} \
            --label e2e-sso-failure \
            --state open \
            --limit 1 \
            --json number --jq '.[0].number // empty')
          # printf with the strings indented INSIDE the block scalar. The previous
          # version used a multi-line shell double-quoted string, so every continuation
          # line carried ten leading spaces into the issue body and rendered as a code
          # block (see #824 and its nine siblings).
          body=$(printf '%s\n' \
            "**Run:** $RUN_URL" \
            "**Commit:** \`$SHORT_SHA\`" \
            "**Message:** $FIRST_LINE" \
            "**Report:** playwright-report-sso artifact on the run page" \
            "" \
            "e2e-sso is the INFORMATIONAL tier (core#521) — it does not gate a merge." \
            "Repeat failures comment here rather than opening a new issue (#818).")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo ${{ github.repository }} \
              --body "Another e2e-sso failure on \`$SHORT_SHA\`: $RUN_URL"
            echo "dedup=commented" >> "$GITHUB_OUTPUT"
            echo "issue=$existing" >> "$GITHUB_OUTPUT"
          else
            created=$(gh issue create \
              --repo ${{ github.repository }} \
              --title "[QA] e2e-sso failure on $SHORT_SHA" \
              --body "$body" \
              --label "e2e-sso-failure" \
              --label "e2e-failure")
            echo "dedup=created" >> "$GITHUB_OUTPUT"
            echo "issue=${created##*/}" >> "$GITHUB_OUTPUT"
          fi

      # Page once per CONDITION, not once per push. This is a re-arming filter, not a
      # mute: the alarm fires whenever a NEW `e2e-sso-failure` thread is opened, and it
      # re-arms by itself the moment that thread is closed. A condition the founder has
      # already been paged about, and which is still open on the tracker, does not page
      # again.
      #
      # ⚠️ The polarity is deliberately FAIL-OPEN. If the filer step itself dies, its
      # outputs are unset, `'' != 'commented'` is true, and this still pages — losing
      # the issue must never also lose the alert.
      #
      # ⚠️ core#873: the `state == 'specs_failed'` conjunct is REQUIRED, not
      # belt-and-braces. Gating the filer alone would not have fixed this step:
      # on an artifact-upload red the filer is skipped, so `dedup` is unset,
      # `'' != 'commented'` is true, `failure()` is true — and it pages anyway.
      # The fail-open polarity above is preserved: if the filer DIES while the
      # specs really failed, `dedup` is still unset and this still pages.
      - name: Telegram alert on new failure
        if: always() && steps.verdict.outputs.state == 'specs_failed' && steps.file_issue.outputs.dedup != 'commented'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE: ${{ steps.file_issue.outputs.issue }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          SHORT_SHA=${COMMIT_SHA:0:7}
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          TEXT=$(printf '\xf0\x9f\x9a\xa8 <b>SSO E2E failed</b>\n\n<b>Commit:</b> <code>%s</code>\n<b>Message:</b> %s\n<b>Issue:</b> #%s\n<b>Run:</b> %s\n\nFurther failures of this condition will comment on the issue instead of paging.' \
            "$(esc "$SHORT_SHA")" "$(esc "$FIRST_LINE")" "$(esc "${ISSUE:-?}")" "$(esc "$RUN_URL")")
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=1201995" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML"

  # Prod post-deploy smoke gates (smoke = URL gate, smoke-prod = pytest shape)
  # moved to .github/workflows/deploy-pointer.yml — they run after the prod deploy
  # there (needs: deploy), since prod deploy left ci.yml on 2026-07-17.
